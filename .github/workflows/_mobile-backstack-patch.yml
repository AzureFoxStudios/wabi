name: Mobile back-stack source patch

on:
  push:
    branches:
      - fix/mobile-native-green-2026-09-13
    paths:
      - '.github/workflows/_mobile-backstack-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-native-green-2026-09-13
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply source patch
        run: python scripts/mobile-backstack-patch.py
      - name: Run focused mobile shell tests
        run: |
          cd frontend
          bun test src/lib/mobileShellModel.test.ts src/lib/pwa/mobileViewportModel.test.ts
      - name: Commit source patch and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wabi-mobile-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/_mobile-backstack-patch.yml scripts/mobile-backstack-patch.py
          git add frontend/src/lib/mobileShellModel.ts frontend/src/lib/mobileShellModel.test.ts frontend/src/lib/components/MainLayout.svelte
          git commit -m 'fix(mobile): make Back order explicit and edge swipes strict'
          git push origin HEAD:fix/mobile-native-green-2026-09-13
