name: Workspace integrate and check
on:
  push:
    branches: [codex/docs-sheets-present-20260917]
    paths: [.github/workflows/workspace-integrate.yml, scripts/workspace-integrate-once.py, scripts/workspace-ui-integrate.py, scripts/workspace-compile-repairs.py]
permissions:
  contents: read
concurrency:
  group: workspace-integration-20260917
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
  NO_COLOR: '1'
  FORCE_COLOR: '0'
jobs:
  integrate:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/docs-sheets-present-20260917
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-20260917
          cache-on-failure: true
      - name: Apply isolated branch integrations
        run: |
          python3 scripts/workspace-compile-repairs.py
          python3 scripts/workspace-integrate-once.py
          python3 scripts/workspace-ui-integrate.py
          cargo update -p yrs --precise 0.24.0
          git config user.name 'Wabi workspace integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --name-status
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'fix(workspace): reconcile compiler findings and wire verified package boundaries'
            git pull --rebase origin codex/docs-sheets-present-20260917
            git push origin HEAD:refs/heads/codex/docs-sheets-present-20260917
          fi
          git rev-parse HEAD
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check all frontend source
        id: frontend_check
        continue-on-error: true
        working-directory: frontend
        run: npm run check > /tmp/workspace-check.log 2>&1
      - name: Test native workbook and deck models
        id: frontend_tests
        continue-on-error: true
        working-directory: frontend
        run: bun test src/lib/workspaces > /tmp/workspace-unit.log 2>&1
      - name: Build real expanded frontend
        id: frontend_build
        continue-on-error: true
        working-directory: frontend
        env:
          STATIC_BUILD: '1'
          WABI_WORKSPACE_ADDONS: all
        run: npm run build > /tmp/workspace-build.log 2>&1
      - name: Check actual Authority
        id: rust_check
        continue-on-error: true
        run: cargo check -p wabi-server --locked > /tmp/workspace-rust.log 2>&1
      - name: Run private workspace storage tests
        id: rust_tests
        if: steps.rust_check.outcome == 'success'
        continue-on-error: true
        run: |
          cargo test -p wabidb workspace --locked > /tmp/workspace-wabidb-tests.log 2>&1
          cargo test -p wabi-server workspace --lib --locked > /tmp/workspace-server-tests.log 2>&1
      - name: Test real API authorization, merge, revocation and crash replay
        id: contract_tests
        if: steps.rust_check.outcome == 'success'
        continue-on-error: true
        run: timeout 600 cargo test -p wabi-server --test workspace_contract --locked -- --nocapture > /tmp/workspace-contract-tests.log 2>&1
      - name: Readable diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for file in sorted(Path('/tmp').glob('workspace-*.log')):
              text=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',file.read_text(errors='replace'))
              lines=text.splitlines()
              print('\n===== '+file.name+' =====')
              indices=set()
              for i,line in enumerate(lines):
                  if re.search(r'(^Error:|^error\[|^error:|svelte-check found|test result:|^FAIL|^fail\b|^\(fail\)|^error\b)',line):
                      indices.update(range(max(0,i-2),min(len(lines),i+14)))
              for i in sorted(indices)[:800]: print(lines[i])
              print('\n'.join(lines[-12:]))
          PY
      - name: Strict result
        if: always()
        env:
          FRONTEND_CHECK: ${{ steps.frontend_check.outcome }}
          FRONTEND_TESTS: ${{ steps.frontend_tests.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
          RUST_CHECK: ${{ steps.rust_check.outcome }}
          RUST_TESTS: ${{ steps.rust_tests.outcome }}
          CONTRACT_TESTS: ${{ steps.contract_tests.outcome }}
        run: |
          git rev-parse HEAD
          printf '%s\n' "frontend_check=$FRONTEND_CHECK frontend_tests=$FRONTEND_TESTS frontend_build=$FRONTEND_BUILD rust_check=$RUST_CHECK rust_tests=$RUST_TESTS contract_tests=$CONTRACT_TESTS"
          test "$FRONTEND_CHECK" = success && test "$FRONTEND_TESTS" = success && test "$FRONTEND_BUILD" = success && test "$RUST_CHECK" = success && test "$RUST_TESTS" = success && test "$CONTRACT_TESTS" = success
