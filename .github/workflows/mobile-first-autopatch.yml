name: Mobile first autopatch

on:
  push:
    branches:
      - feat/mobile-first-2026-09-12

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-autopatch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-first-2026-09-12
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python3 scripts/mobile-first-autopatch.py

      - name: Install frontend dependencies
        run: cd frontend && npm ci --no-audit --no-fund

      - name: Run mobile shell tests
        run: cd frontend && npx bun test src/lib/mobileShellModel.test.ts

      - name: Run frontend check
        run: cd frontend && npm run check

      - name: Commit validated patch
        run: |
          git config user.name "Wabi Mobile Bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/lib/components/MainLayout.svelte frontend/src/styles/components/mobile-shell.css
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "feat(mobile): keep phone navigation dependable [mobile-autopatch]"
          git push origin HEAD:feat/mobile-first-2026-09-12
