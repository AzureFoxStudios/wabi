name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain-file: rust-toolchain.toml

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Run CI
        run: bash scripts/ci.sh

