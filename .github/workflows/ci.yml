name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  WABI_SOURCE_REVISION: ${{ github.sha }}

jobs:
  container-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the source-only Authority image
        run: docker build --build-arg WABI_SOURCE_REVISION -t wabi-candidate:ci -f core/crates/wabi-server/Dockerfile .
      - name: Fresh Compose install and restart
        run: node scripts/authority-compose-smoke.mjs --runtime docker --image wabi-candidate:ci

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Rust toolchain ---
      # Keep this version in sync with rust-toolchain.toml. The
      # dtolnay/rust-toolchain action does not accept a toolchain-file input.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93

      # --- Node (for npm install in frontend) ---
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Reject tracked operator state
        run: python3 scripts/check-runtime-files.py

      # Shared Media Node controller is intentionally Python-stdlib-only.
      - name: Shared Media Node controller tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # --- Frontend: install from committed lockfile, then test + type-check ---
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install bun (for bun test + svelte-check)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Frontend unit tests
        working-directory: frontend
        run: bun test src/lib

      - name: Frontend svelte-check
        working-directory: frontend
        run: bun run check

      # wabi-server uses rust_embed for frontend/build, so the static SPA must
      # exist before cargo check/test compile the server crate.
      - name: Build frontend assets for Rust embedding
        working-directory: frontend
        run: |
          STATIC_BUILD=1 npm run build
          test -f build/index.html

      # --- Compile smoke after generating the assets required by wabi-server ---
      - name: Cargo check
        run: cargo check --workspace

      # --- Full Rust test suite (wabidb crash/power-loss/property tests run in
      #     tempfile temp dirs — never touch real data/) ---
      - name: Cargo test
        run: cargo test --workspace

      - name: Disposable Authority backup and restore
        run: |
          cargo build -p wabi-server --bin wabi-server
          node scripts/authority-backup-restore-smoke.mjs --binary target/debug/wabi-server

      # ------------------------------------------------------------------
      # Placeholder: future "deploy to a test box + smoke wabi.chat"
      # Uncomment and adapt when you have a test target (e.g. dotZephyrus).
      # This step intentionally does NOT run in the PR gate by default —
      # it targets a faux-prod box with real credentials, separate from the
      # compile+test gate above.
