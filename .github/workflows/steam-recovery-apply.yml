name: Materialize Steam recovery
on:
  push:
    branches: [fix/steam-release-2026-09-12]
    paths: [.github/workflows/steam-recovery-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'AzureFoxStudios/wabi' && github.ref == 'refs/heads/fix/steam-release-2026-09-12'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Verify exact transport payload and apply real source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          root = pathlib.Path('.github/steam-recovery')
          parts = [root / f'part{i:02}.txt' for i in range(6)]
          assert set(root.iterdir()) == set(parts), 'unexpected transport file'
          encoded = ''.join(p.read_text().strip() for p in parts)
          assert len(encoded) == 50872, 'transport length mismatch'
          decoder = lzma.LZMADecompressor(memlimit=64*1024*1024)
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=138713)
          assert decoder.eof and not decoder.unused_data, 'incomplete compressed patch'
          assert len(patch) == 138712, 'patch length mismatch'
          assert hashlib.sha256(patch).hexdigest() == '33b1351e0f2cfe0a7c8f858b86ca1d57388b452ceb1c6e0366a623b361d10fca', 'patch checksum mismatch'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'steam-release.patch'
          target.write_bytes(patch)
          for line in patch.decode().splitlines():
              if line.startswith('+++ b/'):
                  name = line[6:]
                  assert '..' not in pathlib.PurePosixPath(name).parts
                  assert name.startswith(('frontend/', 'core/', 'docs/plans/', '.agents/skills/wabidb/')), name
          subprocess.run(['git','apply','--check',str(target)], check=True)
          subprocess.run(['git','apply',str(target)], check=True)
          for part in parts: part.unlink()
          root.rmdir()
          for name in ['.github/workflows/steam-recovery-source.yml','.github/workflows/steam-recovery-apply.yml']:
              pathlib.Path(name).unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m "feat: native game boards and opt-in verified Steam integration"
          git push origin HEAD:refs/heads/fix/steam-release-2026-09-12
          echo "Application source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
