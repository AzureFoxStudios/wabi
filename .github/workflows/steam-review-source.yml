name: Steam review source

on:
  push:
    branches: [review/steam-games-2026-09-11]
    paths: [.github/workflows/steam-review-source.yml]

permissions:
  contents: read

jobs:
  compiler:
    if: github.repository == 'AzureFoxStudios/wabi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install isolated compiler tools without lifecycle scripts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wabi-compiler"
          npm install --prefix "$RUNNER_TEMP/wabi-compiler" --ignore-scripts --no-audit --no-fund svelte@5.56.8 typescript@6.0.3 esbuild@0.25.5
          tar -czf "$RUNNER_TEMP/wabi-compiler.tar.gz" -C "$RUNNER_TEMP/wabi-compiler" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: steam-review-compiler
          path: ${{ runner.temp }}/wabi-compiler.tar.gz
          retention-days: 1
          if-no-files-found: error
