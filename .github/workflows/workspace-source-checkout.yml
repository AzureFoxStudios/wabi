name: Workspace implementation checkout
on:
  push:
    branches: [codex/workspace-addons-20260917]
    paths: [.github/workflows/workspace-source-checkout.yml]
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve pinned PDF rendering dependency
        working-directory: frontend
        run: npm install --save-exact pdfjs-dist@6.3.289 --no-audit --no-fund
      - name: Package dependency and lockfile for isolated validation
        run: tar -czf /tmp/wabi-pdf-deps.tar.gz -C frontend node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: workspace-pdf-dependencies
          path: /tmp/wabi-pdf-deps.tar.gz
          retention-days: 2
