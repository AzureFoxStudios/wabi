name: Workspace validation support
on:
  push:
    branches: [codex/docs-sheets-present-20260917]
    paths: [.github/workflows/workspace-validation-support.yml]
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93'
      - name: Resolve editor and Rust dependencies
        run: |
          cd frontend
          npm ci
          npm install --save-exact yjs@13.6.27 y-codemirror.next xlsx@https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz pdfjs-dist@5 pptxgenjs@4
          cd ..
          cargo add -p wabi-server yrs@=0.27.4 --features small-client,sync
          cargo fetch --locked
      - name: Package development-only inputs
        run: |
          mkdir -p /tmp/workspace-validation-support
          tar -czf /tmp/workspace-validation-support/frontend.tar.gz -C frontend node_modules package.json package-lock.json
          cp Cargo.lock /tmp/workspace-validation-support/Cargo.lock
          toolchain=$(dirname $(dirname $(rustup which rustc)))
          tar -czf /tmp/workspace-validation-support/rust-toolchain.tar.gz -C "$toolchain" bin lib
          tar -czf /tmp/workspace-validation-support/cargo-registry.tar.gz -C "$HOME/.cargo" registry
      - uses: actions/upload-artifact@v4
        with:
          name: wabi-workspace-validation-support
          path: /tmp/workspace-validation-support
          retention-days: 1
