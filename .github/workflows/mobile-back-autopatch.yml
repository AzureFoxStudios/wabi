name: Mobile back autopatch

on:
  push:
    branches:
      - feat/mobile-first-2026-09-12

permissions:
  contents: write

jobs:
  patch-and-check:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-back-autopatch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-first-2026-09-12
          fetch-depth: 0

      - name: Patch mobile Back handling
        shell: python
        run: |
          from pathlib import Path
          path = Path('frontend/src/lib/components/MainLayout.svelte')
          text = path.read_text()

          old_import = "\timport { formatMobileUnreadBadge, sumUnreadConversationCount } from '$lib/mobileShellModel';\n"
          new_import = "\timport { formatMobileUnreadBadge, nextMobileBackSurface, sumUnreadConversationCount } from '$lib/mobileShellModel';\n"
          if text.count(old_import) != 1:
              raise SystemExit('mobileShellModel import did not match exactly once')
          text = text.replace(old_import, new_import, 1)

          old_handler = '''\tfunction handleMobilePopState(): void {\n\t\tif (!$layoutStore.isMobile) return;\n\t\tif (showSettings) {\n\t\t\tshowSettings = false;\n\t\t\treturn;\n\t\t}\n\t\tif ($layoutStore.showMobileChannels) {\n\t\t\tlayoutStore.showMobileChannels.set(false);\n\t\t\treturn;\n\t\t}\n\t\tif ($layoutStore.rightPanelMode !== 'none') {\n\t\t\tlayoutStore.closeRightPanel();\n\t\t\treturn;\n\t\t}\n\t\tif (activeView === 'dm') activeView = 'chat';\n\t}\n'''
          new_handler = '''\tfunction handleMobilePopState(): void {\n\t\tif (!$layoutStore.isMobile) return;\n\t\tconst surface = nextMobileBackSurface({\n\t\t\tsettingsOpen: showSettings,\n\t\t\tserverSwitcherOpen: showServerSwitcher,\n\t\t\tbrowseOpen: $layoutStore.showMobileChannels,\n\t\t\trightOverlayOpen: $layoutStore.rightPanelMode !== 'none',\n\t\t\tconversationOpen: Boolean($layoutStore.centerDmChannelId)\n\t\t});\n\n\t\tswitch (surface) {\n\t\t\tcase 'settings':\n\t\t\t\tshowSettings = false;\n\t\t\t\treturn;\n\t\t\tcase 'server-switcher':\n\t\t\t\tcloseServerSwitcher();\n\t\t\t\treturn;\n\t\t\tcase 'browse':\n\t\t\t\tlayoutStore.showMobileChannels.set(false);\n\t\t\t\treturn;\n\t\t\tcase 'overlay':\n\t\t\t\tlayoutStore.closeRightPanel();\n\t\t\t\treturn;\n\t\t\tcase 'conversation':\n\t\t\t\tlayoutStore.closeCenterDm();\n\t\t\t\tactiveView = 'dm';\n\t\t\t\treturn;\n\t\t\tcase 'root':\n\t\t\tdefault:\n\t\t\t\tif (activeView === 'dm') activeView = 'chat';\n\t\t}\n\t}\n'''
          if text.count(old_handler) != 1:
              raise SystemExit('mobile popstate handler did not match exactly once')
          text = text.replace(old_handler, new_handler, 1)
          path.write_text(text)

      - name: Install frontend dependencies
        run: cd frontend && npm ci --no-audit --no-fund

      - name: Run mobile shell tests
        run: cd frontend && npx bun test src/lib/mobileShellModel.test.ts

      - name: Run frontend check
        run: cd frontend && npm run check

      - name: Commit validated Back patch and remove workflow
        run: |
          git config user.name "Wabi Mobile Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/mobile-back-autopatch.yml
          git add frontend/src/lib/components/MainLayout.svelte
          git commit -m "feat(mobile): make system Back follow phone surfaces [mobile-back-autopatch]"
          git push origin HEAD:feat/mobile-first-2026-09-12
