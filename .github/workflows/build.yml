name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  WABI_SOURCE_REVISION: ${{ github.sha }}
  RUST_BACKTRACE: 1
  # dtolnay/rust-toolchain@1.93 resolves to the latest 1.93 patch release.
  # Pin the effective toolchain to that exact release too, otherwise the
  # repository's `channel = "1.93"` override can select a separate toolchain
  # that does not have both universal macOS targets installed.
  RUSTUP_TOOLCHAIN: 1.93.1

# Determinism contract for this workflow:
#   - Rust is pinned to the same version as rust-toolchain.toml (not @stable).
#   - Frontend deps come from the committed frontend/package-lock.json via
#     `npm ci` (bun.lock is gitignored and must never govern CI installs).
#     There is NO fallback to an unlocked install: a stale lockfile must
#     fail the build, not silently resolve new versions.
#   - bun is a pinned script/test runner only (bun test / bunx).
#   - The server build embeds the STATIC_BUILD=1 SPA (adapter-static,
#     index.html). The default `npm run build` is adapter-node and cannot
#     be served by rust_embed.

jobs:
  build-tauri:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            artifact-platform: macos
          - platform: ubuntu-22.04
            args: ''
            artifact-platform: linux
          - platform: windows-latest
            args: ''
            artifact-platform: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust
        uses: dtolnay/rust-toolchain@1.93
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Tailcat v0.4.0 publishes Linux/Windows release binaries but no macOS
      # archive. The staging script therefore builds the pinned macOS sidecars
      # from the exact v0.4.0 commit and needs the Go version required upstream.
      - name: install Go for Tailcat (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            libssl-dev

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: install frontend dependencies (locked)
        run: cd frontend && npm ci --no-audit --no-fund

      - name: stage Tailcat sidecar
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ./scripts/fetch-tailcat-sidecar.sh aarch64-apple-darwin x86_64-apple-darwin

            ARM64="src-tauri/binaries/tailcat-aarch64-apple-darwin"
            X64="src-tauri/binaries/tailcat-x86_64-apple-darwin"
            UNIVERSAL="src-tauri/binaries/tailcat-universal-apple-darwin"

            test -x "$ARM64"
            test -x "$X64"
            lipo -create "$ARM64" "$X64" -output "$UNIVERSAL"
            chmod +x "$UNIVERSAL"
            lipo "$UNIVERSAL" -verify_arch arm64 x86_64
            lipo -info "$UNIVERSAL"
            file "$UNIVERSAL"
          else
            ./scripts/fetch-tailcat-sidecar.sh
          fi

      - name: build Tauri
        run: bunx @tauri-apps/cli@2.11.4 build --ci ${{ matrix.args }} -- --locked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload desktop installers (Linux)
        if: matrix.artifact-platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: wabi-desktop-linux
          path: |
            src-tauri/target/release/bundle/deb/**/*.deb
            src-tauri/target/release/bundle/rpm/**/*.rpm
            src-tauri/target/release/bundle/appimage/**/*.AppImage
          if-no-files-found: error
          retention-days: 5

      - name: Upload desktop installers (Windows)
        if: matrix.artifact-platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: wabi-desktop-windows
          path: |
            src-tauri/target/release/bundle/msi/**/*.msi
            src-tauri/target/release/bundle/nsis/**/*.exe
          if-no-files-found: error
          retention-days: 5

      - name: Upload desktop installers (macOS)
        if: matrix.artifact-platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: wabi-desktop-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/**/*.dmg
          if-no-files-found: error
          retention-days: 5

  build-server:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Rust
        uses: dtolnay/rust-toolchain@1.93

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # STATIC_BUILD=1 selects adapter-static, which emits the index.html
      # SPA entry that rust_embed embeds and serve_static serves at '/'.
      - name: build frontend assets for embedding (static SPA)
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          STATIC_BUILD=1 npm run build
          test -f build/index.html

      - name: Backend regression tests
        run: cargo test --locked --workspace

      - name: Release packaging regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_release*.py'

      - name: build Rust server
        run: cargo build --locked --release -p wabi-server

      # Prove the release binary actually serves the embedded SPA, not just
      # an adapter-node payload rust_embed cannot serve.
      - name: smoke test server serves index.html
        run: |
          TMP_DATA="$(mktemp -d)"
          ./target/release/wabi-server --data-dir "$TMP_DATA" --host 127.0.0.1 --port 3199 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3199/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3199/health >/dev/null
          STATUS="$(curl -fsS -o /tmp/wabi-root.html -w '%{http_code}' http://127.0.0.1:3199/)"
          test "$STATUS" = "200"
          head -c 32 /tmp/wabi-root.html | grep -qi '<!doctype html'
          echo "smoke OK: GET / -> 200 with index.html"

      - name: Write artifact identity manifest
        run: node scripts/write-release-manifest.mjs --binary target/release/wabi-server --frontend frontend/build --output target/release/wabi-release-manifest.json

      - name: upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: wabi-server
          path: |
            target/release/wabi-server
            target/release/wabi-release-manifest.json

  frontend-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Deterministic install from the committed lockfile — no fallback.
      # (bun install --frozen-lockfile with no bun.lock checked in resolves
      # an unrestricted graph and exits 0, so it pins nothing.)
      - name: install dependencies (locked)
        run: cd frontend && npm ci --no-audit --no-fund

      - name: unit tests
        run: cd frontend && bun test src/lib

      - name: Calendar daylight-saving regression tests
        run: cd frontend && TZ=America/New_York bun test src/lib/business/calendarOccurrences.test.ts src/lib/business/calendarForm.test.ts

      # Build the same static SPA the server embeds so the uploaded artifact
      # matches production shape (index.html present).
      - name: build (static SPA)
        run: |
          cd frontend
          STATIC_BUILD=1 npm run build
          test -f build/index.html

      # svelte-check gates the job: currently 0 errors / warnings only.
      # Soft-failing (continue-on-error) hid real regressions that ci.yml
      # already hard-gates.
      - name: svelte-check
        run: cd frontend && bun run check

      - name: upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build-server, frontend-checks, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: wabi-*
          path: artifacts
      - name: Package checked artifacts and checksums
        run: node scripts/package-release-candidate.mjs --artifacts artifacts --output dist
      - name: Create draft prerelease candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$CANDIDATE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag; refusing to replace its assets.' >&2
            exit 1
          fi
          cat > candidate-notes.md <<'NOTES'
          Candidate artifacts from the checked source revision. Physical-device acceptance is still pending.
          Linux and Windows are the first pilot targets. Existing Apple builds remain unvalidated.
          Review the source/build identity, SHA256SUMS, install/upgrade and calling evidence before publication.
          NOTES
          gh release create "$CANDIDATE_TAG" --verify-tag --draft --prerelease \
            --title "Wabi $CANDIDATE_TAG" --notes-file candidate-notes.md dist/*
