name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  WABI_SOURCE_REVISION: ${{ github.sha }}
  RUST_BACKTRACE: 1
  # dtolnay/rust-toolchain@1.93 resolves to the latest 1.93 patch release.
  # Pin the effective toolchain to that exact release too, otherwise the
  # repository's `channel = "1.93"` override can select a separate toolchain
  # that does not have both universal macOS targets installed.
  RUSTUP_TOOLCHAIN: 1.93.1

# Determinism contract for this workflow:
#   - Rust is pinned to the same version as rust-toolchain.toml (not @stable).
#   - Frontend deps come from the committed frontend/package-lock.json via
#     `npm ci` (bun.lock is gitignored and must never govern CI installs).
#     There is NO fallback to an unlocked install: a stale lockfile must
#     fail the build, not silently resolve new versions.
#   - bun is a pinned script/test runner only (bun test / bunx).
#   - The server build embeds the STATIC_BUILD=1 SPA (adapter-static,
#     index.html). The default `npm run build` is adapter-node and cannot
#     be served by rust_embed.

jobs:
  build-tauri:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            artifact-platform: macos
          - platform: ubuntu-22.04
            args: ''
            artifact-platform: linux
          - platform: windows-latest
            args: ''
            artifact-platform: windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install Rust
        uses: dtolnay/rust-toolchain@633c1125191e55c620c8ae7d364073c0ead621c1 # 1.93 (branch)
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Tailcat v0.4.0 publishes Linux/Windows release binaries but no macOS
      # archive. The staging script therefore builds the pinned macOS sidecars
      # from the exact v0.4.0 commit and needs the Go version required upstream.
      - name: install Go for Tailcat (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            libssl-dev

      - name: install node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Runtime toolchain fingerprint (Node2Shell floor)
        run: node scripts/security/toolchain-fingerprint.mjs --require-bun

      - name: install frontend dependencies (locked)
        run: cd frontend && npm ci --no-audit --no-fund

      - name: stage Tailcat sidecar
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ./scripts/fetch-tailcat-sidecar.sh aarch64-apple-darwin x86_64-apple-darwin

            ARM64="src-tauri/binaries/tailcat-aarch64-apple-darwin"
            X64="src-tauri/binaries/tailcat-x86_64-apple-darwin"
            UNIVERSAL="src-tauri/binaries/tailcat-universal-apple-darwin"

            test -x "$ARM64"
            test -x "$X64"
            lipo -create "$ARM64" "$X64" -output "$UNIVERSAL"
            chmod +x "$UNIVERSAL"
            lipo "$UNIVERSAL" -verify_arch arm64 x86_64
            lipo -info "$UNIVERSAL"
            file "$UNIVERSAL"
          else
            ./scripts/fetch-tailcat-sidecar.sh
          fi

      - name: Build embedded web assets and the bundled Authority
        shell: bash
        run: |
          (cd frontend && npm run build:static)
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            node scripts/build-desktop-host.mjs --target universal-apple-darwin
          else
            node scripts/build-desktop-host.mjs
          fi

      # At bundle time the Tauri bundler downloads helper tools (AppRun,
      # linuxdeploy, NSIS) from github.com/tauri-apps/binary-releases. When
      # that host answers 5xx, the step fails after the release binary has
      # already built, with: failed to bundle project: `http status: 504`.
      # Retry that one case, at most twice more. Any other failure, including
      # a compile error or a different bundler error, fails at once. A retry
      # reuses the compiled binary, so it costs minutes, not a rebuild.
      - name: build Tauri
        shell: bash
        run: |
          # GitHub runs this with `bash -eo pipefail`. The `|| status=$?`
          # keeps a failed build from ending the step before the check below.
          set -u
          LOG="$RUNNER_TEMP/tauri-build.log"
          for attempt in 1 2 3; do
            status=0
            bunx @tauri-apps/cli@2.11.4 build --ci ${{ matrix.args }} -- --locked 2>&1 | tee "$LOG" || status=$?
            if [[ $status -eq 0 ]]; then
              exit 0
            fi
            if [[ $attempt -lt 3 ]] && grep -Eq 'failed to bundle project: `http status: 5[0-9]{2}`' "$LOG"; then
              delay=$((attempt * 30))
              echo "::warning::Tauri bundler helper download returned 5xx (attempt $attempt of 3); retrying in ${delay}s"
              sleep "$delay"
              continue
            fi
            exit "$status"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check native hosting and the packaged Authority
        shell: bash
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol --lib hosting::
          TARGET=$(rustc -vV | sed -n 's/^host: //p')
          BINARY="$GITHUB_WORKSPACE/target/$TARGET/release/wabi-server"
          if [[ "$RUNNER_OS" == Windows ]]; then BINARY="$BINARY.exe"; fi
          cargo test --locked --manifest-path scripts/host-safety/Cargo.toml
          WABI_HOST_TEST_BINARY="$BINARY" cargo test --locked --manifest-path scripts/host-safety/Cargo.toml -- --ignored

      - name: Upload desktop installers (Linux)
        if: matrix.artifact-platform == 'linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wabi-desktop-linux
          path: |
            src-tauri/target/release/bundle/deb/**/*.deb
            src-tauri/target/release/bundle/rpm/**/*.rpm
            src-tauri/target/release/bundle/appimage/**/*.AppImage
          if-no-files-found: error
          retention-days: 5

      - name: Upload desktop installers (Windows)
        if: matrix.artifact-platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wabi-desktop-windows
          path: |
            src-tauri/target/release/bundle/msi/**/*.msi
            src-tauri/target/release/bundle/nsis/**/*.exe
          if-no-files-found: error
          retention-days: 5

      - name: Upload desktop installers (macOS)
        if: matrix.artifact-platform == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wabi-desktop-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/**/*.dmg
          if-no-files-found: error
          retention-days: 5

  build-server:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install Rust
        uses: dtolnay/rust-toolchain@633c1125191e55c620c8ae7d364073c0ead621c1 # 1.93 (branch)

      - name: install node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # STATIC_BUILD=1 selects adapter-static, which emits the index.html
      # SPA entry that rust_embed embeds and serve_static serves at '/'.
      - name: build frontend assets for embedding (static SPA)
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          STATIC_BUILD=1 npm run build
          test -f build/index.html

      - name: Reject tracked operator state
        run: python3 scripts/check-runtime-files.py

      - name: Backend regression tests
        run: cargo test --locked --workspace

      - name: Release packaging regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_release*.py'

      - name: build Rust server
        run: cargo build --locked --release -p wabi-server

      # Prove the release binary actually serves the embedded SPA, not just
      # an adapter-node payload rust_embed cannot serve.
      - name: smoke test server serves index.html
        run: |
          TMP_DATA="$(mktemp -d)"
          ./target/release/wabi-server --data-dir "$TMP_DATA" --host 127.0.0.1 --port 3199 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3199/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3199/health >/dev/null
          STATUS="$(curl -fsS -o /tmp/wabi-root.html -w '%{http_code}' http://127.0.0.1:3199/)"
          test "$STATUS" = "200"
          head -c 32 /tmp/wabi-root.html | grep -qi '<!doctype html'
          echo "smoke OK: GET / -> 200 with index.html"

      - name: Verify timed retention and restart on the release binary
        run: node scripts/authority-retention-smoke.mjs --binary target/release/wabi-server

      - name: Verify desktop-managed owner, invitations and restart
        run: |
          node scripts/desktop-host-smoke.mjs target/release/wabi-server
          node scripts/desktop-host-account-smoke.mjs target/release/wabi-server

      - name: Write artifact identity manifest
        run: node scripts/write-release-manifest.mjs --binary target/release/wabi-server --frontend frontend/build --output target/release/wabi-release-manifest.json

      - name: upload server artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wabi-server
          path: |
            target/release/wabi-server
            target/release/wabi-release-manifest.json

  frontend-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: install node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Runtime toolchain fingerprint (Node2Shell floor)
        run: node scripts/security/toolchain-fingerprint.mjs --require-bun

      # Deterministic install from the committed lockfile — no fallback.
      # (bun install --frozen-lockfile with no bun.lock checked in resolves
      # an unrestricted graph and exits 0, so it pins nothing.)
      - name: install dependencies (locked)
        run: cd frontend && npm ci --no-audit --no-fund

      - name: unit tests
        run: cd frontend && bun test --isolate src/lib

      - name: Calendar daylight-saving regression tests
        run: cd frontend && TZ=America/New_York bun test src/lib/business/calendarOccurrences.test.ts src/lib/business/calendarForm.test.ts

      # Build the same static SPA the server embeds so the uploaded artifact
      # matches production shape (index.html present).
      - name: build (static SPA)
        run: |
          cd frontend
          STATIC_BUILD=1 npm run build
          test -f build/index.html

      - name: Verify PWA installation and offline app assets
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          WABI_SMOKE_CHROMIUM_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')" \
            xvfb-run -a node scripts/pwa-production-smoke.mjs

      # svelte-check gates the job: currently 0 errors / warnings only.
      # Soft-failing (continue-on-error) hid real regressions that ci.yml
      # already hard-gates.
      - name: svelte-check
        run: cd frontend && bun run check

      - name: upload frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build
          path: frontend/build

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build-server, frontend-checks, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wabi-*
          path: artifacts
      - name: Package checked artifacts and checksums
        run: node scripts/package-release-candidate.mjs --artifacts artifacts --output dist
      - name: Create draft prerelease candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$CANDIDATE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag; refusing to replace its assets.' >&2
            exit 1
          fi
          cat > candidate-notes.md <<'NOTES'
          Candidate artifacts from the checked source revision. Physical-device acceptance is still pending.
          Linux and Windows are the first pilot targets. Existing Apple builds remain unvalidated.
          Review the source/build identity, SHA256SUMS, install/upgrade and calling evidence before publication.
          NOTES
          gh release create "$CANDIDATE_TAG" --verify-tag --draft --prerelease \
            --title "Wabi $CANDIDATE_TAG" --notes-file candidate-notes.md dist/*
