name: PR integration audit
on:
  push:
    branches: [integrate/open-prs-2026-09-10]
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: pr-integration-audit
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 5c11caa8708476b3311fb8907e64a66fb83e1e06
      - uses: actions/download-artifact@v4
        with:
          name: pr-integration-result
          run-id: 34479587807
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-candidate
      - name: Validate candidate ancestry and correct stale catalog assertions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr-audit" "$RUNNER_TEMP/pr-checks"
          test "$(git rev-parse HEAD)" = 5c11caa8708476b3311fb8907e64a66fb83e1e06
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          cp "$RUNNER_TEMP/previous-candidate/report.json" "$RUNNER_TEMP/pr-audit/report.json"
          cp "$RUNNER_TEMP/previous-candidate/base.txt" "$RUNNER_TEMP/pr-audit/base.txt"
          git config user.name 'Wabi integration audit'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr-audit'
          report = json.loads((out / 'report.json').read_text())
          for row in report['prs']:
              if row['outcome'] != 'already merged':
                  subprocess.run(['git', 'merge-base', '--is-ancestor', row['head'], 'HEAD'], check=True)
          path = pathlib.Path('core/crates/wabi-server/tests/admin_role_contract.rs')
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == 'd86a4b000daafe8a2b76d121819f61ee802abcc7'
          source = path.read_text()
          old = 'vec!["owner", "admin", "mod", "member", "guest"]'
          new = 'vec!["owner", "admin", "developer", "mod", "artist", "member", "guest"]'
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = 'assert_eq!(init["roleDefinitions"].as_array().unwrap().len(), 5);'
          new = '''assert_eq!(
                      init["roleDefinitions"].as_array().unwrap().iter()
                          .map(|role| role["roleName"].as_str().unwrap()).collect::<Vec<_>>(),
                      vec!["owner", "admin", "developer", "mod", "artist", "member", "guest"]
                  );'''
          assert source.count(old) == 1
          source = source.replace(old, new)
          path.write_text(source)
          report['integrationFix'] = 'Update two stale five-role assertions to the existing seven-role server catalog; retain all authorization/persistence checks and compare full reloaded names instead of just a count.'
          (out / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          git add -- core/crates/wabi-server/tests/admin_role_contract.rs
          git commit -m 'test(roles): match the existing seven-role catalog in contract fixtures'
          printf 'assembly=0\n' > "$RUNNER_TEMP/pr-checks/status.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
          cache-on-failure: true
      - name: Verify combined frontend and all local-workflow tests
        shell: bash
        run: |
          set +e
          cd frontend
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/pr-checks/install.log" 2>&1
          code=$?
          echo "install=$code" >> "$RUNNER_TEMP/pr-checks/status.txt"
          if [ "$code" = 0 ]; then
            bun test src/lib > "$RUNNER_TEMP/pr-checks/frontend-tests.log" 2>&1
            echo "frontend_tests=$?" >> "$RUNNER_TEMP/pr-checks/status.txt"
            npm run check > "$RUNNER_TEMP/pr-checks/frontend-check.log" 2>&1
            echo "frontend_check=$?" >> "$RUNNER_TEMP/pr-checks/status.txt"
            STATIC_BUILD=1 npm run build > "$RUNNER_TEMP/pr-checks/frontend-build.log" 2>&1
            echo "frontend_build=$?" >> "$RUNNER_TEMP/pr-checks/status.txt"
            for test in scripts/lore-local-changes.test.mjs scripts/lore-local-detection.test.mjs scripts/lore-workspace-presentation.test.mjs; do
              node --experimental-strip-types --test "$test" > "$RUNNER_TEMP/pr-checks/$(basename "$test").log" 2>&1
              echo "$(basename "$test")=$?" >> "$RUNNER_TEMP/pr-checks/status.txt"
            done
            node --experimental-vm-modules --test scripts/lore-local-observer.test.mjs > "$RUNNER_TEMP/pr-checks/observer.log" 2>&1
            echo "observer=$?" >> "$RUNNER_TEMP/pr-checks/status.txt"
          fi
          cat "$RUNNER_TEMP/pr-checks/status.txt"
          exit 0
      - name: Check and test all Rust targets without hiding later failures
        shell: bash
        run: |
          set +e
          cargo check --workspace --locked > "$RUNNER_TEMP/pr-checks/cargo-check.log" 2>&1
          code=$?
          echo "cargo_check=$code" >> "$RUNNER_TEMP/pr-checks/status.txt"
          if [ "$code" = 0 ]; then
            timeout 1500 cargo test --workspace --locked --no-fail-fast > "$RUNNER_TEMP/pr-checks/cargo-test.log" 2>&1
            echo "cargo_test=$?" >> "$RUNNER_TEMP/pr-checks/status.txt"
            cargo test -p wabi-lore -p wabi-sync --locked > "$RUNNER_TEMP/pr-checks/lore-rust-tests.log" 2>&1
            echo "lore_rust_tests=$?" >> "$RUNNER_TEMP/pr-checks/status.txt"
          fi
          cat "$RUNNER_TEMP/pr-checks/status.txt"
          tail -100 "$RUNNER_TEMP/pr-checks/cargo-test.log" 2>/dev/null || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-integration-core-checks
          path: ${{ runner.temp }}/pr-checks
          retention-days: 7
      - name: Install native desktop build libraries and the real pinned Tailcat sidecar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential pkg-config libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libxkbcommon-dev
          bash scripts/fetch-tailcat-sidecar.sh
          test -s src-tauri/binaries/tailcat-x86_64-unknown-linux-gnu
          sha256sum src-tauri/binaries/tailcat-x86_64-unknown-linux-gnu > "$RUNNER_TEMP/pr-checks/sidecar-sha256.txt"
      - name: Compile both native entry points and run local-workspace tests
        shell: bash
        env:
          WABI_SKIP_VIEWER_TEST: 1
        run: |
          set +e
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked > "$RUNNER_TEMP/pr-checks/native-check.log" 2>&1
          code=$?
          echo "native_check=$code" >> "$RUNNER_TEMP/pr-checks/status.txt"
          if [ "$code" = 0 ]; then
            cargo test --manifest-path src-tauri/Cargo.toml --locked --lib lore_local > "$RUNNER_TEMP/pr-checks/native-tests.log" 2>&1
            echo "native_tests=$?" >> "$RUNNER_TEMP/pr-checks/status.txt"
          fi
          tail -120 "$RUNNER_TEMP/pr-checks/native-check.log"
          tail -100 "$RUNNER_TEMP/pr-checks/native-tests.log" 2>/dev/null || true
          exit 0
      - name: Export exact reviewed candidate
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pr-result"
          test -f "$RUNNER_TEMP/pr-audit/report.json"
          base=$(cat "$RUNNER_TEMP/pr-audit/base.txt")
          git rev-parse HEAD > "$RUNNER_TEMP/pr-result/head.txt"
          printf '%s\n' "$base" > "$RUNNER_TEMP/pr-result/base.txt"
          git bundle create "$RUNNER_TEMP/pr-result/candidate.bundle" HEAD "^$base"
          git diff "$base" HEAD > "$RUNNER_TEMP/pr-result/candidate.diff"
          # Generated TS is a known test side effect. It is never added to the candidate.
          git diff HEAD -- > "$RUNNER_TEMP/pr-result/unstaged-after-checks.diff"
          cp Cargo.lock "$RUNNER_TEMP/pr-result/Cargo.lock"
          cp src-tauri/Cargo.lock "$RUNNER_TEMP/pr-result/desktop-Cargo.lock"
          cp frontend/package.json "$RUNNER_TEMP/pr-result/package.json"
          cp frontend/package-lock.json "$RUNNER_TEMP/pr-result/package-lock.json"
          cp "$RUNNER_TEMP/pr-audit/report.json" "$RUNNER_TEMP/pr-result/report.json"
          cp -r "$RUNNER_TEMP/pr-checks" "$RUNNER_TEMP/pr-result/checks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-integration-result
          path: ${{ runner.temp }}/pr-result
          retention-days: 7
      - name: Fail visibly for unsuccessful or missing checks
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/pr-checks/status.txt"
          cat "$RUNNER_TEMP/pr-checks/status.txt"
          for name in assembly install frontend_tests frontend_check frontend_build cargo_check cargo_test lore_rust_tests native_check native_tests; do
            grep -q "^$name=0$" "$RUNNER_TEMP/pr-checks/status.txt" || exit 1
          done
          ! grep -v '=0$' "$RUNNER_TEMP/pr-checks/status.txt"
  preserve-candidate:
    needs: candidate
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pr-integration-result
          path: ${{ runner.temp }}/candidate-review
      - name: Preserve candidate on a new review branch, never main
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          dir="$RUNNER_TEMP/candidate-review"
          head=$(cat "$dir/head.txt")
          base=$(cat "$dir/base.txt")
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] && [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          git bundle verify "$dir/candidate.bundle"
          git fetch "$dir/candidate.bundle" HEAD:refs/remotes/audit/candidate
          test "$(git rev-parse refs/remotes/audit/candidate)" = "$head"
          git merge-base --is-ancestor "$base" "$head"
          branch="integrate/candidate-${GITHUB_RUN_ID}"
          test -z "$(git ls-remote --heads origin "refs/heads/$branch")"
          git push origin "$head:refs/heads/$branch"
          printf 'Candidate preserved on `%s` at `%s`. Review tests before main integration. Main was not modified by this workflow.\n' "$branch" "$head" >> "$GITHUB_STEP_SUMMARY"
