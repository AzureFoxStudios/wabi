name: Office guarded source repair
on:
  push:
    branches: [codex/docs-sheets-present-20260917]
    paths: [.github/workflows/office-finish-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'AzureFoxStudios/wabi' && github.ref == 'refs/heads/codex/docs-sheets-present-20260917'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/docs-sheets-present-20260917
      - name: Apply reviewed integration edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=set()
          def replace(path,before,after,count=1):
              file=Path(path); text=file.read_text()
              if before not in text and after and text.count(after)==count:return
              if text.count(before)!=count:raise RuntimeError(f'{path}: expected {count} anchors, found {text.count(before)}')
              file.write_text(text.replace(before,after));changed.add(path)
          p='frontend/src/lib/workspaces/session.ts'
          replace(p, '    updatedAt:number;sourceKey?:string;original?', '    updatedAt:number;sourceKey?:string;presentationSession?:string;original?')
          replace(p, '    async publish(mode:', '''    async rememberPresentation(id:string):Promise<void>{
                  if(this.closed||!this.scope.isCurrent()||this.record.kind!=='present'||!/^[0-9a-f-]{36}$/i.test(id))throw new Error('Invalid presentation association');
                  this.record.presentationSession=id;this.localEpoch++;await this.flush();
              }
              async publish(mode:''')
          p='frontend/src/lib/workspaces/present/PresentWorkspace.svelte'
          replace(p, "    import PresentedVersion from './PresentedVersion.svelte';", "    import PresentedVersion from './PresentedVersion.svelte';\n    import {editionFingerprint} from './versionPreview';")
          replace(p, "    async function use(session:ArtifactSession){if(disposed||!scope?.isCurrent()){await session.close();return;}await noteChain;if(active&&active!==session&&!(await active.close()))throw new Error('Save or export the current deck before closing it.');stop();active=session;stop=session.state.subscribe(v=>{tick=v.tick;});notes=await readPrivateNotes(scope,session.id);const first=readSlides(session.data)[0];if(first)select(first.id);roomId='';startedLink='';}", "    async function use(session:ArtifactSession){const ticket=++epoch;const valid=()=>!disposed&&!!scope?.isCurrent()&&ticket===epoch;if(!valid()){await session.close();return;}await noteChain;if(!valid()){await session.close();return;}const savedNotes=await readPrivateNotes(session.scope,session.id);if(!valid()){await session.close();return;}const prior=active;if(prior&&prior!==session&&!(await prior.close())){await session.close();throw new Error('Save or export the current deck before closing it.');}if(!valid()){await session.close();return;}stop();active=session;stop=session.state.subscribe(v=>{tick=v.tick;});notes=savedNotes;const first=readSlides(session.data)[0];if(first)select(first.id);roomId=session.record.presentationSession||'';startedLink=roomId?presentationLink(session.scope.server,roomId):'';}")
          replace(p, "    async function startRoom(){if(!scope||!active)return;await active.flush();await active.publish(active.record.meta?.mode||'snapshot');if(active.record.meta?.mode==='live')await active.sync();const state=await request<AudienceState>(scope,'/presentations',{id:crypto.randomUUID(),artifactId:active.id,channelId:channelId||null,sourceSequence:active.record.meta!.sequence});roomId=state.id;startedLink=presentationLink(scope.server,state.id);startDialog.close();openWorkspace('audience',{sessionId:state.id});}", "    async function startRoom(){if(!scope||!active)return;const session=active,targetChannel=channelId,approved=editionFingerprint(audienceSlides(session.data),aspect);const valid=()=>!disposed&&active===session&&session.scope.isCurrent();await session.flush();if(!valid())return;await session.publish(session.record.meta?.mode||'snapshot');if(!valid())return;if(approved!==editionFingerprint(audienceSlides(session.data),Number(session.data.get('aspect')||16/9)))throw new Error('The deck changed while preparing the presentation. Review the new preview and start again.');const state=await request<AudienceState>(session.scope,'/presentations',{id:crypto.randomUUID(),artifactId:session.id,channelId:targetChannel||null,sourceSequence:session.record.meta!.sequence});if(!valid())return;roomId=state.id;startedLink=presentationLink(session.scope.server,state.id);await session.rememberPresentation(state.id);if(!valid())return;startDialog.close();openWorkspace('audience',{sessionId:state.id});}")
          p='frontend/src/lib/workspaces/ArtifactHandoff.svelte'
          replace(p, 'import { channels, switchChannel }', 'import { channels }')
          replace(p, "    import { captureGroupAccess } from '$lib/groupAccess';\n", '')
          replace(p, '            const allowed = captureGroupAccess(target.id), scope = session.scope;', "            const {captureGroupAccess}=await import('$lib/groupAccess');\n            const {switchChannel}=await import('$lib/channelStore');\n            check();\n            const allowed = captureGroupAccess(target.id), scope = session.scope;")
          p='frontend/scripts/office-workspace-browser-smoke.mjs'
          replace(p, "export const currentChannel=writable('');export const channels=writable([]);", "export const currentChannel=writable('');export const channels=writable([]);export const switchChannel=id=>currentChannel.set(id);")
          replace(p, "registerAddonTab(){},openAddonTab(id){active.set('addon:'+id)}", "registerAddonTab(){},setActiveChannel(id){active.set('channel:'+id)},openAddonTab(id){active.set('addon:'+id)}")
          # Keep fixture identity/navigation stubs explicit. Real editor, storage,
          # permission, publication, and renderer behavior are not mocked.
          print('\n'.join(sorted(changed)))
          PY
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/workspaces/session.ts frontend/src/lib/workspaces/present/PresentWorkspace.svelte frontend/src/lib/workspaces/ArtifactHandoff.svelte frontend/scripts/office-workspace-browser-smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(present): preserve active sessions and reject stale asynchronous work'
            git push origin HEAD:refs/heads/codex/docs-sheets-present-20260917
          fi
          git rev-parse HEAD
