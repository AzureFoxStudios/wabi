name: Office guarded source repair
on:
  push:
    branches: [codex/docs-sheets-present-20260917]
    paths: [.github/workflows/office-finish-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'AzureFoxStudios/wabi' && github.ref == 'refs/heads/codex/docs-sheets-present-20260917'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed compiler and preview fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pending={}
          def replace(path,before,after,count=1):
              text=pending.setdefault(path,Path(path).read_text())
              if after and text.count(after)==count:return
              if text.count(before)!=count:raise RuntimeError(f'{path}: expected {count} anchors, found {text.count(before)}')
              pending[path]=text.replace(before,after)
          replace('frontend/src/lib/workspaces/present/sceneExport.ts','slide.addTable(rows,','slide.addTable(rows.map(row=>row.map(text=>({text}))),')
          replace('core/crates/wabi-server/src/api/workspace_sheets.rs','pub(super) struct ProtectedRange','pub(in crate::api) struct ProtectedRange')
          replace('core/crates/wabi-server/src/api/workspace_scene.rs','pub(super) struct Design','pub(in crate::api) struct Design')
          replace('core/crates/wabi-server/src/api/workspace_scene.rs','pub(super) struct Object','pub(in crate::api) struct Object')
          for p in ['frontend/src/lib/workspaces/present/nativeAcceptance.test.ts','frontend/scripts/office-native-canvas-acceptance.mjs']:
              replace(p,"name.startsWith('ppt/embeddings/')", "name.startsWith('ppt/embeddings/') && !zip.files[name].dir")
          p='frontend/src/lib/workspaces/present/PresentWorkspace.svelte'
          replace(p,"let pinnedLocal=$state<AudienceSlide[]>([]);", "let pinnedLocal=$state<AudienceSlide[]>([]);let startPreview=$state<AudienceSlide[]>([]);let startAspect=$state(16/9);let localAspect=$state(16/9);")
          replace(p,'    async function startRoom(){', "    function prepareStartRoom(){if(!active||!active.scope.isCurrent())throw new Error('Workspace changed.');startPreview=audienceSlides(active.data);startAspect=aspect;channelId='';startDialog.showModal();}\n    async function startRoom(){")
          replace(p,"const session=active,targetChannel=channelId,approved=editionFingerprint(audienceSlides(session.data),aspect);", "const session=active,targetChannel=channelId,approved=editionFingerprint(startPreview,startAspect);if(approved!==editionFingerprint(audienceSlides(session.data),aspect))throw new Error('The deck changed after the preview. Cancel and preview it again before starting.');")
          replace(p,"onclick={()=>{channelId='';startDialog.showModal();}}", "onclick={()=>void run(async()=>prepareStartRoom())}")
          replace(p,"{#if active}<p>{audienceSlides(active.data).length} visible slides will be published. Hidden slides are excluded from the audience payload.</p><div class=\"import-preview\">{#each audienceSlides(active.data) as slide(slide.id)}<AudienceSlideView {slide} {aspect}/>{/each}</div>{/if}", "<p>{startPreview.length} visible slides will be published. Hidden slides are excluded from the audience payload.</p><div class=\"import-preview\">{#each startPreview as slide(slide.id)}<AudienceSlideView {slide} aspect={startAspect}/>{/each}</div>")
          replace(p,'pinnedLocal=audienceSlides(active.data);','pinnedLocal=audienceSlides(active.data);localAspect=aspect;')
          replace(p,'onclick={presentLocal}','onclick={()=>void run(async()=>presentLocal())}')
          replace(p,'slide={pinnedLocal[localIndex]||null} {aspect}', 'slide={pinnedLocal[localIndex]||null} aspect={localAspect}')
          replace(p,"const title=session.title,slides=audienceSlides(session.data),ratio=aspect;void import('./files').then", "let slides:AudienceSlide[];try{slides=audienceSlides(session.data);}catch(e){error=e instanceof Error?e.message:String(e);return;}const title=session.title,ratio=aspect;void import('./files').then")
          # Record package size as emitted evidence without loading any optional module.
          p='frontend/vite.config.ts'
          replace(p,"import { fileURLToPath } from 'node:url';", "import { fileURLToPath } from 'node:url';\nimport { gzipSync } from 'node:zlib';")
          replace(p,"[{ file, entry: output.isEntry", "[{ file, bytes: Buffer.byteLength(output.code), gzipBytes: gzipSync(output.code).byteLength, entry: output.isEntry")
          for path,text in pending.items():Path(path).write_text(text)
          print('\n'.join(sorted(pending)))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/workspaces/present/sceneExport.ts core/crates/wabi-server/src/api/workspace_sheets.rs core/crates/wabi-server/src/api/workspace_scene.rs frontend/src/lib/workspaces/present/nativeAcceptance.test.ts frontend/scripts/office-native-canvas-acceptance.mjs frontend/src/lib/workspaces/present/PresentWorkspace.svelte frontend/vite.config.ts
          if ! git diff --cached --quiet; then
            git commit -m 'fix(office): compile table exports enforce range visibility and pin approval previews'
            git push origin HEAD:refs/heads/codex/docs-sheets-present-20260917
          fi
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Frontend diagnostics and focused regression tests
        id: frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          status=0
          npm run check > /tmp/office-typecheck.log 2>&1 || status=1
          bun test src/lib/workspaces > /tmp/office-unit.log 2>&1 || status=1
          npm audit --json > /tmp/office-audit.json || true
          python3 - <<'PY'
          import re,json
          from pathlib import Path
          for file in ['office-typecheck.log','office-unit.log']:
              lines=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',Path('/tmp/'+file).read_text()).splitlines()
              selected=set()
              for i,line in enumerate(lines):
                  if 'Error:' in line or 'error:' in line or '(fail)' in line:selected.update(range(max(0,i-4),min(len(lines),i+22)))
              print('\n== '+file+' ==')
              for i in sorted(selected):print(lines[i])
              print('\n'.join(lines[-10:]))
          audit=json.loads(Path('/tmp/office-audit.json').read_text())
          print(json.dumps(audit.get('vulnerabilities',audit),indent=2))
          PY
          exit "$status"
      - name: Build expanded frontend
        id: expanded
        continue-on-error: true
        working-directory: frontend
        env:
          STATIC_BUILD: '1'
          WABI_WORKSPACE_ADDONS: all
        run: npm run build > /tmp/office-build.log 2>&1 || { tail -n 100 /tmp/office-build.log; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-20260917
          cache-on-failure: true
      - name: Real Authority contracts and workspace units
        id: server
        if: ${{ !cancelled() && steps.expanded.outcome == 'success' }}
        continue-on-error: true
        run: |
          status=0
          cargo test -p wabi-server workspace --lib --locked > /tmp/office-server.log 2>&1 || status=1
          cargo test -p wabi-server --test workspace_contract --locked -- --nocapture > /tmp/office-contract.log 2>&1 || status=1
          tail -n 100 /tmp/office-server.log
          tail -n 100 /tmp/office-contract.log
          exit "$status"
      - name: Strict diagnostic outcome
        if: always()
        env:
          FRONTEND: ${{ steps.frontend.outcome }}
          EXPANDED: ${{ steps.expanded.outcome }}
          SERVER: ${{ steps.server.outcome }}
        run: |
          echo "frontend=$FRONTEND expanded=$EXPANDED server=$SERVER"
          test "$FRONTEND" = success && test "$EXPANDED" = success && test "$SERVER" = success
