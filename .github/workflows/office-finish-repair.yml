name: Office guarded source repair
on:
  push:
    branches: [codex/docs-sheets-present-20260917]
    paths: [.github/workflows/office-finish-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'AzureFoxStudios/wabi' && github.ref == 'refs/heads/codex/docs-sheets-present-20260917'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Update only reviewed dependency pins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          package=Path('frontend/package.json');data=json.loads(package.read_text())
          data['dependencies']['pdfjs-dist']='6.2.108'
          data['overrides'].update({'socket.io-parser':'4.2.7','devalue':'5.9.2','cookie':'0.7.2','esbuild':'0.25.12'})
          data['devDependencies']['jszip']='3.10.1'
          package.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Resolve and validate the declared package versions
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --json > /tmp/office-security-audit.json || true
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/office-security-audit.json'))
          print(json.dumps(data.get('vulnerabilities',data),indent=2))
          for name in ('pdfjs-dist','socket.io-parser','devalue','cookie','esbuild'):
              assert name not in data.get('vulnerabilities',{}), f'Unresolved advisory for {name}'
          PY
      - name: Commit only dependency pins and lockfile
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(office): patch PDF.js parser serialization and development dependency advisories'
            git push origin HEAD:refs/heads/codex/docs-sheets-present-20260917
          fi
          git rev-parse HEAD
      - name: Verify frontend and all focused regressions with the new lockfile
        working-directory: frontend
        run: |
          status=0
          npm run check > /tmp/office-check.log 2>&1 || status=1
          bun test src/lib/workspaces > /tmp/office-unit.log 2>&1 || status=1
          STATIC_BUILD=1 WABI_WORKSPACE_ADDONS=all npm run build > /tmp/office-build.log 2>&1 || status=1
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ('check','unit','build'):
              lines=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',Path('/tmp/office-'+name+'.log').read_text()).splitlines()
              print('\n=== '+name+' ===')
              selected=set()
              for i,line in enumerate(lines):
                  if 'Error:' in line or 'error:' in line or '(fail)' in line:selected.update(range(max(0,i-3),min(len(lines),i+22)))
              for i in sorted(selected):print(lines[i])
              print('\n'.join(lines[-12:]))
          PY
          exit "$status"
