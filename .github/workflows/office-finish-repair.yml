name: Office guarded source repair
on:
  push:
    branches: [codex/docs-sheets-present-20260917]
    paths: [.github/workflows/office-finish-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'AzureFoxStudios/wabi' && github.ref == 'refs/heads/codex/docs-sheets-present-20260917'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed selection and crop-privacy integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pending={}
          def replace(path,before,after,count=1):
              text=pending.setdefault(path,Path(path).read_text())
              if after and text.count(after)==count:return
              if text.count(before)!=count:raise RuntimeError(f'{path}: expected {count} anchors, found {text.count(before)}')
              pending[path]=text.replace(before,after)
          p='frontend/src/lib/workspaces/present/PresentWorkspace.svelte'
          replace(p,"    import {editionFingerprint} from './versionPreview';", "    import {editionFingerprint} from './versionPreview';\n    import {resolveSlideSelection} from './selection';")
          replace(p,'$effect(()=>{if(current&&current.id!==selectedId)selectedId=current.id;});', '$effect(()=>{if(current&&current.id!==selectedId)select(current.id);});')
          replace(p,"async function open(id:string){if(scope)await use(await openArtifact(scope,id,'present'));}", "async function open(id:string,anchor?:string){if(!scope)return;const session=await openArtifact(scope,id,'present');await use(session);if(active!==session||!session.scope.isCurrent())return;const target=resolveSlideSelection(session.data,anchor);if(target){select(target.slideId);selectedObject=target.objectId;}}")
          replace(p,'open(target.id!)','open(target.id!,target.anchor)')
          replace(p,'slide={current} {aspect} onselect={id=>selectedObject=id}', 'slide={current} {aspect} selectedObjectId={selectedObject} onselect={id=>selectedObject=id}')
          p='frontend/src/lib/workspaces/present/NativeSlideDesigner.svelte'
          replace(p,'aspect,onselect=()=>{}}:', 'aspect,selectedObjectId=null,onselect=()=>{}}:')
          replace(p,'aspect:number;onselect?:', 'aspect:number;selectedObjectId?:string|null;onselect?:')
          replace(p,'    $effect(()=>session.state.subscribe', "    $effect(()=>{if(selectedObjectId&&design?.objects.some(object=>object.id===selectedObjectId))selected=selectedObjectId;});\n    $effect(()=>session.state.subscribe")
          replace(p,'    function move(event:KeyboardEvent', '''    async function finishCrop(){
                  if(!chosen||busy||!editable)return;
                  const object={...chosen},id=slide.id,captured=session,ratio=aspect;
                  busy=true;error='';
                  try{
                      const image=await(await import('./finalizeCrop')).finalizeCrop(object,ratio,abort.signal);
                      if(disposed||session!==captured||!captured.scope.isCurrent()||slide.id!==id)return;
                      const latest=readDesign(captured.data,id)?.objects.find(item=>item.id===object.id);
                      if(!latest||JSON.stringify(latest)!==JSON.stringify(object))throw new Error('The image changed while cropping. Review the latest object and try again.');
                      patchSceneObject(captured,id,object.id,{image,fit:'contain',cropX:.5,cropY:.5});
                  }catch(e){if(!disposed)error=e instanceof Error?e.message:String(e);}
                  finally{if(!disposed)busy=false;}
              }
              function move(event:KeyboardEvent''')
          replace(p,'>Replace object image</button>', '>Replace object image</button>{#if chosen.image&&chosen.fit===\'cover\'}<button disabled={!editable||busy} onclick={()=>void finishCrop()}>Finalize image crop</button><span>Finalize before presenting: only the visible pixels will enter the audience image. Undo restores the authoring original.</span>{/if}')
          p='frontend/src/lib/workspaces/scene.ts'
          replace(p,'export function tableRows(', '''export function publicDesign(value:unknown):SlideDesign {
              const design=cleanDesign(value);
              if(design.objects.some(object=>object.kind==='image'&&object.image&&object.fit==='cover'))throw new Error('Finalize each image crop before presenting or exporting the audience version.');
              return design;
          }
          export function tableRows(''')
          p='frontend/src/lib/workspaces/present/model.ts'
          replace(p,"import {readDesign,setDesign} from './nativeScene';", "import {readDesign,setDesign} from './nativeScene';\nimport {publicDesign} from '../scene';")
          replace(p,'?{design:s.design}:{}','?{design:publicDesign(s.design)}:{}')
          p='core/crates/wabi-server/src/api/workspace_scene.rs'
          replace(p,'#[cfg(test)]mod tests {', '''pub(super) fn audience(source:&Value)->Result<Design>{
              let design=project(source)?;
              if design.objects.iter().any(|object|object.kind=="image"&&object.image.is_some()&&object.fit=="cover") {return Err(bad("Finalize image crops before publishing an audience rendition"));}
              Ok(design)
          }
          #[cfg(test)]mod tests {''')
          p='core/crates/wabi-server/src/api/workspace_present.rs'
          replace(p,'Some(scene::project(&slide["design"])? )','Some(scene::audience(&slide["design"])? )') if 'Some(scene::project(&slide["design"])? )' in Path(p).read_text() else replace(p,'Some(scene::project(&slide["design"])?)','Some(scene::audience(&slide["design"])?)')
          p='frontend/scripts/office-workspace-browser-smoke.mjs'
          replace(p,"import {compatibilityFixtures} from './office-compatibility-fixtures.mjs';", "import {compatibilityFixtures} from './office-compatibility-fixtures.mjs';\nimport {nativeCanvasAcceptance} from './office-native-canvas-acceptance.mjs';")
          replace(p,'originalName:r.original?.name}', "originalName:r.original?.name,data:doc.getMap('data').toJSON()}")
          replace(p,"            await a.getByRole('button',{name:'New presentation',exact:true}).click();\n            await a.getByLabel('Slide title'", "            checks+=await nativeCanvasAcceptance(a,b,host.accounts,artifacts,engineName);\n            await a.getByRole('button',{name:'New presentation',exact:true}).click();\n            await a.getByLabel('Slide title'")
          for path,text in pending.items():Path(path).write_text(text)
          print('\n'.join(sorted(pending)))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/lib/workspaces/present/PresentWorkspace.svelte frontend/src/lib/workspaces/present/NativeSlideDesigner.svelte frontend/src/lib/workspaces/present/model.ts frontend/src/lib/workspaces/scene.ts core/crates/wabi-server/src/api/workspace_scene.rs core/crates/wabi-server/src/api/workspace_present.rs frontend/scripts/office-workspace-browser-smoke.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix(present): resolve stable selections and remove hidden crop pixels from publication'
            git push origin HEAD:refs/heads/codex/docs-sheets-present-20260917
          fi
          git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Frontend diagnostics and focused regression tests
        id: frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          npm ci
          status=0
          npm run check > /tmp/office-typecheck.log 2>&1 || status=1
          bun test src/lib/workspaces > /tmp/office-unit.log 2>&1 || status=1
          cat /tmp/office-unit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          lines=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',Path('/tmp/office-typecheck.log').read_text()).splitlines()
          selected=set()
          for i,line in enumerate(lines):
              if 'Error:' in line or 'error ' in line.lower():selected.update(range(max(0,i-3),min(len(lines),i+20)))
          for i in sorted(selected):print(lines[i])
          print('\n'.join(lines[-10:]))
          PY
          exit "$status"
      - name: Build expanded frontend
        id: expanded
        continue-on-error: true
        working-directory: frontend
        env:
          STATIC_BUILD: '1'
          WABI_WORKSPACE_ADDONS: all
        run: npm run build > /tmp/office-build.log 2>&1 || { tail -n 100 /tmp/office-build.log; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-20260917
          cache-on-failure: true
      - name: Real Authority contracts and workspace units
        id: server
        if: ${{ !cancelled() && steps.expanded.outcome == 'success' }}
        continue-on-error: true
        run: |
          status=0
          cargo test -p wabi-server workspace --lib --locked > /tmp/office-server.log 2>&1 || status=1
          cargo test -p wabi-server --test workspace_contract --locked -- --nocapture > /tmp/office-contract.log 2>&1 || status=1
          tail -n 120 /tmp/office-server.log
          tail -n 100 /tmp/office-contract.log
          exit "$status"
      - name: Strict diagnostic outcome
        if: always()
        env:
          FRONTEND: ${{ steps.frontend.outcome }}
          EXPANDED: ${{ steps.expanded.outcome }}
          SERVER: ${{ steps.server.outcome }}
        run: |
          echo "frontend=$FRONTEND expanded=$EXPANDED server=$SERVER"
          test "$FRONTEND" = success && test "$EXPANDED" = success && test "$SERVER" = success
