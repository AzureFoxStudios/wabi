name: Voice Browser Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/lib/calling*.ts'
      - 'frontend/src/lib/callSession*.ts'
      - 'frontend/src/lib/audio*.ts'
      - 'frontend/src/lib/components/Call*.svelte'
      - 'frontend/src/lib/components/Voice*.svelte'
      - 'frontend/test/**'
      - 'frontend/scripts/audio-browser-smoke.mjs'
      - '.github/workflows/voice-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-voice:
    name: Headful synthetic voice regression
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # The isolated Vite harness still resolves the repository tsconfig while
      # optimizing imported production modules. On a fresh checkout that file
      # extends .svelte-kit/tsconfig.json, so generate SvelteKit's type/config
      # output before Vite starts. Local verification often had this directory
      # already from check/build, which hid the clean-run dependency.
      - name: Generate SvelteKit config
        working-directory: frontend
        run: npx svelte-kit sync

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Wabi's normal application is intentionally not exercised headless here.
      # The isolated audio harness launches Chromium headful under Xvfb and uses
      # generated media only: no account, microphone, speaker, or deployment.
      - name: Run voice admission/reconnect/ownership smoke
        working-directory: frontend
        run: >-
          xvfb-run -a node scripts/audio-browser-smoke.mjs
          /__voice_admission
          /__call_reconnect
          /__voice_ownership
