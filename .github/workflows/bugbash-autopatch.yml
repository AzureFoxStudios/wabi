name: Temporary bugbash autopatch

on:
  push:
    branches:
      - fix/showcase-readiness-bugbash

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/showcase-readiness-bugbash
          fetch-depth: 0

      - name: Apply DM entry patch
        run: python scripts/apply-dm-bugbash-patch.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: cd frontend && npm ci --no-audit --no-fund

      - name: DM regression tests
        run: cd frontend && bun test src/lib/dmEntry.test.ts

      - name: Frontend check
        run: cd frontend && bun run check

      - name: Commit repaired entry points
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/components/UserPopoutImpl.svelte frontend/src/lib/components/UserListTabImpl.svelte
          git commit -m "fix(dm): restore user-entry conversation creation"
          git push origin HEAD:fix/showcase-readiness-bugbash
