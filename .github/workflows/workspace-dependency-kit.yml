name: Workspace dependency kit
on:
  push:
    branches: [codex/docs-sheets-present-20260917]
    paths: [.github/workflows/workspace-dependency-kit.yml]
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve workspace packages without changing the remote branch
        working-directory: frontend
        run: |
          npm ci
          npm install --save-exact yjs@13.6.27 xlsx@https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz pdfjs-dist@5 pptxgenjs@4
          npm ls yjs xlsx pdfjs-dist pptxgenjs
      - name: Package exact dependencies and lockfile
        run: |
          mkdir -p /tmp/wabi-workspace-dependencies
          tar -czf /tmp/wabi-workspace-dependencies/dependencies.tar.gz -C frontend node_modules package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: wabi-workspace-dependencies
          path: /tmp/wabi-workspace-dependencies
          retention-days: 2
