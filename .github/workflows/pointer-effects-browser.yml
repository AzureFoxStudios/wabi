name: Pointer effects browser checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/src/lib/effects/**'
      - 'frontend/src/lib/components/settings/AppearanceSettingsTab.svelte'
      - 'frontend/src/styles/**'
      - 'frontend/scripts/*visual-effects-browser*'
      - 'frontend/scripts/pointer-effects-browser*'
      - 'frontend/test/*visual-effects-browser*'
      - 'frontend/test/pointer-effects-browser*'
      - 'frontend/package*.json'
      - 'src-tauri/tauri.conf.json'
      - '.github/workflows/pointer-effects-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pointer-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx svelte-kit sync
      - run: npx playwright install --with-deps chromium
      - name: Local import and shader audit
        run: xvfb-run -a node scripts/local-visual-effects-browser-smoke.mjs
      - name: Pointer worlds, settings and physical input
        run: xvfb-run -a node scripts/pointer-effects-browser-smoke.mjs
      - name: Save synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pointer-effects-visuals
          path: frontend/test-results/pointer-effects
          if-no-files-found: ignore
