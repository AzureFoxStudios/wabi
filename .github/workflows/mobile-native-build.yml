name: Native Mobile Build

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-aarch64:
    name: Android aarch64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      NDK_VERSION: 27.2.12479018

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust with Android target
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install JavaScript dependencies
        run: |
          npm ci --no-audit --no-fund
          cd frontend
          npm ci --no-audit --no-fund

      - name: Initialize generated Android project
        run: npm run desktop:android:init -- --ci --skip-targets-install

      - name: Build Android debug APK
        run: npm run desktop:android:build -- --apk --target aarch64 --debug

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: wabi-android-aarch64-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
