name: Mobile green source patch

on:
  push:
    branches:
      - fix/mobile-native-green-2026-09-13
    paths:
      - '.github/workflows/_mobile-green-source-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-native-green-2026-09-13
          fetch-depth: 0
      - name: Apply focused mobile cleanup
        shell: python
        run: |
          from pathlib import Path

          voice = Path('frontend/src/lib/components/VoiceView.svelte')
          text = voice.read_text()
          old = "\tlet transportSwapBusy = false;\n\tlet recordBusy = false;"
          new = "\tlet transportSwapBusy = $state(false);\n\tlet recordBusy = $state(false);"
          if old not in text and new not in text:
              raise SystemExit('VoiceView busy-state anchor not found')
          voice.write_text(text.replace(old, new, 1))

          layout = Path('frontend/src/lib/components/MainLayout.svelte')
          text = layout.read_text()
          central = """\n\t\t// Chat stage: preview opening whichever side user drags toward.\n\t\tif (deltaX > 0) {\n\t\t\tswipePreviewTarget = 'channels';\n\t\t\tswipePreviewOffsetX = Math.max(0, Math.min(width, deltaX));\n\t\t\tswipePreviewActive = true;\n\t\t\treturn;\n\t\t}\n\n\t\tif (deltaX < 0) {\n\t\t\tswipePreviewTarget = 'users';\n\t\t\tswipePreviewOffsetX = Math.max(-width, Math.min(0, deltaX));\n\t\t\tswipePreviewActive = true;\n\t\t\treturn;\n\t\t}\n"""
          if central in text:
              text = text.replace(central, "\n\t\t// Opening side panels is edge-only. Central horizontal drags belong to chat content.\n", 1)
          elif 'Opening side panels is edge-only.' not in text:
              raise SystemExit('MainLayout central-swipe anchor not found')

          vertical_hide = """\n\t\t\tif (mobileNavVisible && swipeDown) {\n\t\t\t\tmobileNavVisible = false;\n\t\t\t\tresetTouchSwipe();\n\t\t\t\treturn;\n\t\t\t}\n"""
          if vertical_hide in text:
              text = text.replace(vertical_hide, "", 1)
          layout.write_text(text)
      - name: Commit patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'wabi-mobile-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/src/lib/components/VoiceView.svelte frontend/src/lib/components/MainLayout.svelte
          git commit -m 'fix(mobile): keep gestures edge-scoped and call controls reactive'
          git push origin HEAD:fix/mobile-native-green-2026-09-13
