# Temporary, branch-scoped repair job. Removed after its reviewed changes land.
name: Apply Reader validation fixes

on:
  pull_request:
    paths:
      - '.github/workflows/reader-validation-repair.yml'
      - 'frontend/scripts/reader-validation-fixes.patch'

permissions:
  contents: read

jobs:
  apply-reviewed-fixes:
    if: github.repository == 'AzureFoxStudios/wabi' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/reader-longform-redesign'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed patch and restore TypeScript compatibility
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if git apply --reverse --check frontend/scripts/reader-validation-fixes.patch 2>/dev/null; then
            echo 'Reviewed fixes are already present.'
            exit 0
          fi
          git apply --check frontend/scripts/reader-validation-fixes.patch
          git apply frontend/scripts/reader-validation-fixes.patch
          cp frontend/package.json /tmp/reader-package-before.json
          cp frontend/package-lock.json /tmp/reader-lock-before.json
          cd frontend
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact typescript@6.0.3 --no-audit --no-fund
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const before = read('/tmp/reader-package-before.json');
          const after = read('package.json');
          assert.equal(before.devDependencies.typescript, '7.0.2');
          before.devDependencies.typescript = '6.0.3';
          assert.deepEqual(after, before, 'Only the TypeScript pin may change in package.json');
          const oldLock = read('/tmp/reader-lock-before.json');
          const newLock = read('package-lock.json');
          assert.equal(newLock.packages['node_modules/typescript'].version, '6.0.3');
          const allowed = (key) => key === '' || key === 'node_modules/typescript' || key.startsWith('node_modules/@typescript/typescript-');
          for (const key of new Set([...Object.keys(oldLock.packages), ...Object.keys(newLock.packages)])) {
            if (allowed(key)) continue;
            assert.ok(oldLock.packages[key] && newLock.packages[key], `Unexpected dependency added or removed: ${key}`);
            for (const field of ['version', 'resolved', 'integrity']) {
              assert.equal(newLock.packages[key][field], oldLock.packages[key][field], `Unrelated dependency changed: ${key}.${field}`);
            }
          }
          console.log('Verified: only TypeScript and its obsolete native platform packages changed.');
          JS
          cd ..
          git add frontend/package.json frontend/package-lock.json \
            frontend/src/lib/components/ReaderTabImpl.svelte \
            frontend/src/lib/readerLibrary.ts \
            frontend/src/styles/components/reader-tab.css \
            frontend/scripts/reader-browser-smoke.mjs
          git diff --cached --check
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'fix(reader): validate narrow layouts and restore supported TypeScript toolchain'
          # Fast-forward only, to this feature branch only. Never touches main.
          git push origin HEAD:refs/heads/feat/reader-longform-redesign
