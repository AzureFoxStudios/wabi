name: Reader checks

on:
  pull_request:
    paths:
      - 'frontend/src/lib/components/Reader*.svelte'
      - 'frontend/src/lib/components/reader*.ts'
      - 'frontend/src/lib/reader*.ts'
      - 'frontend/src/styles/components/reader-tab.css'
      - 'frontend/scripts/reader-browser-smoke.mjs'
      - '.github/workflows/reader-checks.yml'

permissions:
  contents: read

concurrency:
  group: reader-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Reader unit tests (no third-party dependencies)
        working-directory: frontend
        run: bun test src/lib/components/readerDocumentTools.test.ts
      # Diagnostic fixture only: it stubs SvelteKit's environment and does not
      # execute Kit or TypeScript. The repository currently pins TS 7 while
      # Kit declares TS 5/6 as an optional peer. Keep the exact committed lock;
      # never regenerate it or relax the normal CI/release install gates here.
      - name: Install locked dependencies for isolated Reader fixture
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Package offline Reader verification inputs
        working-directory: frontend
        run: |
          mkdir -p /tmp/wabi-reader-offline
          tar -czf /tmp/wabi-reader-offline/reader-verification.tgz \
            package.json package-lock.json node_modules \
            src/lib/components/ReaderTabImpl.svelte \
            src/lib/components/ReaderImportSheet.svelte \
            src/lib/components/ReaderIcon.svelte \
            src/lib/components/readerTabHelpers.ts \
            src/lib/components/readerDocumentTools.ts \
            src/lib/components/readerDocumentTools.test.ts \
            src/lib/readerWorkspace.ts src/lib/readerLibrary.ts \
            src/styles/components/reader-tab.css scripts/reader-browser-smoke.mjs
      - name: Upload offline verification inputs
        uses: actions/upload-artifact@v4
        with:
          name: reader-offline-verification
          path: /tmp/wabi-reader-offline/reader-verification.tgz
          retention-days: 1
      - name: Install Chromium and display dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise production Reader in a headful browser
        working-directory: frontend
        run: xvfb-run -a node scripts/reader-browser-smoke.mjs
      - name: Upload actual browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-browser-checks
          path: /tmp/wabi-reader-artifacts
          if-no-files-found: ignore
          retention-days: 7
