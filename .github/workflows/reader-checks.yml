name: Reader checks

on:
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/src/lib/components/Reader*.svelte'
      - 'frontend/src/lib/components/reader*.ts'
      - 'frontend/src/lib/components/reader*.css'
      - 'frontend/src/lib/reader*.ts'
      - 'frontend/src/styles/components/reader-tab.css'
      - 'frontend/scripts/reader-browser-smoke.mjs'
      - 'frontend/scripts/reader-documents-browser-smoke.mjs'
      - '.github/workflows/reader-checks.yml'

permissions:
  contents: read

concurrency:
  group: reader-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Runtime toolchain fingerprint (Node2Shell floor)
        run: node scripts/security/toolchain-fingerprint.mjs --require-bun
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Reader unit tests
        working-directory: frontend
        run: bun test src/lib/components/readerDocumentTools.test.ts src/lib/readerCode.test.ts src/lib/readerDocument*.test.ts
      # Vite's native dependency resolver also visits the parent project.
      # Its tsconfig extends the generated Kit configuration, even though
      # the Reader fixture itself uses an isolated, minimal tsconfig.
      - name: Generate SvelteKit configuration
        working-directory: frontend
        run: npx svelte-kit sync
      - name: Install Chromium and display dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise production Reader in a headful browser
        working-directory: frontend
        run: xvfb-run -a node scripts/reader-browser-smoke.mjs
      - name: Exercise local-first Reader documents
        working-directory: frontend
        run: xvfb-run -a node scripts/reader-documents-browser-smoke.mjs
      - name: Upload actual browser screenshots and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-browser-checks
          path: /tmp/wabi-reader-artifacts
          if-no-files-found: ignore
          retention-days: 7
