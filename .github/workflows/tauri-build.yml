name: Build Tauri App

on:
  push:
    branches: [ main, feature/*, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.93
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-apple-darwin

      - name: Setup Go for Tailcat (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup icons
        run: node scripts/setup-icons.js

      - name: Install frontend dependencies (locked)
        run: cd frontend && npm ci --no-audit --no-fund

      # Tauri externalBin requires target-suffixed files under
      # src-tauri/binaries. Linux/Windows use checksum-pinned v0.4.0 release
      # assets; macOS v0.4.0 has no binary asset, so the staging script builds
      # both macOS architectures from the exact pinned upstream commit.
      - name: Stage Tailcat sidecar
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ./scripts/fetch-tailcat-sidecar.sh aarch64-apple-darwin x86_64-apple-darwin
          else
            ./scripts/fetch-tailcat-sidecar.sh
          fi

      # STATIC_BUILD=1 emits the adapter-static SPA (index.html); the default
      # build is adapter-node and produces nothing Tauri can serve. Use the
      # Actions env map instead of POSIX-only inline assignment so this also
      # works under PowerShell on Windows.
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          STATIC_BUILD: 1

      - name: Install Tauri dependencies (Windows & macOS)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: |
          cd frontend
          npm ci --no-audit --no-fund

      - name: Build Tauri app
        working-directory: .
        run: |
          echo "Starting Tauri build..."
          bunx @tauri-apps/cli@2.11.4 build --ci
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: debug

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: src-tauri/target/release/bundle/

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: src-tauri/target/release/bundle/

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: src-tauri/target/release/bundle/

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
