name: Build Tauri App (Manual Diagnostic)

on:
  workflow_dispatch:

env:
  WABI_SOURCE_REVISION: ${{ github.sha }}
  RUSTUP_TOOLCHAIN: 1.93.1

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Runtime toolchain fingerprint (Node2Shell floor)
        run: node scripts/security/toolchain-fingerprint.mjs --require-bun

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@633c1125191e55c620c8ae7d364073c0ead621c1 # 1.93 (branch)
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-apple-darwin

      - name: Setup Go for Tailcat (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup icons
        run: node scripts/setup-icons.js

      - name: Install frontend dependencies (locked)
        run: cd frontend && npm ci --no-audit --no-fund

      # Tauri externalBin requires target-suffixed files under
      # src-tauri/binaries. Linux/Windows use checksum-pinned v0.4.0 release
      # assets; macOS v0.4.0 has no binary asset, so the staging script builds
      # both macOS architectures from the exact pinned upstream commit.
      - name: Stage Tailcat sidecar
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ./scripts/fetch-tailcat-sidecar.sh aarch64-apple-darwin x86_64-apple-darwin
          else
            ./scripts/fetch-tailcat-sidecar.sh
          fi

      # STATIC_BUILD=1 emits the adapter-static SPA (index.html); the default
      # build is adapter-node and produces nothing Tauri can serve. Use the
      # Actions env map instead of POSIX-only inline assignment so this also
      # works under PowerShell on Windows.
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          STATIC_BUILD: 1

      - name: Install Tauri dependencies (Windows & macOS)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: |
          cd frontend
          npm ci --no-audit --no-fund

      - name: Build and stage bundled Authority
        run: node scripts/build-desktop-host.mjs

      - name: Build Tauri app
        working-directory: .
        run: |
          echo "Starting Tauri build..."
          bunx @tauri-apps/cli@2.11.4 build --ci -- --locked
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: debug

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wabi-desktop-windows
          path: |
            src-tauri/target/release/bundle/msi/**/*.msi
            src-tauri/target/release/bundle/nsis/**/*.exe
          if-no-files-found: error
          retention-days: 5

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wabi-desktop-linux
          path: |
            src-tauri/target/release/bundle/deb/**/*.deb
            src-tauri/target/release/bundle/rpm/**/*.rpm
            src-tauri/target/release/bundle/appimage/**/*.AppImage
          if-no-files-found: error
          retention-days: 5

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wabi-desktop-macos
          path: |
            src-tauri/target/release/bundle/dmg/**/*.dmg
          if-no-files-found: error
          retention-days: 5

      # NOTE: The create-release job has been removed from this workflow.
      # Release creation is now handled exclusively by .github/workflows/build.yml
      # on push tags matching v*. This manual workflow is for native diagnostic
      # builds only and does not publish releases.
