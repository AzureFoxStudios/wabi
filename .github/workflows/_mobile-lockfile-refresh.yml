name: Mobile native lockfile refresh

on:
  push:
    branches:
      - fix/mobile-native-green-2026-09-13
    paths:
      - '.github/workflows/_mobile-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-native-green-2026-09-13
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93.1
      - name: Resolve pinned native dependency graph
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wabi-mobile-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/_mobile-lockfile-refresh.yml
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already matches Cargo.toml'
            exit 0
          fi
          git commit -m 'chore(mobile): pin native credential dependencies'
          git push origin HEAD:fix/mobile-native-green-2026-09-13
