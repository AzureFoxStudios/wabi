[package]
name = "mlsrs-proto"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Throwaway trial of mls-rs for ADR-0003. Not part of Wabi."

# Its own workspace, so the root Wabi workspace, its lockfile, cargo-deny and CI never see it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["rustcrypto"]
rustcrypto = ["dep:mls-rs-crypto-rustcrypto"]
# Browser build with pure-Rust crypto (sync API).
wasm = ["dep:wasm-bindgen", "dep:web-sys", "mls-rs-crypto-rustcrypto?/browser"]
# Browser build with the browser's own WebCrypto. Needs RUSTFLAGS="--cfg mls_build_async".
webcrypto = ["dep:mls-rs-crypto-webcrypto", "dep:wasm-bindgen", "dep:web-sys", "dep:wasm-bindgen-futures"]

[dependencies]
mls-rs = { version = "=0.57.1", default-features = false, features = ["std", "rfc_compliant", "tree_index", "fast_serialize", "external_client"] }
mls-rs-core = "=0.27.0"
mls-rs-crypto-rustcrypto = { version = "=0.23.0", optional = true }
mls-rs-crypto-webcrypto = { version = "=0.16.0", optional = true }
maybe-async = "0.2.10"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Window", "Performance"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mls_build_async)'] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
