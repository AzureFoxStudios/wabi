[package]
name = "storage-compat-current"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[features]
# OpenMLS's documented switch for reading 0.8.x-written state.
om-081-format = ["openmls/0-8-1-storage-format"]

[dependencies]
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
mls-rs = { version = "=0.57.1", default-features = false, features = ["std", "rfc_compliant", "tree_index", "fast_serialize"] }
mls-rs-core = "=0.27.0"
mls-rs-crypto-rustcrypto = "=0.23.0"
openmls_basic_credential_new = { package = "openmls_basic_credential", version = "=0.6.0" }
serde_json = "1"
