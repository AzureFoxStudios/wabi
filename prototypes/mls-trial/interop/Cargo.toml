[package]
name = "mls-interop-trial"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Throwaway cross-library test for ADR-0003: OpenMLS and mls-rs clients in one group."

[workspace]

[dependencies]
openmls-proto = { path = "../openmls-proto" }
mlsrs-proto = { path = "../mlsrs-proto" }
mls-rs = { version = "=0.57.1", default-features = false, features = ["std", "rfc_compliant", "tree_index", "fast_serialize", "external_client"] }
