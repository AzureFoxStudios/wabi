[package]
name = "openmls-proto"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "Throwaway trial of OpenMLS for ADR-0003. Not part of Wabi."

# Its own workspace, so the root Wabi workspace, its lockfile, cargo-deny and CI never see it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["openmls/js", "dep:wasm-bindgen", "dep:web-sys", "dep:getrandom_old"]

[dependencies]
openmls = "=0.9.2"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["Window", "Performance"], optional = true }
# openmls-wasm in the OpenMLS repo says this old getrandom is "currently required"
getrandom_old = { package = "getrandom", version = "0.2", features = ["js"], optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
