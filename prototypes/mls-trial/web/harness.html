<!doctype html>
<meta charset="utf-8">
<title>MLS trial harness</title>
<pre id="out">loading</pre>
<script type="module">
// Loads one wasm-bindgen build (?v=<dir>) and exposes run() to the Playwright driver.
const v = new URLSearchParams(location.search).get("v");
const t0 = performance.now();
const mod = await import(`./${v}/lib.js`);
const exports = await mod.default();
const loadMs = performance.now() - t0;
window.trial = {
  loadMs,
  wasmBytes: () => exports.memory.buffer.byteLength,
  scenario: async (cs) => await mod.run_scenario(cs),
  bench: async (n, cs) => JSON.parse(await mod.bench(n, cs)),
};
document.getElementById("out").textContent = "ready";
</script>
