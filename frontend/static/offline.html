<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<!-- This page paints before any role token exists, so its colours are the resolved roles of the
	     default theme (Wabi Ink), the same values app.html keeps in --boot-*. No gradients: the
	     offline page is a page, not an object, so it takes paper and ink and nothing else. -->
	<meta name="theme-color" content="#101315" />
	<title>Wabi — Offline</title>
	<style>
		:root {
			--ink: #101315;
			--raise: #1b2125;
			--text: #e8e7e0;
			--mute: #9aa39d;
			--faint: #818983;
			--line-strong: #6a6b6a;
			--radius: 8px;
			color-scheme: dark;
		}
		html, body {
			min-height: 100%;
			margin: 0;
			font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Segoe UI', Roboto, sans-serif;
			color: var(--text);
			background: var(--ink);
		}
		.wrap {
			min-height: 100dvh;
			display: grid;
			place-items: center;
			padding: 24px;
			box-sizing: border-box;
			text-align: center;
		}
		.logo {
			width: 72px;
			height: 72px;
			object-fit: contain;
			margin-bottom: 16px;
			opacity: 0.95;
			filter: invert(1);
		}
		h1 {
			margin: 0 0 8px;
			font-size: 1.35rem;
			font-weight: 500;
			letter-spacing: 0.01em;
		}
		p {
			margin: 0 auto 20px;
			max-width: 28rem;
			line-height: 1.5;
			color: var(--mute);
			font-size: 0.95rem;
		}
		.btn {
			appearance: none;
			border: 1px solid var(--line-strong);
			background: var(--raise);
			color: var(--text);
			border-radius: var(--radius);
			padding: 10px 16px;
			font: inherit;
			font-weight: 500;
			cursor: pointer;
		}
		.btn:hover { border-color: var(--text); }
		.btn:focus-visible { outline: 2px solid var(--mute); outline-offset: 2px; }
		.hint { margin-top: 14px; font-size: 0.8rem; color: var(--faint); }
	</style>
</head>
<body>
	<div class="wrap">
		<div>
			<img class="logo" src="/wabi-logo-small.webp" alt="" width="72" height="72" />
			<h1>You're offline</h1>
			<p>
				Wabi can't reach the server right now. When you're back online, reload to restore
				the full app. Local data stays on this device.
			</p>
			<button class="btn" type="button" id="reload">Try again</button>
			<p class="hint">If this was a brief blip, reload usually fixes it.</p>
		</div>
	</div>
	<script>
		document.getElementById('reload')?.addEventListener('click', () => location.reload());
		window.addEventListener('online', () => location.reload());
	</script>
</body>
</html>
