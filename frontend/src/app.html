<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" data-wabi-favicon />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#0D1024" data-wabi-theme-color />
		<meta name="description" content="Open-source, self-hosted communication and collaboration for small communities, with chat, calls, shared workspaces, and creative review." />
		<title data-wabi-brand-title>Wabi</title>
		<script>
			// Early shell flag so first paint can skip desktop chrome on phones / PWA.
			(() => {
				try {
					const compact = window.matchMedia('(max-width: 768px)').matches;
					const standalone =
						window.matchMedia('(display-mode: standalone)').matches ||
						(typeof navigator.standalone === 'boolean' && navigator.standalone === true);
					document.documentElement.dataset.shell = compact ? 'mobile' : 'desktop';
					document.documentElement.dataset.displayMode = standalone ? 'standalone' : 'browser';
					if (compact) document.documentElement.classList.add('is-mobile-shell');
					if (standalone) document.documentElement.classList.add('is-pwa-standalone');
					try {
						const saved = JSON.parse(localStorage.getItem('wabi-theme') || 'null');
						if (saved && /^(light|paper-dawn|professional)$/.test(saved.theme_id || '')) document.documentElement.dataset.bootMode = 'light';
					} catch (_) {}
				} catch (_) {}
			})();
		</script>
		<style>
			html,
			body {
				min-height: 100%;
				margin: 0;
				background:
					radial-gradient(ellipse 70rem 42rem at 50% -10%, rgba(99, 102, 241, 0.14), transparent 62%),
					radial-gradient(ellipse 48rem 34rem at 12% 92%, rgba(129, 140, 248, 0.1), transparent 60%),
					linear-gradient(165deg, #0D1024 0%, #0A0D1E 55%, #070914 100%);
			}

			#wabi-boot-shell {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: grid;
				place-items: center;
				overflow: hidden;
				/* Soft wash — stays behind the glass stage */
				background:
					radial-gradient(ellipse 50rem 36rem at 50% 40%, rgba(99, 102, 241, 0.12), transparent 70%),
					linear-gradient(165deg, rgba(15, 12, 41, 0.92) 0%, rgba(6, 11, 20, 0.96) 100%);
				transition:
					opacity 280ms ease,
					visibility 280ms ease;
			}

			#wabi-boot-shell.is-hidden {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}

			.wabi-boot-shell__center {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1.1rem;
				padding: 2rem;
				text-align: center;
				color: rgba(255, 255, 255, 0.9);
				font-family:
					"Segoe UI",
					"SF Pro Display",
					system-ui,
					sans-serif;
				width: min(420px, 100%);
			}

			/* --- Stage: the inline mark. Painted immediately, never waits on an image. --- */
			.wabi-boot-shell__stage {
				position: relative;
				display: grid;
				place-items: center;
				width: 92px;
				height: 92px;
			}

			.wabi-boot-shell__orbit {
				position: absolute;
				inset: 0;
				border-radius: 28px;
				border: 1px solid rgba(199, 210, 254, 0.18);
				background: linear-gradient(160deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
				box-shadow:
					inset 0 0 0 1px rgba(255, 255, 255, 0.04),
					0 18px 40px rgba(0, 0, 0, 0.28);
			}

			.wabi-boot-shell__orbit::after {
				content: '';
				position: absolute;
				inset: -1px;
				border-radius: inherit;
				padding: 1.5px;
				background: conic-gradient(
					from 0deg,
					transparent 0 62%,
					color-mix(in srgb, var(--boot-accent, #818cf8) 92%, white) 78%,
					#ffffff 88%,
					transparent 100%
				);
				-webkit-mask:
					linear-gradient(#000 0 0) content-box,
					linear-gradient(#000 0 0);
				-webkit-mask-composite: xor;
				mask-composite: exclude;
				/* Rotate the element (not a custom property) so it animates everywhere. */
				animation: wabi-boot-orbit-spin 1.35s linear infinite;
			}

			.wabi-boot-shell__glyph {
				position: relative;
				z-index: 1;
				width: 60px;
				height: 60px;
			}

			/* Custom / server logo overlays the inline mark once it has loaded.
			   It never replaces the mark while still in flight — no blank stage. */
			.wabi-boot-shell__logo {
				position: absolute;
				z-index: 2;
				width: 64px;
				height: 64px;
				object-fit: contain;
				opacity: 0;
				visibility: hidden;
				filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.4));
			}

			#wabi-boot-shell[data-boot-ready='1'] .wabi-boot-shell__logo[src] {
				visibility: visible;
				animation: wabi-boot-logo-in 0.45s ease-out forwards;
			}

			/* Default Wabi boot asset is dark — invert only for the default brand. */
			#wabi-boot-shell[data-boot-brand='wabi'] .wabi-boot-shell__logo {
				filter: invert(1) drop-shadow(0 14px 30px rgba(0, 0, 0, 0.4));
			}

			/* --- Wordmark + status line --- */
			.wabi-boot-shell__title {
				margin: 0.15rem 0 0;
				font-size: 1.7rem;
				font-weight: 650;
				letter-spacing: -0.03em;
				line-height: 1.1;
				color: rgba(255, 255, 255, 0.94);
			}

			.wabi-boot-shell__title[data-empty='true'] {
				/* Hide product name when strip-Wabi / empty brand */
				visibility: hidden;
				height: 0;
				margin: 0;
				overflow: hidden;
			}

			.wabi-boot-shell__status {
				margin: 0.15rem 0 0;
				min-height: 1.4em;
				color: rgba(246, 245, 255, 0.62);
				font-size: 0.9375rem;
				line-height: 1.4;
			}

			/* --- Progress rail: driven by real gates, not a timer --- */
			.wabi-boot-shell__rail {
				width: min(280px, 78%);
				height: 3px;
				margin: 0.7rem 0 0;
				border-radius: 999px;
				background: rgba(255, 255, 255, 0.08);
				overflow: hidden;
				position: relative;
			}

			.wabi-boot-shell__rail > span {
				display: block;
				height: 100%;
				width: 0%;
				border-radius: inherit;
				background: linear-gradient(90deg, #6366f1, #c7d2fe);
				transition: width 480ms cubic-bezier(0.2, 0.8, 0.2, 1);
			}

			/* --- Step list: appears only after a beat, so a fast boot never sees it --- */
			.wabi-boot-shell__steps {
				list-style: none;
				padding: 0;
				margin: 1.1rem 0 0;
				width: min(320px, 100%);
				display: grid;
				gap: 8px;
				opacity: 0;
				visibility: hidden;
				transition: opacity 300ms ease;
			}

			.wabi-boot-shell__steps.is-visible {
				opacity: 1;
				visibility: visible;
			}

			.wabi-boot-shell__steps li {
				display: flex;
				align-items: center;
				gap: 10px;
				font-size: 13px;
				color: rgba(246, 245, 255, 0.38);
				text-align: left;
			}

			.wabi-boot-shell__steps li .dot {
				width: 16px;
				height: 16px;
				border-radius: 999px;
				border: 1px solid rgba(255, 255, 255, 0.16);
				display: grid;
				place-items: center;
				flex: none;
			}

			.wabi-boot-shell__steps li.active {
				color: rgba(246, 245, 255, 0.96);
			}
			.wabi-boot-shell__steps li.active .dot {
				border-color: transparent;
				background: color-mix(in srgb, var(--boot-accent, #818cf8) 25%, transparent);
				box-shadow: 0 0 0 4px color-mix(in srgb, var(--boot-accent, #818cf8) 12%, transparent);
			}
			.wabi-boot-shell__steps li.active .dot::after {
				content: '';
				width: 6px;
				height: 6px;
				border-radius: 99px;
				background: #c7d2fe;
			}

			.wabi-boot-shell__steps li.done {
				color: rgba(246, 245, 255, 0.78);
			}
			.wabi-boot-shell__steps li.done .dot {
				border-color: transparent;
				background: rgba(134, 239, 172, 0.18);
			}
			.wabi-boot-shell__steps li.done .dot::after {
				content: '';
				width: 7px;
				height: 4px;
				border-left: 1.5px solid #86efac;
				border-bottom: 1.5px solid #86efac;
				transform: rotate(-45deg) translate(0, -1px);
			}

			/* --- Recover: Try again + Work offline. Mark stays visible above it. --- */
			.wabi-boot-shell__recover {
				display: none;
				gap: 8px;
				margin-top: 0.6rem;
			}

			[data-boot-state='reconnect'] .wabi-boot-shell__recover,
			[data-boot-state='stalled'] .wabi-boot-shell__recover {
				display: flex;
			}

			.wabi-boot-shell__btn {
				padding: 0.55rem 1.25rem;
				border-radius: 9999px;
				border: 1px solid rgba(148, 163, 184, 0.28);
				background: rgba(255, 255, 255, 0.06);
				color: rgba(255, 255, 255, 0.9);
				font-family: inherit;
				font-size: 0.8125rem;
				font-weight: 600;
				cursor: pointer;
				transition:
					background 0.15s ease,
					border-color 0.15s ease;
			}
			.wabi-boot-shell__btn:hover {
				background: rgba(255, 255, 255, 0.12);
				border-color: rgba(148, 163, 184, 0.42);
			}
			.wabi-boot-shell__btn--primary {
				background: #f6f5ff;
				color: #11131f;
				border-color: transparent;
				font-weight: 650;
			}
			.wabi-boot-shell__btn--primary:hover {
				background: #ffffff;
				border-color: transparent;
			}

			/* --- Stall: rail freezes and warms, spin pauses, mark kept --- */
			[data-boot-state='stalled'] .wabi-boot-shell__rail > span {
				background: linear-gradient(90deg, #f59e0b, #fde68a);
				transition: none;
			}
			[data-boot-state='stalled'] .wabi-boot-shell__orbit::after {
				animation-play-state: paused;
				opacity: 0.45;
			}

			/* --- Reconnect: keep the mark, freeze the rail, offer a way out --- */
			[data-boot-state='reconnect'] .wabi-boot-shell__rail > span {
				transition: none;
			}
			[data-boot-state='reconnect'] .wabi-boot-shell__orbit::after {
				animation-play-state: paused;
				opacity: 0.55;
			}

			/* Neutral palette on boot (early data-neutral-branding or data-boot-brand) */
			html[data-neutral-branding] #wabi-boot-shell,
			#wabi-boot-shell[data-boot-brand='neutral'] {
				--boot-accent: #a1a1aa;
				background:
					radial-gradient(ellipse 50rem 36rem at 50% 40%, rgba(161, 161, 170, 0.1), transparent 70%),
					linear-gradient(165deg, rgba(24, 24, 27, 0.94) 0%, rgba(9, 9, 11, 0.97) 100%);
			}

			/* Neutral must not leak the Wabi glyph or wordmark, but it must never
			   be blank either — the orbit ring stays as the mark. The head script
			   sets html[data-neutral-branding] before the body parses, so this
			   holds from the very first paint. */
			html[data-neutral-branding] .wabi-boot-shell__title,
			html[data-neutral-branding] .wabi-boot-shell__glyph {
				visibility: hidden;
			}
			html[data-neutral-branding] .wabi-boot-shell__title {
				height: 0;
				overflow: hidden;
			}

			#wabi-boot-shell[data-boot-brand='neutral'] .wabi-boot-shell__glyph {
				visibility: hidden;
			}

			@keyframes wabi-boot-orbit-spin {
				to {
					transform: rotate(360deg);
				}
			}

			@keyframes wabi-boot-logo-in {
				from {
					opacity: 0;
					transform: scale(0.92);
				}
				to {
					opacity: 1;
					transform: scale(1);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.wabi-boot-shell__orbit::after {
					animation: none !important;
				}
				.wabi-boot-shell__rail > span {
					transition: none;
				}
				.wabi-boot-shell__steps {
					transition: none;
				}
				#wabi-boot-shell[data-boot-ready='1'] .wabi-boot-shell__logo[src] {
					animation: none;
					opacity: 1;
					visibility: visible;
				}
			}
		</style>
		<style>
			/* Boot — Wabi Ink. Operator branding still wins: the server injects --boot-accent / the logo. */
			:root { --boot-ink: #101315; --boot-text: #e8e7e0; --boot-mute: #9aa39d; --boot-line: rgba(232, 231, 224, 0.14); }
			html[data-boot-mode='light'] { --boot-ink: #faf8f3; --boot-text: #1c1917; --boot-mute: #57534e; --boot-line: rgba(28, 25, 23, 0.16); }
			html,
			body { background: var(--boot-ink); }
			#wabi-boot-shell {
				--boot-accent: #d6ad5f;
				background: radial-gradient(ellipse 46rem 30rem at 85% -10%, color-mix(in srgb, var(--boot-accent) 14%, transparent), transparent 62%), var(--boot-ink);
			}
			.wabi-boot-shell__glyph { color: var(--boot-text); }
			.wabi-boot-shell__center { color: var(--boot-text); font-family: "Zen Kaku Gothic New", system-ui, -apple-system, "Segoe UI", sans-serif; }
			.wabi-boot-shell__orbit { border-radius: 14px; border: 1px solid var(--boot-line); background: transparent; box-shadow: none; }
			.wabi-boot-shell__orbit::after { background: conic-gradient(from 0deg, transparent 0 66%, var(--boot-accent) 86%, transparent 100%); }
			.wabi-boot-shell__title { font-family: "Shippori Mincho", Georgia, serif; font-weight: 600; font-size: 1.9rem; letter-spacing: 0.01em; color: var(--boot-text); }
			.wabi-boot-shell__status { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 0.8125rem; color: var(--boot-mute); }
			.wabi-boot-shell__rail { height: 2px; border-radius: 2px; background: var(--boot-line); }
			.wabi-boot-shell__rail > span { background: var(--boot-accent); }
			.wabi-boot-shell__steps li { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 12px; color: var(--boot-mute); opacity: 0.7; }
			.wabi-boot-shell__steps li.active { color: var(--boot-text); opacity: 1; }
			.wabi-boot-shell__steps li.active .dot { background: color-mix(in srgb, var(--boot-accent) 22%, transparent); box-shadow: none; }
			.wabi-boot-shell__steps li.active .dot::after { background: var(--boot-accent); }
			.wabi-boot-shell__steps li.done { color: var(--boot-text); opacity: 0.85; }
			.wabi-boot-shell__steps li.done .dot { background: color-mix(in srgb, var(--boot-accent) 18%, transparent); }
			.wabi-boot-shell__steps li.done .dot::after { border-color: var(--boot-accent); }
			.wabi-boot-shell__btn { border-radius: 10px; border: 1px solid var(--boot-line); background: transparent; color: var(--boot-text); }
			.wabi-boot-shell__btn:hover { background: color-mix(in srgb, var(--boot-text) 8%, transparent); border-color: var(--boot-accent); }
			.wabi-boot-shell__btn--primary { background: var(--boot-text); color: var(--boot-ink); }
			.wabi-boot-shell__btn--primary:hover { background: var(--boot-text); opacity: 0.9; }
			[data-boot-state='stalled'] .wabi-boot-shell__rail > span { background: #e0553f; }
			html[data-boot-mode='light'] #wabi-boot-shell[data-boot-brand='wabi'] .wabi-boot-shell__logo { filter: none; }
		</style>
		<script>
			// Server-stamped brand (Phase 1 boot optimization): wabi-server
			// replaces the token below with its identity JSON at request time.
			// When un-replaced (raw file host / Tauri / dev-vite) it stays null
			// and the legacy saved-server/fetch logic below takes over.
			window.__WABI_SERVER_BRAND__ = /*__WABI_SERVER_BRAND__*/null;

			// Apply saved-server brand BEFORE first paint so boot isn't stuck on "Wabi".
			(() => {
				try {
					if (window.location.pathname.replace(/\/$/, '') === '/personal') {
						window.__WABI_BOOT_BRAND__ = { brandName: 'Wabi', logoUrl: '/wabi-logo.png', accent: '#d6ad5f' };
						return;
					}
					const NEUTRAL_SVG =
						"data:image/svg+xml;utf8," +
						"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'>" +
						"<rect width='96' height='96' rx='22' fill='%23a1a1aa'/>" +
						"<path d='M24 34a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v18a8 8 0 0 1-8 8H45l-13 11v-11h-8a8 8 0 0 1-8-8z' fill='%23101012'/>" +
						'</svg>';

					const injected =
						window.__WABI_SERVER_BRAND__ && typeof window.__WABI_SERVER_BRAND__ === 'object'
							? window.__WABI_SERVER_BRAND__
							: null;

					// Resolve this origin's saved-server entry (may be null).
					let entry = null;
					try {
						const raw = localStorage.getItem('wabi.savedServers.v1');
						if (raw) {
							const parsed = JSON.parse(raw);
							const entries = Array.isArray(parsed?.entries) ? parsed.entries : [];
							const currentOrigin = window.location.origin;
							entry = entries.find((candidate) => {
								try { return new URL(candidate?.url || '').origin === currentOrigin; } catch (_) { return false; }
							}) || null;
						}
					} catch (_) { /* corrupt storage */ }

					// Neutral is the operator's per-server opt-in and always wins:
					// it governs HOW identity is rendered locally, not what it is.
					const neutral = entry?.useNeutralBranding === true;
					if (neutral) {
						document.documentElement.setAttribute('data-neutral-branding', '');
					}

					if (injected) {
						// Server is the source of truth for its own identity —
						// zero requests, correct at first paint, no Wabi→custom swap.
						window.__WABI_BOOT_BRAND__ = {
							neutral,
							brandName: typeof injected.brandName === 'string' ? injected.brandName : '',
							logoUrl: typeof injected.logoUrl === 'string' ? injected.logoUrl : '',
							accent: typeof injected.accent === 'string' ? injected.accent : '',
							launchEnabled: injected.launchEnabled === true
						};
						return;
					}

					if (entry && typeof entry === 'object') {
						const launch = entry.launchPageBranding || null;
						const meta = entry.frontendMetadata || null;

						const brandName =
							(launch && typeof launch.brandName === 'string' && launch.brandName.trim()) ||
							(meta && typeof meta.brandName === 'string' && meta.brandName.trim()) ||
							(meta && typeof meta.name === 'string' && meta.name.trim()) ||
							'';
						const logoUrl =
							(launch && typeof launch.logoUrl === 'string' && launch.logoUrl.trim()) ||
							(meta && typeof meta.logoUrl === 'string' && meta.logoUrl.trim()) ||
							'';
						const accent =
							(launch && launch.palette && typeof launch.palette.accent === 'string' && launch.palette.accent) ||
							(meta && typeof meta.accentColor === 'string' && meta.accentColor) ||
							'';

						window.__WABI_BOOT_BRAND__ = {
							neutral,
							brandName,
							logoUrl,
							accent
						};
						return;
					}

					// No injection AND no saved entry → legacy fetch fallback
					// (raw-file hosts). Unchanged from before.
					fetch('/api/public/launch-page', { credentials: 'omit' })
						.then((response) => response.ok ? response.json() : null)
						.then((launch) => {
							if (!launch || typeof launch !== 'object') return;
							const brandName = typeof launch.brandName === 'string' ? launch.brandName.trim() : '';
							const logoUrl = typeof launch.logoUrl === 'string' ? launch.logoUrl.trim() : '';
							const accent = typeof launch.palette?.accent === 'string' ? launch.palette.accent : '';
							if (!brandName && !logoUrl && !accent) return;
							const snapshot = { brandName, logoUrl, accent, force: true };
							window.__WABI_BOOT_BRAND__ = snapshot;
							try {
								const current = JSON.parse(localStorage.getItem('wabi.savedServers.v1') || '{}');
								const entries = Array.isArray(current.entries) ? current.entries : [];
								const index = entries.findIndex((candidate) => {
									try { return new URL(candidate?.url || '').origin === window.location.origin; } catch (_) { return false; }
								});
								if (index >= 0) {
									entries[index].launchPageBranding = {
										brandName: launch.brandName || '', logoUrl: launch.logoUrl || '',
										heroImageUrl: launch.heroImageUrl || null, subheadline: launch.subheadline || '',
										palette: launch.palette || { accent: accent }, brandProfile: launch.brandProfile || null
									};
									localStorage.setItem('wabi.savedServers.v1', JSON.stringify({ ...current, entries }));
								}
							} catch (_) { /* cache is best effort */ }
							if (typeof window.__applyWabiBootBrand === 'function') window.__applyWabiBootBrand(snapshot);
						})
						.catch(() => { /* fallback shell remains available */ });

					// Defer DOM writes until shell exists (body not parsed yet if in head —
					// this script is in head; shell is in body. Use DOMContentLoaded or
					// put apply after body. We'll re-run after shell mounts via inline after shell.)
				} catch (_) {
					/* ignore corrupt storage */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div id="wabi-boot-shell" role="status" aria-live="polite" data-boot-brand="pending" data-boot-state="default" style="--boot-accent: #d6ad5f">
			<div class="wabi-boot-shell__center">
				<div class="wabi-boot-shell__stage" aria-hidden="true">
					<span class="wabi-boot-shell__orbit"></span>
					<svg class="wabi-boot-shell__glyph" viewBox="0 0 64 64" fill="none">
						<path d="M46.5 18.2A21 21 0 1 0 52 33.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" opacity="0.92"/>
						<path d="M44 15.6c3.1 1.6 5.6 4 7.3 6.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
					</svg>
					<img id="wabi-boot-logo" alt="" class="wabi-boot-shell__logo" decoding="async" />
				</div>
				<div class="wabi-boot-shell__body">
					<div id="wabi-boot-title" class="wabi-boot-shell__title" data-empty="false">Wabi</div>
					<p class="wabi-boot-shell__status" id="wabi-boot-status">Opening the shell</p>
					<div class="wabi-boot-shell__rail" aria-hidden="true"><span id="wabi-boot-fill"></span></div>
					<ol class="wabi-boot-shell__steps" id="wabi-boot-steps" aria-hidden="true">
						<li data-step="0"><span class="dot"></span>Shell</li>
						<li data-step="1"><span class="dot"></span>Session</li>
						<li data-step="2"><span class="dot"></span>Workspace</li>
						<li data-step="3"><span class="dot"></span>Realtime</li>
					</ol>
					<div class="wabi-boot-shell__recover">
						<button id="wabi-boot-retry" class="wabi-boot-shell__btn wabi-boot-shell__btn--primary" type="button">Try again</button>
						<button id="wabi-work-offline" class="wabi-boot-shell__btn" type="button">Work Offline</button>
					</div>
				</div>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(() => {
				const getShell = () => document.getElementById('wabi-boot-shell');

				// --- Real boot gates: shell → session → workspace → realtime ---
				// The rail is driven by these, never by a timer. A fast boot flies
				// through them; a slow one shows the gate that is actually late.
				const GATE_STATUS = [
					'Opening the shell',
					'Checking your session',
					'Loading the workspace',
					'Connecting realtime'
				];
				const GATE_PCT = [18, 42, 70, 92];
				let activeGate = 1; // shell is done the instant this script runs
				let stallTimer = 0;
				let stepsRevealed = false;
				// shell(0) is done immediately; the rest complete in any order the
				// network delivers them (the socket can beat the chunk download).
				let gateDone = [true, false, false, false];
				let gatesComplete = false;

				const getSteps = () => document.getElementById('wabi-boot-steps');
				const getStatus = () => document.getElementById('wabi-boot-status');
				const getFill = () => document.getElementById('wabi-boot-fill');

				const paintGate = (index) => {
					const shell = getShell();
					if (!shell || shell.classList.contains('is-hidden')) return;
					activeGate = index;
					const steps = getSteps();
					if (steps) {
						[...steps.children].forEach((li, n) => {
							li.classList.toggle('done', n < index);
							li.classList.toggle('active', n === index);
						});
					}
					const status = getStatus();
					if (status) status.textContent = GATE_STATUS[Math.min(index, GATE_STATUS.length - 1)];
					const fill = getFill();
					if (fill) fill.style.width = GATE_PCT[Math.min(index, GATE_PCT.length - 1)] + '%';
				};

				const completeGates = () => {
					const shell = getShell();
					if (!shell || shell.classList.contains('is-hidden')) return;
					gatesComplete = true;
					const steps = getSteps();
					if (steps) {
						[...steps.children].forEach((li) => {
							li.classList.add('done');
							li.classList.remove('active');
						});
					}
					const status = getStatus();
					if (status) status.textContent = 'Ready';
					const fill = getFill();
					if (fill) fill.style.width = '100%';
				};

				// Advance the rail to the lowest gate not yet done, so an
				// out-of-order completion never jumps backwards.
				const recomputeGate = () => {
					if (gatesComplete) return;
					let idx = 1;
					while (idx <= 3 && gateDone[idx]) idx++;
					if (idx > 3) {
						completeGates();
						return;
					}
					paintGate(idx);
				};

				const clearStall = () => {
					if (stallTimer) {
						window.clearTimeout(stallTimer);
						stallTimer = 0;
					}
				};

				// A stall keeps the mark, freezes the rail and offers a way out —
				// it never replaces the shell with a failure card.
				const enterStall = () => {
					const shell = getShell();
					if (!shell || shell.classList.contains('is-hidden')) return;
					if (shell.dataset.bootState === 'reconnect') return;
					shell.dataset.bootState = 'stalled';
					const status = getStatus();
					if (status) {
						status.textContent =
							activeGate >= 3
								? "The server didn't answer. Your session may still be valid."
								: GATE_STATUS[activeGate] + ' is taking longer than expected.';
					}
				};

				const armStall = () => {
					clearStall();
					stallTimer = window.setTimeout(enterStall, 4000);
				};

				const revealStepsSoon = () => {
					if (stepsRevealed) return;
					stepsRevealed = true;
					getSteps()?.classList.add('is-visible');
				};

				const hideBootShell = () => {
					const shell = getShell();
					if (!shell || shell.classList.contains('is-hidden')) return;
					clearStall();
					shell.classList.add('is-hidden');
					window.setTimeout(() => shell.remove(), 300);
				};

				const enterReconnectMode = () => {
					const shell = getShell();
					if (!shell) return;
					clearStall();
					shell.dataset.bootState = 'reconnect';
					// Keep the mark and freeze the rail at the gate that failed.
					paintGate(1);
					const status = getStatus();
					if (status) status.textContent = 'Unable to reach the server. Your session may still be valid.';
				};

				/**
				 * Apply brand once and lock. Later calls that try to flip
				 * custom/neutral → default Wabi are ignored (stops mount flicker).
				 * Pass { force: true } to intentionally rebrand.
				 */
				const applyBootBrand = (snapshot) => {
					const shell = getShell();
					if (!shell) return;
					const logo = document.getElementById('wabi-boot-logo');
					const title = document.getElementById('wabi-boot-title');
					const raw = snapshot || window.__WABI_BOOT_BRAND__ || {};
					const force = raw && raw.force === true;
					const snap = {
						neutral: raw.neutral === true,
						brandName: typeof raw.brandName === 'string' ? raw.brandName.trim() : '',
						logoUrl: typeof raw.logoUrl === 'string' ? raw.logoUrl.trim() : '',
						accent: typeof raw.accent === 'string' ? raw.accent.trim() : ''
					};

					const locked = shell.dataset.bootLocked === '1';
					const current = shell.dataset.bootBrand || 'pending';
					const next =
						snap.neutral ? 'neutral' : (snap.brandName || snap.logoUrl) ? 'custom' : 'wabi';

					// Don't let late app boot overwrite a committed custom/neutral brand
					// with the default Wabi config (classic flicker path).
					if (locked && !force) {
						if ((current === 'custom' || current === 'neutral') && next === 'wabi') {
							return;
						}
						// Same brand family — ignore no-op churn
						if (current === next && current !== 'pending') {
							shell.dataset.bootReady = '1';
							return;
						}
					}

					const defaultWabiLogo = /(?:^|\/)(?:wabi-logo(?:-small|-boot)?\.webp|icon\.png)(?:\?|$)/i.test(snap.logoUrl || '');
					const customHost =
						!snap.neutral &&
						((snap.brandName && snap.brandName !== 'Wabi') || (snap.logoUrl && !defaultWabiLogo));

					if (snap.neutral) {
						shell.dataset.bootBrand = 'neutral';
						shell.style.setProperty('--boot-accent', snap.accent || '#a1a1aa');
						document.documentElement.setAttribute('data-neutral-branding', '');
						if (title) {
							title.textContent = '';
							title.dataset.empty = 'true';
						}
						if (logo) {
							logo.removeAttribute('src');
							logo.alt = '';
						}
					} else if (customHost) {
						shell.dataset.bootBrand = 'custom';
						document.documentElement.removeAttribute('data-neutral-branding');
						if (title) {
							title.textContent = snap.brandName || '';
							title.dataset.empty = snap.brandName ? 'false' : 'true';
						}
						if (logo && snap.logoUrl) {
							// Only assign src if changed — avoids reload flicker
							if (logo.getAttribute('src') !== snap.logoUrl) {
								logo.src = snap.logoUrl;
							}
							logo.alt = snap.brandName || '';
						}
						if (snap.accent) shell.style.setProperty('--boot-accent', snap.accent);
					} else {
						shell.dataset.bootBrand = 'wabi';
						document.documentElement.removeAttribute('data-neutral-branding');
						if (title) {
							title.textContent = 'Wabi';
							title.dataset.empty = 'false';
						}
						// Default brand paints the inline glyph — it never waits on
						// wabi-logo-boot.webp or an invert filter.
						if (logo) {
							logo.removeAttribute('src');
							logo.alt = '';
						}
						if (snap.accent) shell.style.setProperty('--boot-accent', snap.accent);
						else shell.style.setProperty("--boot-accent", "#d6ad5f");
					}

					window.__WABI_BOOT_BRAND__ = {
						neutral: shell.dataset.bootBrand === 'neutral',
						brandName: snap.brandName || (shell.dataset.bootBrand === 'wabi' ? 'Wabi' : ''),
						logoUrl: (logo && logo.getAttribute('src')) || snap.logoUrl || '',
						accent: shell.style.getPropertyValue('--boot-accent').trim()
					};
					shell.dataset.bootLocked = '1';
					// Reveal on next frame so src swap isn't painted mid-change
					requestAnimationFrame(() => {
						shell.dataset.bootReady = '1';
					});
				};

				// Expose for app-side rebrand (injectNeutralBranding / applyBranding)
				window.__hideWabiBootShell = hideBootShell;
				window.__enterReconnectMode = enterReconnectMode;
				window.__applyWabiBootBrand = applyBootBrand;

				// Apply any brand captured from localStorage in <head>
				applyBootBrand(window.__WABI_BOOT_BRAND__);

				window.addEventListener('wabi:boot-hide', hideBootShell, { once: true });
				window.addEventListener('wabi:boot-reconnect', enterReconnectMode, { once: true });
				window.addEventListener('wabi:boot-brand', (event) => {
					applyBootBrand(event && event.detail ? event.detail : null);
				});

				// The app reports real gate completions; the rail follows them.
				// Reconnect is its own terminal state — gates don't move it.
				window.addEventListener('wabi:boot-gate', (event) => {
					const shell = getShell();
					if (!shell || shell.classList.contains('is-hidden')) return;
					if (shell.dataset.bootState === 'reconnect') return;
					if (gatesComplete) return;
					const gate = event && event.detail ? event.detail.gate : '';
					const gi = gate === 'session' ? 1 : gate === 'workspace' ? 2 : gate === 'realtime' ? 3 : -1;
					if (gi === -1 || gateDone[gi]) return;
					gateDone[gi] = true;
					clearStall();
					if (shell.dataset.bootState === 'stalled') shell.dataset.bootState = 'default';
					recomputeGate();
				});

				document.getElementById('wabi-work-offline')?.addEventListener('click', () => {
					window.__hideWabiBootShell();
					window.dispatchEvent(new CustomEvent('wabi:work-offline'));
				});

				// Try again: let the app re-attempt the connection if it is listening,
				// and clear the stall so the rail resumes if the socket recovers.
				document.getElementById('wabi-boot-retry')?.addEventListener('click', () => {
					const shell = getShell();
					if (shell && shell.dataset.bootState === 'stalled') shell.dataset.bootState = 'default';
					armStall();
					window.dispatchEvent(new CustomEvent('wabi:boot-retry'));
				});

				// First real paint: shell gate already done, session active. Reveal the
				// step list only after a beat so a fast boot never sees the sequence.
				paintGate(1);
				armStall();
				window.setTimeout(revealStepsSoon, 500);
			})();
		</script>
	</body>
</html>
