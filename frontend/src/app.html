<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" data-wabi-favicon />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#101315" data-wabi-theme-color />
		<meta name="description" content="Open-source, self-hosted communication and collaboration for small communities, with chat, calls, shared workspaces, and creative review." />
		<title data-wabi-brand-title>Wabi</title>
		<script>
			// Early shell flag so first paint can skip desktop chrome on phones / PWA.
			(() => {
				try {
					const compact = window.matchMedia('(max-width: 768px)').matches;
					const standalone =
						window.matchMedia('(display-mode: standalone)').matches ||
						(typeof navigator.standalone === 'boolean' && navigator.standalone === true);
					document.documentElement.dataset.shell = compact ? 'mobile' : 'desktop';
					document.documentElement.dataset.displayMode = standalone ? 'standalone' : 'browser';
					if (compact) document.documentElement.classList.add('is-mobile-shell');
					if (standalone) document.documentElement.classList.add('is-pwa-standalone');
					try {
						// A saved Daylight theme boots on Daylight paper (and browser chrome) instead of Wabi Ink.
						// The browser chrome follows only while it still holds the Wabi Ink default: an operator
						// accent stamped in by the server keeps winning.
						const saved = JSON.parse(localStorage.getItem('wabi-theme') || 'null');
						if (saved && /^(light|paper-dawn|professional)$/.test(saved.theme_id || '')) {
							document.documentElement.dataset.bootMode = 'light';
							const chrome = document.querySelector('meta[data-wabi-theme-color]');
							if (chrome && chrome.getAttribute('content') === '#101315') chrome.setAttribute('content', '#faf9f6');
						}
					} catch (_) {}
				} catch (_) {}
			})();
		</script>
		<style>
			/* Boot shell: Wabi Ink until the app's roles load (docs/design/DESIGN_CONTRACT.md).
			   The app's role tokens do not exist yet, so the --boot-* names below mirror the
			   resolved roles of Wabi Ink (--w-bg #101315 ...) and of Daylight for a saved light theme.
			   Operator branding still wins: the server or a saved server injects --boot-accent and the logo. */
			:root {
				--boot-ink: #101315;
				--boot-raise: #1b2125;
				--boot-text: #e8e7e0;
				--boot-mute: #9aa39d;
				--boot-faint: #818983;
				--boot-line: color-mix(in srgb, var(--boot-text) 11%, transparent);
				--boot-line-strong: #6a6b6a;
				--boot-sig: #d6ad5f;
				--boot-sans: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				--boot-serif: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif;
				--boot-ease: cubic-bezier(0.2, 0, 0, 1);
			}

			html[data-boot-mode='light'] {
				--boot-ink: #faf9f6;
				--boot-raise: #f2efe8;
				--boot-text: #1c1917;
				--boot-mute: #57534e;
				--boot-faint: #6e6966;
				--boot-line-strong: #84827f;
				--boot-sig: #ac500a;
			}

			html,
			body {
				min-height: 100%;
				margin: 0;
				background: var(--boot-ink);
			}

			#wabi-boot-shell {
				/* The mark color: the brand's sig unless the operator brand set its own accent inline. */
				--boot-accent: var(--boot-sig);
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: flex;
				justify-content: center;
				overflow: hidden;
				background: var(--boot-ink);
				transition:
					opacity 240ms var(--boot-ease),
					visibility 240ms var(--boot-ease);
			}

			#wabi-boot-shell.is-hidden {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}

			/* The mark and the name hold the optical center (row 2). Status, rail, steps and the
			   recover row hang below them (row 3), so a longer status line or the recover row
			   appearing never moves the mark (contract §2.7: nothing moves under the pointer).
			   Only a viewport too short for the hanging rows lifts the mark to keep them visible. */
			.wabi-boot-shell__center {
				display: grid;
				grid-template-rows: minmax(0, 1fr) auto minmax(min-content, 1.25fr);
				justify-items: center;
				box-sizing: border-box;
				width: min(420px, 100%);
				padding: 32px 16px;
				text-align: center;
				color: var(--boot-text);
				font-family: var(--boot-sans);
			}

			.wabi-boot-shell__head {
				grid-row: 2;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 20px;
			}

			.wabi-boot-shell__body {
				grid-row: 3;
				align-self: start;
				width: 100%;
			}

			/* --- Stage: one mark at a time, chosen by data-boot-mark (see the script at the end):
			   glyph  default brand, painted at once while the real ensō decodes;
			   enso   default brand: the real ensō (contract §6: wabi-logo-small.webp as a mask in the sig color);
			   logo   an operator logo, only once it has loaded, so no other mark ever shows through it;
			   mono   a custom brand without a usable logo: the initial of its name, as in the server rail;
			   plain  neutral branding, or a custom brand with neither a name nor a usable logo:
			          the neutral chat mark (same shape as NEUTRAL_LOGO_DATA_URI in lib/branding.ts).
			   A custom logo gets 400ms to arrive before its stand-in shows, so a fast logo never flashes one. --- */
			.wabi-boot-shell__stage {
				display: grid;
				place-items: center;
				width: 72px;
				height: 72px;
			}

			.wabi-boot-shell__mark {
				grid-area: 1 / 1;
				opacity: 0;
				visibility: hidden;
				transition:
					opacity 240ms var(--boot-ease),
					visibility 240ms var(--boot-ease);
			}

			#wabi-boot-shell[data-boot-mark='glyph'] .wabi-boot-shell__glyph,
			#wabi-boot-shell[data-boot-mark='enso'] .wabi-boot-shell__enso,
			#wabi-boot-shell[data-boot-mark='logo'][data-boot-ready='1'] .wabi-boot-shell__logo,
			#wabi-boot-shell[data-boot-mark='mono'] .wabi-boot-shell__mono,
			#wabi-boot-shell[data-boot-mark='plain'] .wabi-boot-shell__plain {
				opacity: 1;
				visibility: visible;
			}

			.wabi-boot-shell__glyph {
				width: 60px;
				height: 60px;
				color: var(--boot-accent);
			}

			.wabi-boot-shell__enso {
				width: 60px;
				height: 60px;
				background: var(--boot-accent);
			}
			/* The mask is requested only for the default brand, never by a custom or neutral host. */
			#wabi-boot-shell[data-boot-brand='wabi'] .wabi-boot-shell__enso {
				-webkit-mask: url('/wabi-logo-small.webp') center / contain no-repeat;
				mask: url('/wabi-logo-small.webp') center / contain no-repeat;
			}

			.wabi-boot-shell__logo {
				width: 64px;
				height: 64px;
				object-fit: contain;
			}

			.wabi-boot-shell__mono {
				font-family: var(--boot-serif);
				font-size: 44px;
				font-weight: 600;
				line-height: 1;
				color: var(--boot-accent);
			}

			.wabi-boot-shell__plain {
				width: 56px;
				height: 56px;
				color: var(--boot-accent);
			}
			.wabi-boot-shell__plain path {
				fill: var(--boot-ink);
			}

			/* --- Wordmark + status line --- */
			.wabi-boot-shell__title {
				margin: 0;
				font-family: var(--boot-serif);
				font-size: 32px;
				font-weight: 600;
				line-height: 40px;
				letter-spacing: 0.005em;
				color: var(--boot-text);
			}

			/* No product name for strip-Wabi or an empty brand. */
			.wabi-boot-shell__title[data-empty='true'] {
				display: none;
			}

			.wabi-boot-shell__status {
				margin: 4px 0 0;
				min-height: 18px;
				color: var(--boot-mute);
				font-size: 13px;
				line-height: 18px;
				text-wrap: pretty;
			}

			/* --- Progress rail: driven by real gates, not a timer. It is the only progress
			   indicator; nothing in the boot shell loops (contract §4.7). --- */
			.wabi-boot-shell__rail {
				position: relative;
				width: min(280px, 78%);
				height: 2px;
				margin: 14px auto 0;
				border-radius: 2px;
				background: var(--boot-line);
				overflow: hidden;
			}

			.wabi-boot-shell__rail > span {
				display: block;
				height: 100%;
				width: 0%;
				border-radius: inherit;
				background: var(--boot-accent);
				transition: width 480ms var(--boot-ease);
			}

			/* --- Step list: appears only after a beat, so a fast boot never sees it --- */
			.wabi-boot-shell__steps {
				list-style: none;
				padding: 0;
				margin: 20px auto 0;
				width: min(200px, 100%);
				display: grid;
				gap: 8px;
				opacity: 0;
				visibility: hidden;
				transition: opacity 240ms var(--boot-ease);
			}

			.wabi-boot-shell__steps.is-visible {
				opacity: 1;
				visibility: visible;
			}

			.wabi-boot-shell__steps li {
				display: flex;
				align-items: center;
				gap: 10px;
				font-size: 13px;
				line-height: 18px;
				color: var(--boot-faint);
				text-align: left;
			}

			.wabi-boot-shell__steps li .dot {
				width: 16px;
				height: 16px;
				box-sizing: border-box;
				border-radius: 999px;
				border: 1px solid var(--boot-line);
				display: grid;
				place-items: center;
				flex: none;
			}

			.wabi-boot-shell__steps li.active {
				color: var(--boot-text);
				font-weight: 500;
			}
			.wabi-boot-shell__steps li.active .dot {
				border-color: var(--boot-accent);
			}
			.wabi-boot-shell__steps li.active .dot::after {
				content: '';
				width: 6px;
				height: 6px;
				border-radius: 999px;
				background: var(--boot-accent);
			}

			.wabi-boot-shell__steps li.done {
				color: var(--boot-mute);
			}
			.wabi-boot-shell__steps li.done .dot {
				border-color: transparent;
				background: color-mix(in srgb, var(--boot-accent) 18%, transparent);
			}
			.wabi-boot-shell__steps li.done .dot::after {
				content: '';
				width: 7px;
				height: 4px;
				border-left: 1.5px solid var(--boot-accent);
				border-bottom: 1.5px solid var(--boot-accent);
				transform: rotate(-45deg) translate(0, -1px);
			}

			/* --- Recover: Try again + Work offline, last in the hanging rows. --- */
			.wabi-boot-shell__recover {
				display: none;
				justify-content: center;
				gap: 8px;
				margin-top: 20px;
			}

			[data-boot-state='reconnect'] .wabi-boot-shell__recover,
			[data-boot-state='stalled'] .wabi-boot-shell__recover {
				display: flex;
			}

			/* Default button: hairline edge, fills on hover. Primary: ink on paper (text fill, page label). */
			.wabi-boot-shell__btn {
				height: 32px;
				padding: 0 12px;
				border-radius: 6px;
				border: 1px solid var(--boot-line-strong);
				background: transparent;
				color: var(--boot-text);
				font: 500 14px/20px var(--boot-sans);
				white-space: nowrap;
				cursor: pointer;
				transition:
					background-color 120ms var(--boot-ease),
					border-color 120ms var(--boot-ease);
			}
			.wabi-boot-shell__btn:hover {
				background: var(--boot-raise);
			}
			.wabi-boot-shell__btn:focus-visible {
				outline: 2px solid var(--boot-accent);
				outline-offset: 2px;
			}
			.wabi-boot-shell__btn--primary {
				border-color: var(--boot-text);
				background: var(--boot-text);
				color: var(--boot-ink);
			}
			.wabi-boot-shell__btn--primary:hover {
				background: color-mix(in srgb, var(--boot-text) 86%, var(--boot-ink));
			}
			@media (pointer: coarse) {
				.wabi-boot-shell__btn {
					height: 44px;
					padding: 0 16px;
				}
			}

			/* --- Stall and reconnect: the rail freezes (and goes quiet on a stall); the mark is kept --- */
			[data-boot-state='stalled'] .wabi-boot-shell__rail > span {
				background: var(--boot-mute);
				transition: none;
			}
			[data-boot-state='reconnect'] .wabi-boot-shell__rail > span {
				transition: none;
			}

			/* Neutral palette on boot (early data-neutral-branding or data-boot-brand): no Wabi gold. */
			html[data-neutral-branding] #wabi-boot-shell,
			#wabi-boot-shell[data-boot-brand='neutral'] {
				--boot-accent: #a1a1aa;
			}

			/* Neutral never shows the Wabi wordmark. The head script sets html[data-neutral-branding]
			   before the body parses, so this holds from the very first paint; no mark shows until
			   the brand is applied, and then neutral gets the plain mark. */
			html[data-neutral-branding] .wabi-boot-shell__title {
				display: none;
			}

			/* A short viewport (a phone on its side) keeps the mark, name, status, rail and recover row. */
			@media (max-height: 520px) {
				.wabi-boot-shell__center {
					padding: 16px;
				}
				.wabi-boot-shell__head {
					gap: 12px;
				}
				.wabi-boot-shell__steps {
					display: none;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				#wabi-boot-shell,
				.wabi-boot-shell__mark,
				.wabi-boot-shell__rail > span,
				.wabi-boot-shell__steps,
				.wabi-boot-shell__btn {
					transition: none;
				}
			}
		</style>
		<script>
			// Server-stamped brand (Phase 1 boot optimization): wabi-server
			// replaces the token below with its identity JSON at request time.
			// When un-replaced (raw file host / Tauri / dev-vite) it stays null
			// and the legacy saved-server/fetch logic below takes over.
			window.__WABI_SERVER_BRAND__ = /*__WABI_SERVER_BRAND__*/null;

			// Apply saved-server brand BEFORE first paint so boot isn't stuck on "Wabi".
			(() => {
				try {
					if (window.location.pathname.replace(/\/$/, '') === '/personal') {
						window.__WABI_BOOT_BRAND__ = { brandName: 'Wabi', logoUrl: '/wabi-logo.png', accent: '' };
						return;
					}
					const injected =
						window.__WABI_SERVER_BRAND__ && typeof window.__WABI_SERVER_BRAND__ === 'object'
							? window.__WABI_SERVER_BRAND__
							: null;

					// Resolve this origin's saved-server entry (may be null).
					let entry = null;
					try {
						const raw = localStorage.getItem('wabi.savedServers.v1');
						if (raw) {
							const parsed = JSON.parse(raw);
							const entries = Array.isArray(parsed?.entries) ? parsed.entries : [];
							const currentOrigin = window.location.origin;
							entry = entries.find((candidate) => {
								try { return new URL(candidate?.url || '').origin === currentOrigin; } catch (_) { return false; }
							}) || null;
						}
					} catch (_) { /* corrupt storage */ }

					// Neutral is the operator's per-server opt-in and always wins:
					// it governs HOW identity is rendered locally, not what it is.
					const neutral = entry?.useNeutralBranding === true;
					if (neutral) {
						document.documentElement.setAttribute('data-neutral-branding', '');
					}

					if (injected) {
						// Server is the source of truth for its own identity —
						// zero requests, correct at first paint, no Wabi→custom swap.
						window.__WABI_BOOT_BRAND__ = {
							neutral,
							brandName: typeof injected.brandName === 'string' ? injected.brandName : '',
							logoUrl: typeof injected.logoUrl === 'string' ? injected.logoUrl : '',
							accent: typeof injected.accent === 'string' ? injected.accent : '',
							launchEnabled: injected.launchEnabled === true
						};
						return;
					}

					if (entry && typeof entry === 'object') {
						const launch = entry.launchPageBranding || null;
						const meta = entry.frontendMetadata || null;

						const brandName =
							(launch && typeof launch.brandName === 'string' && launch.brandName.trim()) ||
							(meta && typeof meta.brandName === 'string' && meta.brandName.trim()) ||
							(meta && typeof meta.name === 'string' && meta.name.trim()) ||
							'';
						const logoUrl =
							(launch && typeof launch.logoUrl === 'string' && launch.logoUrl.trim()) ||
							(meta && typeof meta.logoUrl === 'string' && meta.logoUrl.trim()) ||
							'';
						const accent =
							(launch && launch.palette && typeof launch.palette.accent === 'string' && launch.palette.accent) ||
							(meta && typeof meta.accentColor === 'string' && meta.accentColor) ||
							'';

						window.__WABI_BOOT_BRAND__ = {
							neutral,
							brandName,
							logoUrl,
							accent
						};
						return;
					}

					// No injection AND no saved entry → legacy fetch fallback
					// (raw-file hosts). Unchanged from before.
					fetch('/api/public/launch-page', { credentials: 'omit' })
						.then((response) => response.ok ? response.json() : null)
						.then((launch) => {
							if (!launch || typeof launch !== 'object') return;
							const brandName = typeof launch.brandName === 'string' ? launch.brandName.trim() : '';
							const logoUrl = typeof launch.logoUrl === 'string' ? launch.logoUrl.trim() : '';
							const accent = typeof launch.palette?.accent === 'string' ? launch.palette.accent : '';
							if (!brandName && !logoUrl && !accent) return;
							const snapshot = { brandName, logoUrl, accent, force: true };
							window.__WABI_BOOT_BRAND__ = snapshot;
							try {
								const current = JSON.parse(localStorage.getItem('wabi.savedServers.v1') || '{}');
								const entries = Array.isArray(current.entries) ? current.entries : [];
								const index = entries.findIndex((candidate) => {
									try { return new URL(candidate?.url || '').origin === window.location.origin; } catch (_) { return false; }
								});
								if (index >= 0) {
									entries[index].launchPageBranding = {
										brandName: launch.brandName || '', logoUrl: launch.logoUrl || '',
										heroImageUrl: launch.heroImageUrl || null, subheadline: launch.subheadline || '',
										palette: launch.palette || { accent: accent }, brandProfile: launch.brandProfile || null
									};
									localStorage.setItem('wabi.savedServers.v1', JSON.stringify({ ...current, entries }));
								}
							} catch (_) { /* cache is best effort */ }
							if (typeof window.__applyWabiBootBrand === 'function') window.__applyWabiBootBrand(snapshot);
						})
						.catch(() => { /* fallback shell remains available */ });

					// Defer DOM writes until shell exists (body not parsed yet if in head —
					// this script is in head; shell is in body. Use DOMContentLoaded or
					// put apply after body. We'll re-run after shell mounts via inline after shell.)
				} catch (_) {
					/* ignore corrupt storage */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div id="wabi-boot-shell" role="status" aria-live="polite" data-boot-brand="pending" data-boot-state="default">
			<div class="wabi-boot-shell__center">
				<div class="wabi-boot-shell__head">
					<div class="wabi-boot-shell__stage" aria-hidden="true">
						<svg class="wabi-boot-shell__mark wabi-boot-shell__glyph" viewBox="0 0 64 64" fill="none">
							<path d="M46.5 18.2A21 21 0 1 0 52 33.5" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" opacity="0.92"/>
							<path d="M44 15.6c3.1 1.6 5.6 4 7.3 6.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
						</svg>
						<span class="wabi-boot-shell__mark wabi-boot-shell__enso"></span>
						<span id="wabi-boot-mono" class="wabi-boot-shell__mark wabi-boot-shell__mono"></span>
						<svg class="wabi-boot-shell__mark wabi-boot-shell__plain" viewBox="0 0 96 96">
							<rect width="96" height="96" rx="22" fill="currentColor"/>
							<path d="M24 34a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v18a8 8 0 0 1-8 8H45l-13 11v-11h-8a8 8 0 0 1-8-8z"/>
						</svg>
						<img id="wabi-boot-logo" alt="" class="wabi-boot-shell__mark wabi-boot-shell__logo" decoding="async" />
					</div>
					<div id="wabi-boot-title" class="wabi-boot-shell__title" data-empty="false">Wabi</div>
				</div>
				<div class="wabi-boot-shell__body">
					<p class="wabi-boot-shell__status" id="wabi-boot-status">Opening the shell</p>
					<div class="wabi-boot-shell__rail" aria-hidden="true"><span id="wabi-boot-fill"></span></div>
					<ol class="wabi-boot-shell__steps" id="wabi-boot-steps" aria-hidden="true">
						<li data-step="0"><span class="dot"></span>Shell</li>
						<li data-step="1"><span class="dot"></span>Session</li>
						<li data-step="2"><span class="dot"></span>Workspace</li>
						<li data-step="3"><span class="dot"></span>Realtime</li>
					</ol>
					<div class="wabi-boot-shell__recover">
						<button id="wabi-boot-retry" class="wabi-boot-shell__btn wabi-boot-shell__btn--primary" type="button">Try again</button>
						<button id="wabi-work-offline" class="wabi-boot-shell__btn" type="button">Work offline</button>
					</div>
				</div>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(() => {
				const getShell = () => document.getElementById('wabi-boot-shell');

				// --- Real boot gates: shell → session → workspace → realtime ---
				// The rail is driven by these, never by a timer. A fast boot flies
				// through them; a slow one shows the gate that is actually late.
				const GATE_STATUS = [
					'Opening the shell',
					'Checking your session',
					'Loading the workspace',
					'Connecting realtime'
				];
				const GATE_PCT = [18, 42, 70, 92];
				let activeGate = 1; // shell is done the instant this script runs
				let stallTimer = 0;
				let stepsRevealed = false;
				// shell(0) is done immediately; the rest complete in any order the
				// network delivers them (the socket can beat the chunk download).
				let gateDone = [true, false, false, false];
				let gatesComplete = false;

				const getSteps = () => document.getElementById('wabi-boot-steps');
				const getStatus = () => document.getElementById('wabi-boot-status');
				const getFill = () => document.getElementById('wabi-boot-fill');

				const paintGate = (index) => {
					const shell = getShell();
					if (!shell || shell.classList.contains('is-hidden')) return;
					activeGate = index;
					const steps = getSteps();
					if (steps) {
						[...steps.children].forEach((li, n) => {
							li.classList.toggle('done', n < index);
							li.classList.toggle('active', n === index);
						});
					}
					const status = getStatus();
					if (status) status.textContent = GATE_STATUS[Math.min(index, GATE_STATUS.length - 1)];
					const fill = getFill();
					if (fill) fill.style.width = GATE_PCT[Math.min(index, GATE_PCT.length - 1)] + '%';
				};

				const completeGates = () => {
					const shell = getShell();
					if (!shell || shell.classList.contains('is-hidden')) return;
					gatesComplete = true;
					const steps = getSteps();
					if (steps) {
						[...steps.children].forEach((li) => {
							li.classList.add('done');
							li.classList.remove('active');
						});
					}
					const status = getStatus();
					if (status) status.textContent = 'Ready';
					const fill = getFill();
					if (fill) fill.style.width = '100%';
				};

				// Advance the rail to the lowest gate not yet done, so an
				// out-of-order completion never jumps backwards.
				const recomputeGate = () => {
					if (gatesComplete) return;
					let idx = 1;
					while (idx <= 3 && gateDone[idx]) idx++;
					if (idx > 3) {
						completeGates();
						return;
					}
					paintGate(idx);
				};

				const clearStall = () => {
					if (stallTimer) {
						window.clearTimeout(stallTimer);
						stallTimer = 0;
					}
				};

				// A stall keeps the mark, freezes the rail and offers a way out —
				// it never replaces the shell with a failure card.
				const enterStall = () => {
					const shell = getShell();
					if (!shell || shell.classList.contains('is-hidden')) return;
					if (shell.dataset.bootState === 'reconnect') return;
					shell.dataset.bootState = 'stalled';
					const status = getStatus();
					if (status) {
						status.textContent =
							activeGate >= 3
								? "The server didn't answer. Your session may still be valid."
								: GATE_STATUS[activeGate] + ' is taking longer than expected.';
					}
				};

				const armStall = () => {
					clearStall();
					stallTimer = window.setTimeout(enterStall, 4000);
				};

				const revealStepsSoon = () => {
					if (stepsRevealed) return;
					stepsRevealed = true;
					getSteps()?.classList.add('is-visible');
				};

				const hideBootShell = () => {
					const shell = getShell();
					if (!shell || shell.classList.contains('is-hidden')) return;
					clearStall();
					shell.classList.add('is-hidden');
					window.setTimeout(() => shell.remove(), 300);
				};

				const enterReconnectMode = () => {
					const shell = getShell();
					if (!shell) return;
					clearStall();
					shell.dataset.bootState = 'reconnect';
					// Keep the mark and freeze the rail at the gate that failed.
					paintGate(1);
					const status = getStatus();
					if (status) status.textContent = 'Unable to reach the server. Your session may still be valid.';
				};

				// --- The mark: exactly one of glyph / enso / logo / mono / plain (see the stage CSS) ---
				const getLogo = () => document.getElementById('wabi-boot-logo');
				let logoLateTimer = 0;
				let ensoRequested = false;

				const updateMark = () => {
					const shell = getShell();
					if (!shell) return;
					const brand = shell.dataset.bootBrand;
					const logoState = shell.dataset.bootLogo || 'none';
					let mark = '';
					if (brand === 'wabi') {
						mark = shell.dataset.bootEnso === '1' ? 'enso' : 'glyph';
					} else if (brand === 'neutral') {
						mark = 'plain';
					} else if (brand === 'custom') {
						// An operator logo replaces every other mark, so nothing shows through its
						// transparent parts. While it is still in its first 400ms nothing stands in.
						if (logoState === 'loaded') mark = 'logo';
						else if (logoState !== 'loading') mark = shell.dataset.bootMono === '1' ? 'mono' : 'plain';
					}
					shell.dataset.bootMark = mark;
				};

				const setLogoState = (state) => {
					const shell = getShell();
					if (!shell) return;
					shell.dataset.bootLogo = state;
					updateMark();
				};

				const setLogo = (url, alt) => {
					const logo = getLogo();
					if (!logo) return;
					window.clearTimeout(logoLateTimer);
					logo.alt = url ? alt || '' : '';
					if (!url) {
						logo.removeAttribute('src');
						setLogoState('none');
						return;
					}
					// Only assign src if changed — avoids reload flicker
					if (logo.getAttribute('src') === url) return;
					logo.src = url;
					if (logo.complete && logo.naturalWidth > 0) {
						setLogoState('loaded');
						return;
					}
					setLogoState('loading');
					logoLateTimer = window.setTimeout(() => {
						if (getShell()?.dataset.bootLogo === 'loading') setLogoState('late');
					}, 400);
				};

				getLogo()?.addEventListener('load', () => {
					if (getLogo()?.getAttribute('src')) setLogoState('loaded');
				});
				getLogo()?.addEventListener('error', () => {
					if (getLogo()?.getAttribute('src')) setLogoState('failed');
				});

				// The default brand swaps the drawn placeholder for the real ensō once it has decoded.
				// Only the default brand requests it.
				const loadEnso = () => {
					if (ensoRequested) return;
					ensoRequested = true;
					const enso = new Image();
					enso.onload = () => {
						const shell = getShell();
						if (!shell) return;
						shell.dataset.bootEnso = '1';
						updateMark();
					};
					enso.src = '/wabi-logo-small.webp';
				};

				/**
				 * Apply brand once and lock. Later calls that try to flip
				 * custom/neutral → default Wabi are ignored (stops mount flicker),
				 * and so is a repeat of the brand family already shown (the app's
				 * built-in default config never repaints a server-stamped accent).
				 * Pass { force: true } to intentionally rebrand.
				 */
				const applyBootBrand = (snapshot) => {
					const shell = getShell();
					if (!shell) return;
					const title = document.getElementById('wabi-boot-title');
					const mono = document.getElementById('wabi-boot-mono');
					const raw = snapshot || window.__WABI_BOOT_BRAND__ || {};
					const force = raw && raw.force === true;
					const snap = {
						neutral: raw.neutral === true,
						brandName: typeof raw.brandName === 'string' ? raw.brandName.trim() : '',
						logoUrl: typeof raw.logoUrl === 'string' ? raw.logoUrl.trim() : '',
						accent: typeof raw.accent === 'string' ? raw.accent.trim() : ''
					};

					// The name "Wabi" with a Wabi logo file is the default brand, not a custom one.
					const defaultWabiLogo = /(?:^|\/)(?:wabi-logo(?:-small|-boot)?\.(?:webp|png)|icon\.png)(?:\?|$)/i.test(snap.logoUrl || '');
					const customHost =
						!snap.neutral &&
						((snap.brandName && snap.brandName !== 'Wabi') || (snap.logoUrl && !defaultWabiLogo));
					const next = snap.neutral ? 'neutral' : customHost ? 'custom' : 'wabi';

					const locked = shell.dataset.bootLocked === '1';
					const current = shell.dataset.bootBrand || 'pending';

					// Don't let late app boot overwrite a committed custom/neutral brand
					// with the default Wabi config (classic flicker path).
					if (locked && !force) {
						if ((current === 'custom' || current === 'neutral') && next === 'wabi') {
							return;
						}
						// Same brand family — ignore no-op churn
						if (current === next) {
							shell.dataset.bootReady = '1';
							return;
						}
					}

					const setAccent = (accent) => {
						if (accent) shell.style.setProperty('--boot-accent', accent);
						else shell.style.removeProperty('--boot-accent');
					};
					const initial = next === 'custom' ? (Array.from(snap.brandName)[0] || '').toLocaleUpperCase() : '';
					if (mono) mono.textContent = initial;
					if (initial) shell.dataset.bootMono = '1';
					else delete shell.dataset.bootMono;

					if (next === 'neutral') {
						shell.dataset.bootBrand = 'neutral';
						setAccent(snap.accent || '#a1a1aa');
						document.documentElement.setAttribute('data-neutral-branding', '');
						if (title) {
							title.textContent = '';
							title.dataset.empty = 'true';
						}
						setLogo('');
					} else if (next === 'custom') {
						shell.dataset.bootBrand = 'custom';
						document.documentElement.removeAttribute('data-neutral-branding');
						if (title) {
							title.textContent = snap.brandName || '';
							title.dataset.empty = snap.brandName ? 'false' : 'true';
						}
						setLogo(snap.logoUrl, snap.brandName);
						setAccent(snap.accent);
					} else {
						shell.dataset.bootBrand = 'wabi';
						document.documentElement.removeAttribute('data-neutral-branding');
						if (title) {
							title.textContent = 'Wabi';
							title.dataset.empty = 'false';
						}
						// Default brand paints the inline glyph, then the masked ensō — it never
						// waits on wabi-logo-boot.webp or an invert filter.
						setLogo('');
						// The boot palette's own sig (gold on Ink, burnt orange on Daylight) unless the
						// server or a saved server stamped an operator accent.
						setAccent(snap.accent);
						loadEnso();
					}
					updateMark();

					window.__WABI_BOOT_BRAND__ = {
						neutral: shell.dataset.bootBrand === 'neutral',
						brandName: snap.brandName || (shell.dataset.bootBrand === 'wabi' ? 'Wabi' : ''),
						logoUrl: getLogo()?.getAttribute('src') || snap.logoUrl || '',
						accent: shell.style.getPropertyValue('--boot-accent').trim()
					};
					shell.dataset.bootLocked = '1';
					// Reveal on next frame so src swap isn't painted mid-change
					requestAnimationFrame(() => {
						shell.dataset.bootReady = '1';
					});
				};

				// Expose for app-side rebrand (injectNeutralBranding / applyBranding)
				window.__hideWabiBootShell = hideBootShell;
				window.__enterReconnectMode = enterReconnectMode;
				window.__applyWabiBootBrand = applyBootBrand;

				// Apply any brand captured from localStorage in <head>
				applyBootBrand(window.__WABI_BOOT_BRAND__);

				window.addEventListener('wabi:boot-hide', hideBootShell, { once: true });
				window.addEventListener('wabi:boot-reconnect', enterReconnectMode, { once: true });
				window.addEventListener('wabi:boot-brand', (event) => {
					applyBootBrand(event && event.detail ? event.detail : null);
				});

				// The app reports real gate completions; the rail follows them.
				// Reconnect is its own terminal state — gates don't move it.
				window.addEventListener('wabi:boot-gate', (event) => {
					const shell = getShell();
					if (!shell || shell.classList.contains('is-hidden')) return;
					if (shell.dataset.bootState === 'reconnect') return;
					if (gatesComplete) return;
					const gate = event && event.detail ? event.detail.gate : '';
					const gi = gate === 'session' ? 1 : gate === 'workspace' ? 2 : gate === 'realtime' ? 3 : -1;
					if (gi === -1 || gateDone[gi]) return;
					gateDone[gi] = true;
					clearStall();
					if (shell.dataset.bootState === 'stalled') shell.dataset.bootState = 'default';
					recomputeGate();
				});

				document.getElementById('wabi-work-offline')?.addEventListener('click', () => {
					window.__hideWabiBootShell();
					window.dispatchEvent(new CustomEvent('wabi:work-offline'));
				});

				// Try again: let the app re-attempt the connection if it is listening,
				// and clear the stall so the rail resumes if the socket recovers.
				document.getElementById('wabi-boot-retry')?.addEventListener('click', () => {
					const shell = getShell();
					if (shell && shell.dataset.bootState === 'stalled') shell.dataset.bootState = 'default';
					armStall();
					window.dispatchEvent(new CustomEvent('wabi:boot-retry'));
				});

				// First real paint: shell gate already done, session active. Reveal the
				// step list only after a beat so a fast boot never sees the sequence.
				paintGate(1);
				armStall();
				window.setTimeout(revealStepsSoon, 500);
			})();
		</script>
	</body>
</html>
