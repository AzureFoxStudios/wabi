<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#0f0c29" />
		<meta name="description" content="Ephemeral chat with screen sharing and business features" />
		<script>
			// Early shell flag so first paint can skip desktop chrome on phones / PWA.
			(() => {
				try {
					const compact = window.matchMedia('(max-width: 768px)').matches;
					const standalone =
						window.matchMedia('(display-mode: standalone)').matches ||
						(typeof navigator.standalone === 'boolean' && navigator.standalone === true);
					document.documentElement.dataset.shell = compact ? 'mobile' : 'desktop';
					document.documentElement.dataset.displayMode = standalone ? 'standalone' : 'browser';
					if (compact) document.documentElement.classList.add('is-mobile-shell');
					if (standalone) document.documentElement.classList.add('is-pwa-standalone');
				} catch (_) {}
			})();
		</script>
		<style>
			html,
			body {
				min-height: 100%;
				margin: 0;
				background:
					radial-gradient(ellipse 70rem 42rem at 50% -10%, rgba(99, 102, 241, 0.14), transparent 62%),
					radial-gradient(ellipse 48rem 34rem at 12% 92%, rgba(129, 140, 248, 0.1), transparent 60%),
					linear-gradient(165deg, #0f0c29 0%, #0b1220 55%, #060b14 100%);
			}

			#wabi-boot-shell {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: grid;
				place-items: center;
				overflow: hidden;
				/* Soft wash — stays behind glass stage */
				background:
					radial-gradient(ellipse 50rem 36rem at 50% 40%, rgba(99, 102, 241, 0.12), transparent 70%),
					linear-gradient(165deg, rgba(15, 12, 41, 0.92) 0%, rgba(6, 11, 20, 0.96) 100%);
				transition:
					opacity 280ms ease,
					visibility 280ms ease;
			}

			#wabi-boot-shell.is-hidden {
				opacity: 0;
				visibility: hidden;
				pointer-events: none;
			}

			.wabi-boot-shell__center {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1.35rem;
				padding: 2rem;
				text-align: center;
				color: rgba(255, 255, 255, 0.9);
				font-family:
					"Segoe UI",
					"SF Pro Display",
					system-ui,
					sans-serif;
			}

			.wabi-boot-shell__default {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1.25rem;
			}

			.wabi-boot-shell__stage {
				position: relative;
				display: grid;
				place-items: center;
				width: 148px;
				height: 148px;
			}

			.wabi-boot-shell__halo,
			.wabi-boot-shell__ring {
				position: absolute;
				border-radius: 999px;
			}

			.wabi-boot-shell__halo {
				inset: 14px;
				background: radial-gradient(
					circle,
					color-mix(in srgb, var(--boot-accent, #818cf8) 28%, transparent) 0%,
					color-mix(in srgb, var(--boot-accent, #818cf8) 6%, transparent) 42%,
					transparent 70%
				);
				filter: blur(10px);
				animation: wabi-boot-halo-pulse 2.2s ease-in-out infinite;
			}

			.wabi-boot-shell__ring {
				inset: 0;
				border: 1px solid rgba(148, 163, 184, 0.16);
				box-shadow:
					inset 0 0 0 1px rgba(255, 255, 255, 0.04),
					0 20px 48px rgba(0, 0, 0, 0.32);
			}

			.wabi-boot-shell__ring::before {
				content: '';
				position: absolute;
				inset: 8px;
				border-radius: inherit;
				border: 1px solid rgba(255, 255, 255, 0.04);
			}

			.wabi-boot-shell__ring::after {
				content: '';
				position: absolute;
				inset: -1px;
				border-radius: inherit;
				border-top: 2px solid color-mix(in srgb, var(--boot-accent, #a5b4fc) 92%, white);
				border-right: 2px solid color-mix(in srgb, var(--boot-accent, #6366f1) 80%, transparent);
				border-bottom: 2px solid transparent;
				border-left: 2px solid transparent;
				animation: wabi-boot-spin 1.1s linear infinite;
			}

			.wabi-boot-shell__logo {
				width: 76px;
				height: 76px;
				object-fit: contain;
				filter: invert(1) drop-shadow(0 14px 30px rgba(0, 0, 0, 0.4));
				/* Stay invisible until data-boot-ready — prevents Wabi→server flicker */
				opacity: 0;
				visibility: hidden;
			}

			#wabi-boot-shell[data-boot-ready='1'] .wabi-boot-shell__logo {
				visibility: visible;
				animation-name: wabi-boot-logo-in, wabi-boot-logo-breathe;
				animation-duration: 0.45s, 2.4s;
				animation-timing-function: ease-out, ease-in-out;
				animation-iteration-count: 1, infinite;
				animation-fill-mode: forwards, none;
				animation-delay: 0s, 0.45s;
			}

			#wabi-boot-shell[data-boot-ready='1'] .wabi-boot-shell__mark {
				animation: wabi-boot-logo-in 0.45s ease-out forwards, wabi-boot-logo-breathe 2.4s ease-in-out 0.45s infinite;
			}

			/* Neutral / custom logos that are already light shouldn't be inverted */
			#wabi-boot-shell[data-boot-brand='neutral'] .wabi-boot-shell__logo,
			#wabi-boot-shell[data-boot-brand='custom'] .wabi-boot-shell__logo {
				filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.4));
			}

			.wabi-boot-shell__mark {
				display: none;
				width: 72px;
				height: 72px;
				border-radius: 20px;
				background: linear-gradient(145deg, #c8c8cf, #a1a1aa);
				box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
				position: relative;
			}

			.wabi-boot-shell__mark::after {
				content: '';
				position: absolute;
				inset: 22% 18% 28% 18%;
				border-radius: 10px;
				background: #101012;
				clip-path: polygon(0 0, 100% 0, 100% 62%, 58% 62%, 38% 100%, 38% 62%, 0 62%);
			}

			#wabi-boot-shell[data-boot-brand='neutral'] .wabi-boot-shell__logo {
				display: none;
			}

			#wabi-boot-shell[data-boot-brand='neutral'] .wabi-boot-shell__mark {
				display: none;
			}
			#wabi-boot-shell[data-boot-brand='neutral'][data-boot-ready='1'] .wabi-boot-shell__mark {
				display: block;
			}

			.wabi-boot-shell__title {
				font-size: 0.82rem;
				font-weight: 700;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: rgba(255, 255, 255, 0.88);
			}

			.wabi-boot-shell__title[data-empty='true'] {
				/* Hide product name when strip-Wabi / empty brand */
				visibility: hidden;
				height: 0;
				margin: 0;
				overflow: hidden;
			}

			.wabi-boot-shell__dots {
				display: inline-flex;
				align-items: center;
				gap: 0.4rem;
			}

			.wabi-boot-shell__dots span {
				width: 0.38rem;
				height: 0.38rem;
				border-radius: 999px;
				background: color-mix(in srgb, var(--boot-accent, #c7d2fe) 80%, white);
				animation: wabi-boot-dot-pulse 1.2s ease-in-out infinite;
			}

			.wabi-boot-shell__dots span:nth-child(2) {
				animation-delay: 140ms;
			}

			.wabi-boot-shell__dots span:nth-child(3) {
				animation-delay: 280ms;
			}

			@keyframes wabi-boot-spin {
				from { transform: rotate(0deg); }
				to { transform: rotate(360deg); }
			}

			@keyframes wabi-boot-logo-in {
				from { opacity: 0; transform: scale(0.92); }
				to { opacity: 1; transform: scale(1); }
			}

			@keyframes wabi-boot-logo-breathe {
				0%, 100% { transform: scale(1); }
				50% { transform: scale(1.03); }
			}

			@keyframes wabi-boot-halo-pulse {
				0%, 100% { opacity: 0.55; transform: scale(0.96); }
				50% { opacity: 1; transform: scale(1.04); }
			}

			@keyframes wabi-boot-dot-pulse {
				0%, 80%, 100% { opacity: 0.28; transform: translateY(0); }
				40% { opacity: 1; transform: translateY(-2px); }
			}

			/* Reconnect state */
			.wabi-boot-shell__reconnect {
				display: none;
				flex-direction: column;
				align-items: center;
				gap: 0.85rem;
			}
			.wabi-boot-shell__subtitle {
				font-size: 0.8125rem;
				opacity: 0.65;
				max-width: 240px;
				line-height: 1.45;
				margin: 0;
			}
			.wabi-boot-shell__btn {
				margin-top: 0.35rem;
				padding: 0.55rem 1.25rem;
				border-radius: 9999px;
				border: 1px solid rgba(148, 163, 184, 0.28);
				background: rgba(255, 255, 255, 0.06);
				color: rgba(255, 255, 255, 0.9);
				font-family: inherit;
				font-size: 0.8125rem;
				font-weight: 600;
				cursor: pointer;
				transition: background 0.15s ease, border-color 0.15s ease;
			}
			.wabi-boot-shell__btn:hover {
				background: rgba(255, 255, 255, 0.12);
				border-color: rgba(148, 163, 184, 0.42);
			}
			[data-boot-state='reconnect'] .wabi-boot-shell__default {
				display: none;
			}
			[data-boot-state='reconnect'] .wabi-boot-shell__reconnect {
				display: flex;
			}

			/* Neutral palette on boot (early data-neutral-branding or data-boot-brand) */
			html[data-neutral-branding] #wabi-boot-shell,
			#wabi-boot-shell[data-boot-brand='neutral'] {
				--boot-accent: #a1a1aa;
				background:
					radial-gradient(ellipse 50rem 36rem at 50% 40%, rgba(161, 161, 170, 0.1), transparent 70%),
					linear-gradient(165deg, rgba(24, 24, 27, 0.94) 0%, rgba(9, 9, 11, 0.97) 100%);
			}

			@media (prefers-reduced-motion: reduce) {
				.wabi-boot-shell__ring::after,
				.wabi-boot-shell__halo,
				.wabi-boot-shell__logo,
				.wabi-boot-shell__mark,
				.wabi-boot-shell__dots span {
					animation: none !important;
				}
				#wabi-boot-shell[data-boot-ready='1'] .wabi-boot-shell__logo {
					opacity: 1;
					visibility: visible;
				}
			}
		</style>
		<script>
			// Apply saved-server brand BEFORE first paint so boot isn't stuck on "Wabi".
			(() => {
				try {
					const NEUTRAL_SVG =
						"data:image/svg+xml;utf8," +
						"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'>" +
						"<rect width='96' height='96' rx='22' fill='%23a1a1aa'/>" +
						"<path d='M24 34a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v18a8 8 0 0 1-8 8H45l-13 11v-11h-8a8 8 0 0 1-8-8z' fill='%23101012'/>" +
						'</svg>';

					const raw = localStorage.getItem('wabi.savedServers.v1');
					if (!raw) return;
					const parsed = JSON.parse(raw);
					const entries = Array.isArray(parsed?.entries) ? parsed.entries : [];
					if (!entries.length) return;

					// Prefer the entry for this origin. Never paint another server's
					// identity while visiting an unknown host.
					const currentOrigin = window.location.origin;
					const entry = entries.find((candidate) => {
						try { return new URL(candidate?.url || '').origin === currentOrigin; } catch (_) { return false; }
					}) || null;
					if (!entry || typeof entry !== 'object') return;

					const neutral = entry.useNeutralBranding === true;
					const launch = entry.launchPageBranding || null;
					const meta = entry.frontendMetadata || null;

					const brandName =
						(launch && typeof launch.brandName === 'string' && launch.brandName.trim()) ||
						(meta && typeof meta.brandName === 'string' && meta.brandName.trim()) ||
						(meta && typeof meta.name === 'string' && meta.name.trim()) ||
						'';
					const logoUrl =
						(launch && typeof launch.logoUrl === 'string' && launch.logoUrl.trim()) ||
						(meta && typeof meta.logoUrl === 'string' && meta.logoUrl.trim()) ||
						'';
					const accent =
						(launch && launch.palette && typeof launch.palette.accent === 'string' && launch.palette.accent) ||
						(meta && typeof meta.accentColor === 'string' && meta.accentColor) ||
						'';

					window.__WABI_BOOT_BRAND__ = {
						neutral,
						brandName,
						logoUrl,
						accent
					};

					if (neutral) {
						document.documentElement.setAttribute('data-neutral-branding', '');
					}

					// Defer DOM writes until shell exists (body not parsed yet if in head —
					// this script is in head; shell is in body. Use DOMContentLoaded or
					// put apply after body. We'll re-run after shell mounts via inline after shell.)
				} catch (_) {
					/* ignore corrupt storage */
				}
					if (!window.__WABI_BOOT_BRAND__) {
						fetch('/api/public/launch-page', { credentials: 'omit' })
							.then((response) => response.ok ? response.json() : null)
							.then((launch) => {
								if (!launch || typeof launch !== 'object') return;
								const brandName = typeof launch.brandName === 'string' ? launch.brandName.trim() : '';
								const logoUrl = typeof launch.logoUrl === 'string' ? launch.logoUrl.trim() : '';
								const accent = typeof launch.palette?.accent === 'string' ? launch.palette.accent : '';
								if (!brandName && !logoUrl && !accent) return;
								const snapshot = { brandName, logoUrl, accent, force: true };
								window.__WABI_BOOT_BRAND__ = snapshot;
								try {
									const current = JSON.parse(localStorage.getItem('wabi.savedServers.v1') || '{}');
									const entries = Array.isArray(current.entries) ? current.entries : [];
									const index = entries.findIndex((candidate) => {
										try { return new URL(candidate?.url || '').origin === window.location.origin; } catch (_) { return false; }
									});
									if (index >= 0) {
										entries[index].launchPageBranding = {
											brandName: launch.brandName || '', logoUrl: launch.logoUrl || '',
											heroImageUrl: launch.heroImageUrl || null, subheadline: launch.subheadline || '',
											palette: launch.palette || { accent: accent }, brandProfile: launch.brandProfile || null
										};
										localStorage.setItem('wabi.savedServers.v1', JSON.stringify({ ...current, entries }));
									}
								} catch (_) { /* cache is best effort */ }
								if (typeof window.__applyWabiBootBrand === 'function') window.__applyWabiBootBrand(snapshot);
							})
							.catch(() => { /* fallback shell remains available */ });
					}
				})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div id="wabi-boot-shell" role="status" aria-live="polite" data-boot-brand="pending" style="--boot-accent: #818cf8">
			<div class="wabi-boot-shell__center" data-boot-state="default">
				<div class="wabi-boot-shell__default">
					<div class="wabi-boot-shell__stage" aria-hidden="true">
						<span class="wabi-boot-shell__halo"></span>
						<span class="wabi-boot-shell__ring"></span>
						<img
							id="wabi-boot-logo"
							alt=""
							class="wabi-boot-shell__logo"
							decoding="async"
						/>
						<span class="wabi-boot-shell__mark" aria-hidden="true"></span>
					</div>
					<div id="wabi-boot-title" class="wabi-boot-shell__title" data-empty="true">Starting</div>
					<div class="wabi-boot-shell__dots" aria-hidden="true">
						<span></span>
						<span></span>
						<span></span>
					</div>
				</div>
				<div class="wabi-boot-shell__reconnect">
					<div class="wabi-boot-shell__title">Reconnecting…</div>
					<p class="wabi-boot-shell__subtitle">Unable to reach the server. Your session may still be valid.</p>
					<button id="wabi-work-offline" class="wabi-boot-shell__btn" type="button">Work Offline</button>
				</div>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(() => {
				const getShell = () => document.getElementById('wabi-boot-shell');
				const getCenter = () => getShell()?.querySelector('.wabi-boot-shell__center');

				const hideBootShell = () => {
					const shell = getShell();
					if (!shell || shell.classList.contains('is-hidden')) return;
					shell.classList.add('is-hidden');
					window.setTimeout(() => shell.remove(), 300);
				};

				const enterReconnectMode = () => {
					const center = getCenter();
					if (center) center.dataset.bootState = 'reconnect';
				};

				const DEFAULT_WABI_LOGO = '%sveltekit.assets%/wabi-logo-boot.webp';

				/**
				 * Apply brand once and lock. Later calls that try to flip
				 * custom/neutral → default Wabi are ignored (stops mount flicker).
				 * Pass { force: true } to intentionally rebrand.
				 */
				const applyBootBrand = (snapshot) => {
					const shell = getShell();
					if (!shell) return;
					const logo = document.getElementById('wabi-boot-logo');
					const title = document.getElementById('wabi-boot-title');
					const raw = snapshot || window.__WABI_BOOT_BRAND__ || {};
					const force = raw && raw.force === true;
					const snap = {
						neutral: raw.neutral === true,
						brandName: typeof raw.brandName === 'string' ? raw.brandName.trim() : '',
						logoUrl: typeof raw.logoUrl === 'string' ? raw.logoUrl.trim() : '',
						accent: typeof raw.accent === 'string' ? raw.accent.trim() : ''
					};

					const locked = shell.dataset.bootLocked === '1';
					const current = shell.dataset.bootBrand || 'pending';
					const next =
						snap.neutral ? 'neutral' : (snap.brandName || snap.logoUrl) ? 'custom' : 'wabi';

					// Don't let late app boot overwrite a committed custom/neutral brand
					// with the default Wabi config (classic flicker path).
					if (locked && !force) {
						if ((current === 'custom' || current === 'neutral') && next === 'wabi') {
							return;
						}
						// Same brand family — ignore no-op churn
						if (current === next && current !== 'pending') {
							shell.dataset.bootReady = '1';
							return;
						}
					}

					const defaultWabiLogo = /(?:^|\/)(?:wabi-logo(?:-small|-boot)?\.webp|icon\.png)(?:\?|$)/i.test(snap.logoUrl || '');
					const customHost =
						!snap.neutral &&
						((snap.brandName && snap.brandName !== 'Wabi') || (snap.logoUrl && !defaultWabiLogo));

					if (snap.neutral) {
						shell.dataset.bootBrand = 'neutral';
						shell.style.setProperty('--boot-accent', snap.accent || '#a1a1aa');
						document.documentElement.setAttribute('data-neutral-branding', '');
						if (title) {
							title.textContent = 'Starting';
							title.dataset.empty = 'true';
						}
						if (logo) {
							logo.removeAttribute('src');
							logo.alt = '';
						}
					} else if (customHost) {
						shell.dataset.bootBrand = 'custom';
						document.documentElement.removeAttribute('data-neutral-branding');
						if (title) {
							title.textContent = snap.brandName ? ('Starting ' + snap.brandName) : 'Starting';
							title.dataset.empty = snap.brandName ? 'false' : 'true';
						}
						if (logo && snap.logoUrl) {
							// Only assign src if changed — avoids reload flicker
							if (logo.getAttribute('src') !== snap.logoUrl) {
								logo.src = snap.logoUrl;
							}
							logo.alt = snap.brandName || '';
						}
						if (snap.accent) shell.style.setProperty('--boot-accent', snap.accent);
					} else {
						shell.dataset.bootBrand = 'wabi';
						document.documentElement.removeAttribute('data-neutral-branding');
						if (title) {
							title.textContent = 'Starting Wabi';
							title.dataset.empty = 'false';
						}
						if (logo) {
							if (logo.getAttribute('src') !== DEFAULT_WABI_LOGO) {
								logo.src = DEFAULT_WABI_LOGO;
							}
							logo.alt = 'Wabi';
						}
						if (snap.accent) shell.style.setProperty('--boot-accent', snap.accent);
						else shell.style.setProperty('--boot-accent', '#818cf8');
					}

					window.__WABI_BOOT_BRAND__ = {
						neutral: shell.dataset.bootBrand === 'neutral',
						brandName: snap.brandName || (shell.dataset.bootBrand === 'wabi' ? 'Wabi' : ''),
						logoUrl: (logo && logo.getAttribute('src')) || snap.logoUrl || '',
						accent: shell.style.getPropertyValue('--boot-accent').trim()
					};
					shell.dataset.bootLocked = '1';
					// Reveal on next frame so src swap isn't painted mid-change
					requestAnimationFrame(() => {
						shell.dataset.bootReady = '1';
					});
				};

				// Expose for app-side rebrand (injectNeutralBranding / applyBranding)
				window.__hideWabiBootShell = hideBootShell;
				window.__enterReconnectMode = enterReconnectMode;
				window.__applyWabiBootBrand = applyBootBrand;

				// Apply any brand captured from localStorage in <head>
				applyBootBrand(window.__WABI_BOOT_BRAND__);

				window.addEventListener('wabi:boot-hide', hideBootShell, { once: true });
				window.addEventListener('wabi:boot-reconnect', enterReconnectMode, { once: true });
				window.addEventListener('wabi:boot-brand', (event) => {
					applyBootBrand(event && event.detail ? event.detail : null);
				});

				document.getElementById('wabi-work-offline')?.addEventListener('click', () => {
					window.__hideWabiBootShell();
					window.dispatchEvent(new CustomEvent('wabi:work-offline'));
				});
			})();
		</script>
	</body>
</html>
