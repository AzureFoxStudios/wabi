services:
  backend:
    build:
      dockerfile: Dockerfile.bun
    environment:
      WABI_RUNTIME: bun
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/health').then(r=>{process.exit(r.status>=200&&r.status<400?0:1)}).catch(()=>process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      dockerfile: Dockerfile.bun
    environment:
      WABI_RUNTIME: bun
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8080/').then(r=>{process.exit(r.status>=200&&r.status<400?0:1)}).catch(()=>process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
