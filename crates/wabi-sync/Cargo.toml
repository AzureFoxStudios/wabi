[package]
name = "wabi-sync"
version = "0.1.0"
edition = "2021"
description = "Folder-level two-way sync between a local directory and a Wabi Lore repo — works with any editor"
license = "MIT"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.11"
hex = "0.4"
notify = "6"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
