[package]
name = "wabi-desktop"
version = "0.1.0"
description = "Wabi Desktop App - Self-hosted Discord alternative"
authors = ["Ronin"]
license = "MIT"
repository = "https://github.com/lethalchip/wabi"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
open = "5"

# Native 3D model viewer (Tauri command spawns a separate wgpu window)
wgpu = "0.19"
winit = "0.29"
gltf = "1.4"
glam = "0.29"
image = "0.25"
pollster = "0.3"
anyhow = "1"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
