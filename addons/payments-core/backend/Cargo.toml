[package]
name = "payments-core"
version = "0.1.0"
edition = "2021"
description = "Core payment provider trait and types for Wabi"
authors = ["Community"]
license = "MIT"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
static_assertions = "1.1"