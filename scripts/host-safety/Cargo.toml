[package]
name = "wabi-host-safety-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Keep safety tests independent of the GUI, GPU and webview dependency trees.
[workspace]

[lib]
path = "lib.rs"

[dependencies]
if-addrs = "=0.15.0"
getrandom = "=0.3.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

# Same lock-file identity dependency as src-tauri's hosting::archive.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
