[workspace]
members = [
  "crates/wabi-core",
  "crates/wabi-sync",
  "core/crates/wabi-server",
  "core/crates/wabi-tui",
  "core/crates/wabidb",
  "core/crates/wabi-consensus",
  "core/addons/webhooks/backend",
  "core/addons/lore/backend",
  "core/addons/tailcat/backend",
  "core/addons/payments-crypto/backend",
  "core/addons/payments-eu/backend",
  "core/addons/payments-us/backend",
]
exclude = [
  "src-tauri",
  "frontend/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]

# Keep repeated backend checks from accumulating multi-gigabyte compiler caches.
# Operators can explicitly opt into incremental compilation when disk allows it.
[profile.dev]
incremental = false

[profile.test]
incremental = false
