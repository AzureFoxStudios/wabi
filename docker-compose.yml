services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wabi-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/app/data
      - PLUGINS_DIR=/app/plugins
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - ./data:/app/data
      - ./plugins:/app/plugins
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wabi-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - PORT=80
    depends_on:
      - backend
    restart: unless-stopped
