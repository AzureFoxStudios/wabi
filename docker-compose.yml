version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wabi-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/app/data
      - PLUGINS_DIR=/app/plugins
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - wabi-data:/app/data
      - wabi-plugins:/app/plugins
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://wabi-backend:8080}
    container_name: wabi-frontend
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  wabi-data:
  wabi-plugins:
