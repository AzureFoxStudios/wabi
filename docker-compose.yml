services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: backend-${DB_MODE:-sqlite}
      args:
        - OPENMOJI_VERSION=${OPENMOJI_VERSION:-15.1.0}
        - OPENMOJI_72_SHA256=${OPENMOJI_72_SHA256:-}
    container_name: wabi-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/app/data
      - PLUGINS_DIR=/app/plugins
      - DB_MODE=${DB_MODE:-sqlite}
      - WABI_MODE=${WABI_MODE:-normal}
      - WABI_RUNTIME=${WABI_RUNTIME:-node}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
      - TURN_CREDENTIAL_TTL_SECONDS=${TURN_CREDENTIAL_TTL_SECONDS:-3600}
      - SFU_PROVIDER=${SFU_PROVIDER:-none}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./plugins:/app/plugins
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://localhost:8080/health',res=>{process.exit(res.statusCode>=200&&res.statusCode<400?0:1)});req.on('error',()=>process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_TURN_SERVER=${VITE_TURN_SERVER}
        - VITE_TURN_PORT=${VITE_TURN_PORT:-3478}
        - VITE_USE_TURNS=${VITE_USE_TURNS:-false}
        - VITE_ENABLE_GOOGLE_STUN=${VITE_ENABLE_GOOGLE_STUN:-true}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL:-}
        - VITE_GIPHY_API_KEY=${VITE_GIPHY_API_KEY:-}
        - OPENMOJI_VERSION=${OPENMOJI_VERSION:-15.1.0}
        - OPENMOJI_72_SHA256=${OPENMOJI_72_SHA256:-}
    container_name: wabi-frontend
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - WABI_MODE=${WABI_MODE:-normal}
      - WABI_RUNTIME=${WABI_RUNTIME:-node}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://localhost:8080/',res=>{process.exit(res.statusCode>=200&&res.statusCode<400?0:1)});req.on('error',()=>process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  coturn:
    build:
      context: ./turn-server
      dockerfile: Dockerfile
    container_name: wabi-coturn
    profiles:
      - turn
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./turn-server/turnserver.conf.template:/etc/coturn/turnserver.conf.template:ro
      - ./turn-server/certs:/etc/coturn/certs:ro
      - ./turn-server/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint.sh"]
    environment:
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP:-127.0.0.1}
      - TURN_REALM=${TURN_REALM:-wabi.local}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET}
    restart: unless-stopped

  media-gateway:
    build:
      context: ./media-gateway
      dockerfile: Dockerfile
    container_name: wabi-media-gateway
    profiles:
      - srt-gateway
    ports:
      - "8095:8095"
    env_file:
      - .env
    environment:
      - WABI_ORIGIN_URL=${MEDIA_GATEWAY_ORIGIN_URL:-http://backend:8080}
      - MEDIA_GATEWAY_KEY=${MEDIA_GATEWAY_KEY}
      - MEDIA_GATEWAY_REGION=${MEDIA_GATEWAY_REGION:-local}
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8095
      - MEDIA_GATEWAY_HEARTBEAT_INTERVAL_MS=${MEDIA_GATEWAY_HEARTBEAT_INTERVAL_MS:-15000}
      - MEDIA_GATEWAY_SESSION_SYNC_INTERVAL_MS=${MEDIA_GATEWAY_SESSION_SYNC_INTERVAL_MS:-10000}
    depends_on:
      - backend
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8.3
    container_name: wabi-livekit
    profiles:
      - sfu
    command: >
      --bind 0.0.0.0
      --keys ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}:${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
    ports:
      - "7880:7880"
      - "7881:7881/udp"
    restart: unless-stopped

  caddy-tunnel:
    image: caddy:2
    container_name: wabi-tunnel-caddy
    profiles:
      - tunnel
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  cloudflared-quick:
    image: cloudflare/cloudflared:2025.2.1
    container_name: wabi-cloudflared-quick
    profiles:
      - tunnel
      - tunnel-quick
    command: tunnel --no-autoupdate --url http://caddy-tunnel:8088
    depends_on:
      - caddy-tunnel
    restart: unless-stopped

  cloudflared-named:
    image: cloudflare/cloudflared:2025.2.1
    container_name: wabi-cloudflared-named
    profiles:
      - tunnel
      - tunnel-named
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy-tunnel
    restart: unless-stopped
