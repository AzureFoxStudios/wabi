# Wabi - canonical compose for the wabidb stack.
# Single source of truth: Rust server with embedded WabiDB engine.
#
# wabi-server is the Rust HTTP/WS server (axum). It embeds:
# - The SvelteKit frontend at compile time via rust_embed
#   (folder = ../../../frontend/build, set in main.rs)
# - The WabiDB engine (in-process via WdbAdapter)
#
# There is no SpacetimeDB service. There are no STDB proxies. Wabidb replaces STDB
# as the source of truth for all state (messages, channels, DMs, users, etc.).
#
# The image builds the frontend + binary from source (multi-stage Dockerfile),
# so a fresh clone + `docker compose up -d --build` just works. To test a
# host-built binary instead, mount ./target/release/wabi-server over
# /wabi-server (read-only) and restart the container.
#
# Secrets are OPTIONAL for the core Authority: with no .env at all, first boot
# auto-generates the JWT secret and WabiDB root key and persists them inside
# ./data/wabi-server. Optional media infrastructure has its own requirements.
#
# Default `docker compose up -d` brings up only wabi-server.
# Optional services (coturn, media-gateway, livekit, tunnels, shared media node)
# live under compose profiles so the default stays minimal.
#
# Security posture:
# - wabi-server runs as UID/GID 1000 (non-root)
# - a one-shot initializer prepares only the three mounted directory owners
# - No privileged: true, no cap_add, no host network anywhere
# - All bind-mounts are scoped to the project tree (./data, ./uploads, ./plugins)
# - Dev-only defaults for non-secret config (ports, paths, intervals)
# - Cross-platform: works in the normal Docker/Podman model

services:
  # Fresh Docker bind mounts may be created as root. Prepare only mount roots;
  # never recursively change existing community files. Podman uses the same
  # container UID mapping. This exits before the non-root Authority starts.
  wabi-storage-init:
    build:
      context: .
      dockerfile: core/crates/wabi-server/Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 1000:1000 /data /app/uploads /app/plugins"]
    volumes:
      - ./data/wabi-server:/data:Z
      - ./uploads:/app/uploads:Z
      - ./plugins:/app/plugins:Z
    restart: "no"

  # ---------------------------------------------------------------- core ----
  wabi-server:
    build:
      context: .
      dockerfile: core/crates/wabi-server/Dockerfile
    container_name: wabi-server
    depends_on:
      wabi-storage-init:
        condition: service_completed_successfully
    user: "1000:1000"
    ports:
      - "${WABI_PORT_OUT:-3001}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - WABI_PORT=3000
      - WABI_HOST=0.0.0.0
      - WABI_DATA_DIR=/data
      # Secrets (WABI_JWT_KEY / WABIDB_ROOT_KEY) are intentionally NOT set here:
      # first boot auto-generates and persists them in /data when absent, and
      # values from .env flow in via env_file above when operators set them.
      - WABI_SERVER_INSTANCE_ID=${WABI_SERVER_INSTANCE_ID:-}
      - WABI_SERVER_REGION=${WABI_SERVER_REGION:-}
      - WABI_SERVER_ROLE=${WABI_SERVER_ROLE:-authority}
      - WABI_MESH_INSTANCE_URL_TEMPLATE=${WABI_MESH_INSTANCE_URL_TEMPLATE:-}
      - WABI_MESH_INGRESS_URL=${WABI_MESH_INGRESS_URL:-}
      - WABI_MESH_COORDINATION_KEY=${WABI_MESH_COORDINATION_KEY:-}
      - WABI_MAX_BODY_SIZE=${WABI_MAX_BODY_SIZE:-53687091200}
      - WABI_ADMIN_USER_IDS=${WABI_ADMIN_USER_IDS:-}
      - WABI_BLACKLIST_FILE=/data/blacklist.txt
    volumes:
      # Engine data directory (wabidb streams, commit index, snapshots, blobs,
      # plus the auto-generated jwt_secret and root_key)
      - ./data/wabi-server:/data:Z
      # Default uploads remain /data/uploads for existing deployments.
      # This external mount is used when WABI_UPLOADS_DIR=/app/uploads is set.
      - ./uploads:/app/uploads:Z
      - ./plugins:/app/plugins:Z
    command: ["--data-dir", "/data", "--host", "0.0.0.0", "--port", "3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------- tunnels ----
  # Profile: tunnel
  caddy-tunnel:
    image: docker.io/library/caddy:2
    container_name: wabi-tunnel-caddy
    profiles:
      - tunnel
    user: "1000:1000"
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro,z
    depends_on:
      wabi-server:
        condition: service_healthy
    restart: unless-stopped

  cloudflared-quick:
    image: docker.io/cloudflare/cloudflared:2026.2.0
    container_name: wabi-cloudflared-quick
    profiles:
      - tunnel
      - tunnel-quick
    command: tunnel --no-autoupdate --url http://caddy-tunnel:8088
    depends_on:
      - caddy-tunnel
    restart: unless-stopped

  cloudflared-named:
    image: docker.io/cloudflare/cloudflared:2026.2.0
    container_name: wabi-cloudflared-named
    profiles:
      - tunnel
      - tunnel-named
    command: tunnel --no-autoupdate --protocol http2 --loglevel debug run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy-tunnel
    restart: unless-stopped

  # ---------------------------------------------------- media (optional) ----
  # Profile: turn - standalone TURN server (coturn).
  # It is intentionally independently runnable: a public Media Node does not
  # need to run a Wabi Authority on the same machine.
  coturn:
    build:
      context: ./turn-server
      dockerfile: Dockerfile
    container_name: wabi-coturn
    profiles:
      - turn
    user: "1000:1000"
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./turn-server/turnserver.conf.template:/etc/coturn/turnserver.conf.template:ro,z
      - ./turn-server/certs:/etc/coturn/certs:ro,z
      - ./turn-server/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro,z
      - ./data:/wabi-data:ro,z
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint.sh"]
    environment:
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP:-}
      - TURN_REALM=${TURN_REALM:-localhost}
      # TURN remains fail-closed until a secret is deliberately configured.
      - TURN_HMAC_KEY=${TURN_HMAC_KEY:-}
      - WABI_AUTOGEN_PATH=/wabi-data/.wabi-autogen
    restart: unless-stopped

  # Profile: srt-gateway - media gateway for SRT ingest
  media-gateway:
    build:
      context: ./media-gateway
      dockerfile: Dockerfile
    container_name: wabi-media-gateway
    profiles:
      - srt-gateway
    user: "1000:1000"
    ports:
      - "8095:8095"
    env_file:
      - path: .env
        required: false
    environment:
      - WABI_ORIGIN_URL=${GATEWAY_UPSTREAM_URL:-http://wabi-server:3000}
      - SRT_INGEST_PWD=${SRT_INGEST_PWD:-}
      - GATEWAY_REGION=${GATEWAY_REGION:-local}
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8095
      - GATEWAY_HEARTBEAT_MS=${GATEWAY_HEARTBEAT_MS:-15000}
      - GATEWAY_SESSION_SYNC_MS=${GATEWAY_SESSION_SYNC_MS:-10000}
    depends_on:
      - wabi-server
    restart: unless-stopped

  # Profiles:
  #   sfu        - standalone reference SFU
  #   media-node - reference SFU as part of a shared Wabi Media Node
  #
  # LiveKit 7881 is ICE/TCP. WebRTC UDP is handled through a configured UDP mux
  # port (7882 by default) so bridge-mode Compose does not need a 10k-port range.
  livekit:
    image: docker.io/livekit/livekit-server:v1.13.6
    container_name: wabi-livekit
    profiles:
      - sfu
      - media-node
    user: "1000:1000"
    command: ["--bind", "0.0.0.0"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-disabled}: ${LIVEKIT_API_SECRET:-disabled}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: ${LIVEKIT_UDP_PORT:-7882}
          use_external_ip: true
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880/tcp"
      - "${LIVEKIT_TCP_PORT:-7881}:7881/tcp"
      - "${LIVEKIT_UDP_PORT:-7882}:${LIVEKIT_UDP_PORT:-7882}/udp"
    restart: unless-stopped

  # Profile: media-node - one physical Media Node serving one or more independent
  # Authorities. The same profile starts LiveKit above. Point the controller's
  # config at the public/TLS endpoint clients should actually use.
  wabi-media-node:
    image: docker.io/library/python:3.13-alpine
    container_name: wabi-media-node
    profiles:
      - media-node
    user: "1000:1000"
    working_dir: /app
    environment:
      # These root SFU credentials are deliberately present on the Media Node
      # controller and LiveKit only. Wabi Authorities receive scoped join tokens,
      # never LIVEKIT_API_SECRET.
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    volumes:
      - ./scripts/wabi-media-node.py:/app/wabi-media-node.py:ro,z
      - ${WABI_MEDIA_NODE_CONFIG:-./wabi.media-node.json}:/config/wabi.media-node.json:ro,z
      - ./data/wabi-media-node:/data:Z,U
    command:
      - python3
      - /app/wabi-media-node.py
      - --config
      - /config/wabi.media-node.json
      - --state-dir
      - /data
    depends_on:
      - livekit
    restart: unless-stopped
