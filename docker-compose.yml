services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: backend-sqlite
      args:
        - OPENMOJI_VERSION=${OPENMOJI_VERSION:-15.1.0}
        - OPENMOJI_72_SHA256=${OPENMOJI_72_SHA256:-}
    container_name: wabi-backend
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=8080
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,https://tauri.localhost,tauri://localhost}
      - DATA_DIR=/app/data
      - PLUGINS_DIR=/app/plugins
      - DB_MODE=sqlite
      - WABI_MODE=${WABI_MODE:-normal}
      - WABI_RUNTIME=${WABI_RUNTIME:-node}
      - JWT_SECRET=${JWT_SECRET:-}
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP:-127.0.0.1}
      - TURN_REALM=${TURN_REALM:-localhost}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET:-}
      - TURN_CREDENTIAL_TTL_SECONDS=${TURN_CREDENTIAL_TTL_SECONDS:-3600}
      - BOOSTER_RELAY_MODE=${BOOSTER_RELAY_MODE:-off}
      - BOOSTER_RELAY_PUBLIC_URL=${BOOSTER_RELAY_PUBLIC_URL:-}
      - BOOSTER_RELAY_NAME=${BOOSTER_RELAY_NAME:-}
      - BOOSTER_RELAY_REGION=${BOOSTER_RELAY_REGION:-}
      - BOOSTER_RELAY_BANDWIDTH_MBPS=${BOOSTER_RELAY_BANDWIDTH_MBPS:-}
      - BOOSTER_RELAY_STORAGE_GB=${BOOSTER_RELAY_STORAGE_GB:-}
      - BOOSTER_RELAY_HEARTBEAT_SECONDS=${BOOSTER_RELAY_HEARTBEAT_SECONDS:-60}
      - SFU_PROVIDER=${SFU_PROVIDER:-none}
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
      - STATE_BACKEND_MODE=${STATE_BACKEND_MODE:-}
      - STATE_STDB_READ_ENABLED=${STATE_STDB_READ_ENABLED:-}
      - STATE_STDB_WRITE_ENABLED=${STATE_STDB_WRITE_ENABLED:-}
      - STATE_STDB_PRIMARY_MIRROR_LEGACY_WRITES=${STATE_STDB_PRIMARY_MIRROR_LEGACY_WRITES:-}
      - STATE_BACKEND_STRICT=${STATE_BACKEND_STRICT:-}
      - STATE_STDB_SUBSCRIPTIONS_ENABLED=${STATE_STDB_SUBSCRIPTIONS_ENABLED:-}
      - STATE_SHADOW_WARMUP_ENABLED=${STATE_SHADOW_WARMUP_ENABLED:-}
      - STATE_SHADOW_WARMUP_LIMIT=${STATE_SHADOW_WARMUP_LIMIT:-}
      - STATE_SHADOW_WRITER_ENABLED=${STATE_SHADOW_WRITER_ENABLED:-}
      - STATE_SHADOW_SINK=${STATE_SHADOW_SINK:-}
      - STATE_SHADOW_ENDPOINT=${STATE_SHADOW_ENDPOINT:-}
      - STATE_SHADOW_TOKEN=${STATE_SHADOW_TOKEN:-}
      - STATE_SHADOW_SIGNING_SECRET=${STATE_SHADOW_SIGNING_SECRET:-}
      - STATE_SHADOW_SIGNING_KEY_ID=${STATE_SHADOW_SIGNING_KEY_ID:-}
      - STATE_SHADOW_COMMAND=${STATE_SHADOW_COMMAND:-}
      - STATE_SHADOW_COMMAND_TIMEOUT_MS=${STATE_SHADOW_COMMAND_TIMEOUT_MS:-}
      - STATE_SHADOW_POLL_INTERVAL_MS=${STATE_SHADOW_POLL_INTERVAL_MS:-}
      - STATE_SHADOW_BATCH_SIZE=${STATE_SHADOW_BATCH_SIZE:-}
      - WABI_STDB_BRIDGE_SERVER=${WABI_STDB_BRIDGE_SERVER:-}
      - WABI_STDB_BRIDGE_DATABASE=${WABI_STDB_BRIDGE_DATABASE:-}
      - WABI_STDB_BRIDGE_REDUCER=${WABI_STDB_BRIDGE_REDUCER:-}
      - WABI_STDB_BRIDGE_TIMEOUT_MS=${WABI_STDB_BRIDGE_TIMEOUT_MS:-}
      - WABI_STDB_AUTH_TOKEN=${WABI_STDB_AUTH_TOKEN:-}
      - WABI_STDB_ANONYMOUS=${WABI_STDB_ANONYMOUS:-}
      - WABI_STDB_ALLOW_ANONYMOUS_IN_PRODUCTION=${WABI_STDB_ALLOW_ANONYMOUS_IN_PRODUCTION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./plugins:/app/plugins
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://localhost:8080/health',res=>{process.exit(res.statusCode>=200&&res.statusCode<400?0:1)});req.on('error',()=>process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_TURN_SERVER=${VITE_TURN_SERVER:-127.0.0.1}
        - VITE_TURN_PORT=${VITE_TURN_PORT:-3478}
        - VITE_USE_TURNS=${VITE_USE_TURNS:-false}
        - VITE_ENABLE_GOOGLE_STUN=${VITE_ENABLE_GOOGLE_STUN:-true}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL:-}
        - VITE_GIPHY_API_KEY=${VITE_GIPHY_API_KEY:-432vWeSYvBNbv4z5YL7MYgcg8zMT5L91}
        - OPENMOJI_VERSION=${OPENMOJI_VERSION:-15.1.0}
        - OPENMOJI_72_SHA256=${OPENMOJI_72_SHA256:-}
    container_name: wabi-frontend
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - WABI_MODE=${WABI_MODE:-normal}
      - WABI_RUNTIME=${WABI_RUNTIME:-node}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const req=http.get('http://localhost:8080/',res=>{process.exit(res.statusCode>=200&&res.statusCode<400?0:1)});req.on('error',()=>process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  coturn:
    build:
      context: ./turn-server
      dockerfile: Dockerfile
    container_name: wabi-coturn
    profiles:
      - turn
      - booster-turn
      - booster-sfu
      - booster-full
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./turn-server/turnserver.conf.template:/etc/coturn/turnserver.conf.template:ro
      - ./turn-server/certs:/etc/coturn/certs:ro
      - ./turn-server/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint.sh"]
    environment:
      - TURN_EXTERNAL_IP=${TURN_EXTERNAL_IP:-127.0.0.1}
      - TURN_REALM=${TURN_REALM:-localhost}
      - TURN_SHARED_SECRET=${TURN_SHARED_SECRET:-}
    restart: unless-stopped

  media-gateway:
    build:
      context: ./media-gateway
      dockerfile: Dockerfile
    container_name: wabi-media-gateway
    profiles:
      - srt-gateway
      - booster-full
    ports:
      - "8095:8095"
    env_file:
      - path: .env
        required: false
    environment:
      - WABI_ORIGIN_URL=${MEDIA_GATEWAY_ORIGIN_URL:-http://backend:8080}
      - MEDIA_GATEWAY_KEY=${MEDIA_GATEWAY_KEY:-}
      - MEDIA_GATEWAY_REGION=${MEDIA_GATEWAY_REGION:-local}
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8095
      - MEDIA_GATEWAY_HEARTBEAT_INTERVAL_MS=${MEDIA_GATEWAY_HEARTBEAT_INTERVAL_MS:-15000}
      - MEDIA_GATEWAY_SESSION_SYNC_INTERVAL_MS=${MEDIA_GATEWAY_SESSION_SYNC_INTERVAL_MS:-10000}
    depends_on:
      - backend
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8.3
    container_name: wabi-livekit
    profiles:
      - sfu
      - booster-sfu
      - booster-full
    command: >
      --bind 0.0.0.0
      --keys ${LIVEKIT_API_KEY:-disabled}:${LIVEKIT_API_SECRET:-disabled}
    ports:
      - "7880:7880"
      - "7881:7881/udp"
    restart: unless-stopped

  caddy-tunnel:
    image: caddy:2
    container_name: wabi-tunnel-caddy
    profiles:
      - tunnel
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  cloudflared-quick:
    image: cloudflare/cloudflared:2026.2.0
    container_name: wabi-cloudflared-quick
    profiles:
      - tunnel
      - tunnel-quick
    command: tunnel --no-autoupdate --url http://caddy-tunnel:8088
    depends_on:
      - caddy-tunnel
    restart: unless-stopped

  cloudflared-named:
    image: cloudflare/cloudflared:2026.2.0
    container_name: wabi-cloudflared-named
    profiles:
      - tunnel
      - tunnel-named
    command: tunnel --no-autoupdate --protocol http2 --loglevel debug run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy-tunnel
    restart: unless-stopped
