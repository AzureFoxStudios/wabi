version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wabi-backend
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/app/data
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - wabi-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wabi-frontend
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  wabi-data:
