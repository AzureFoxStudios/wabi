[package]
name = "wabi-project-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

# Independent workspace: builds neither Authority nor frontend.
[workspace]

[dependencies]
axum = "=0.8.9"
base64 = "=0.22.1"
getrandom = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-util = "=0.7.19"
url = "=2.5.8"
uuid = { version = "=1.26.0", features = ["v4"] }
