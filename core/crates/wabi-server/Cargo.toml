[package]
name = "wabi-server"
version = "0.1.0"
edition = "2021"
description = "Wabi self-hosted server - single binary with mesh support"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }

# "Download project" archive for Lore repos
zip = { version = "2", default-features = false, features = ["deflate"] }

# Socket.IO server
socketioxide = { version = "0.16", features = ["extensions", "state"] }

# Embed static assets
rust-embed = { version = "8", features = ["include-exclude"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Wabi core protocol
wabi-core = { path = "../../../crates/wabi-core", features = ["ts"] }

# Mesh coordination (core functionality)
wabi-mesh = { path = "../../addons/mesh/backend" }

# Tailcat private-access transport (runtime-gated, like mesh)
wabi-tailcat = { path = "../../addons/tailcat/backend" }

# WabiDB engine (the new state engine, replacing SpacetimeDB)
wabidb = { path = "../wabidb" }
postcard = { version = "1", features = ["alloc"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Async utilities
async-trait = "0.1"
futures = "0.3"

# HTTP middleware
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "compression-br", "compression-gzip"] }

# Rate limiting
governor = { version = "0.6", features = ["std"] }
ipnet = "2"

# SpacetimeDB (HTTP API only)
reqwest = { version = "0.13", features = ["json", "query"] }
regex = "1"
sha2 = "0.11"
hex = "0.4"
rand = "0.8"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# JWT
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

# Password hashing
bcrypt = "0.17"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Command-line args
clap = { version = "4", features = ["derive"] }

# HMAC for TURN
hmac = "0.13"
sha1 = "0.11"
base64 = "0.22"

# mDNS LAN discovery
mdns-sd = "0.20"

# URL encoding
urlencoding = "2"

# Optional addons
wabi-webhooks = { path = "../../addons/webhooks/backend", optional = true }
wabi-lore = { path = "../../addons/lore/backend", optional = true }
age = { version = "0.11.3", default-features = false }

# Payments rails (roadmap Phases 2-4): compile-time-optional addons
wabi-payments-crypto = { path = "../../addons/payments-crypto/backend", optional = true }
wabi-payments-eu = { path = "../../addons/payments-eu/backend", optional = true }
wabi-payments-us = { path = "../../addons/payments-us/backend", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util", "timeout"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }

[features]
default = []
addons = ["wabi-webhooks", "wabi-lore"]
payments-rails = ["wabi-payments-crypto", "wabi-payments-eu", "wabi-payments-us"]

[lib]
name = "wabi_server"
path = "src/lib.rs"

[[bin]]
name = "wabi-server"
path = "src/main.rs"
