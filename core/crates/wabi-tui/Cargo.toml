[package]
name = "wabi-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal chat client for Wabi — keyboard-driven, runs anywhere with a shell"
authors = ["Ronin <wporterefl@gmail.com>"]
license = "MIT"
repository = "https://github.com/dotronin/wabi"
homepage = "https://github.com/dotronin/wabi"
keywords = ["chat", "tui", "terminal", "wabi", "cli"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.75"
exclude = [
  "../../frontend",
  "../../spacetimedb",
  "../../scripts",
  "../../data",
]

[dependencies]
# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
dirs = "5"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
