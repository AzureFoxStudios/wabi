[package]
name = "wabi-lore"
version = "0.1.0"
edition = "2021"
description = "Wabi Lore addon - version-controlled binary storage via Epic Games Lore"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
reqwest = { version = "0.13", features = ["stream"] }
http-body-util = "0.1"
futures-util = "0.3"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
hex = "0.4"
url = "=2.5.8"
tempfile = "3"
