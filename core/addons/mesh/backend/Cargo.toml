[package]
name = "wabi-mesh"
version = "0.1.0"
edition = "2021"
description = "Wabi mesh addon for multi-node coordination"
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"