services:
  backend:
    environment:
      DB_MODE: postgres
      WABI_MODE: community
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-wabi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wabi}
      POSTGRES_DB: ${POSTGRES_DB:-wabi}
      DATABASE_URL: postgresql://${POSTGRES_USER:-wabi}:${POSTGRES_PASSWORD:-wabi}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-wabi}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: wabi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wabi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wabi}
      POSTGRES_DB: ${POSTGRES_DB:-wabi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wabi} -d ${POSTGRES_DB:-wabi} -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
